function campVal(cfg, deals){ return cfg.metric==='count' ? deals.length : deals.reduce((a,d)=>a+(d.mwh||0),0); }
function campFmt(cfg, v){ return cfg.metric==='count' ? String(v) : v.toFixed(2); }
function campTier(cfg, v){ for(const t of cfg.tiers){ if(v>=t.v) return t; } return null; }
function campNext(cfg, v){ const asc=[...cfg.tiers].sort((a,b)=>a.v-b.v); for(const t of asc){ if(v<t.v) return t; } return null; }
function campFaltaTxt(cfg, falta){ return cfg.metric==='count' ? (falta===1?'1 cliente':falta+' clientes') : falta.toFixed(2)+' MWh'; }

// v2.104 — calcula prêmio atual e quanto falta pro próximo tier da campanha.

function renderCampProgress(cfg, val){
  const tier = campTier(cfg, val);
  const next = campNext(cfg, val);
  const premioTxt = tier
    ? `<span style="color:var(--green);font-weight:800">${tier.label}</span> garantido`
    : `<span style="color:var(--muted)">Sem prêmio ainda</span>`;
  const faltaTxt = next
    ? `Faltam <b>${campFaltaTxt(cfg, next.v - val)}</b> para ${next.label}`
    : `🎉 Faixa máxima atingida!`;
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0 2px">
      <div style="font-size:13px;color:var(--ink)">${premioTxt}</div>
      <div style="font-size:11px;color:var(--muted);text-align:right">${faltaTxt}</div>
    </div>`;
}

        <label>Correção monetária (IGP-M)</label>
        <div style="padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;background:#F7F8FC;color:var(--text);font-size:15px;font-weight:700">1% <span style="font-weight:400;color:var(--muted);font-size:12.5px">— fixo</span></div>
      </div>
      <div class="calc-result">
        <div class="calc-result-label">Valor total a devolver</div>
        <div class="calc-result-value" id="calc-total">R$ 0,00</div>
        <div class="calc-break">
          <div class="k">Meses restantes até 12</div><div class="v" id="calc-mr">–</div>
          <div class="k">Valor proporcional (pro-rata)</div><div class="v" id="calc-pr">–</div>
          <div class="k">Deságio comercial</div><div class="v" id="calc-ds">–</div>
          <div class="k">Valor + deságio</div><div class="v" id="calc-cd">–</div>
          <div class="k">Correção (IGP-M 1%)</div><div class="v" id="calc-co">–</div>
          <div class="k tr">Total a devolver</div><div class="v tr" id="calc-tr">–</div>
        </div>
      </div>
      <div class="calc-note"><strong>Fórmula:</strong> (Valor × meses restantes ÷ 12) × (1 + deságio) + correção IGP-M.<br>Deságio: <b>10%</b> saindo do 1º ao 6º mês · <b>5%</b> do 7º ao 12º. A correção IGP-M (1%) é aplicada sobre o valor já com deságio.</div>
    </div>`;
  document.body.appendChild(modal);
  var mrow = modal.querySelector('#calc-months');
  for(var m=1;m<=12;m++){
    (function(mm){
      var b=document.createElement('div');
      b.className='calc-month'+(mm===calcSaidaMes?' active':'');
      b.textContent=mm;
      b.onclick=function(){ calcSaidaMes=mm; mrow.querySelectorAll('.calc-month').forEach(function(x){x.classList.remove('active');}); b.classList.add('active'); calcSaidaCompute(); };
      mrow.appendChild(b);
    })(m);
  }
  modal.querySelector('#calc-valor').addEventListener('input', calcSaidaCompute);
  calcSaidaCompute();
}
function closeCalcSaida(){ var m=document.getElementById('calc-saida-modal'); if(m) m.remove(); }
function calcSaidaCompute(){
  var fmt=function(n){ return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); };
  var valor=parseFloat(document.getElementById('calc-valor').value)||0;
  var igpm=0.01; // IGP-M fixo em 1%
  var mes=calcSaidaMes;
  var mr=Math.max(12-mes,0);
  var ds=mes<=6?0.10:0.05;
  var pr=valor*(mr/12);
  var cd=pr*(1+ds);
  var co=cd*igpm;
  var total=cd+co;
  document.getElementById('calc-mr').textContent=mr;
  document.getElementById('calc-pr').textContent=fmt(pr);
  document.getElementById('calc-ds').textContent=(ds*100).toFixed(0)+'%';
  document.getElementById('calc-cd').textContent=fmt(cd);
  document.getElementById('calc-co').textContent=fmt(co);
  document.getElementById('calc-tr').textContent=fmt(total);
  document.getElementById('calc-total').textContent=fmt(total);
  var badge=document.getElementById('calc-badge');
  if(mes<=6){ badge.textContent='1º–6º mês · deságio 10%'; badge.className='calc-badge d10'; }
  else { badge.textContent='7º–12º mês · deságio 5%'; badge.className='calc-badge d5'; }
}

function _fmtDate(iso){
  if(!iso) return '—';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : iso;
}
function _fmtCPF(v){
  const d = String(v||'').replace(/\D/g,'');
  if (d.length !== 11) return v || '—';
  return `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6,9)}-${d.slice(9)}`;
}
function _fmtCNPJ(v){
  const d = String(v||'').replace(/\D/g,'');
  if (d.length !== 14) return v || '—';
  return `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8,12)}-${d.slice(12)}`;
}
function _fmtMoney(v){
  if (!v && v !== 0) return '—';
  return 'R$ ' + Number(v).toFixed(2).replace('.', ',').replace(/(\d)(?=(\d{3})+,)/g, '$1.');
}
function _fmtTel(v){
  const d = String(v||'').replace(/\D/g,'');
  if (d.length < 10) return v || '—';
  // +55 (XX) XXXXX-XXXX
  const start = d.length === 13 ? 2 : 0; // se já tem 55, pula
  const rest = d.slice(start);
  const ddd = rest.slice(0,2);
  const num = rest.slice(2);
  const sep = num.length === 9 ? 5 : 4;
  return `(${ddd}) ${num.slice(0,sep)}-${num.slice(sep)}`;
}

function dialLeadTel(ev){
  const el = document.getElementById('lead-tel');
  const raw = ((el && el.value) || '').trim();
  const digits = raw.replace(/\D/g,'');
  if (digits.length < 10) { alert('Digite o telefone com DDD (mín. 10 dígitos) antes de contatar.'); if (el) el.focus(); return; }
  // Abre o menu com as opções Ligar e WhatsApp (mesmo do detalhe do cliente)
  const shown = (typeof _fmtTel === 'function') ? _fmtTel(raw) : raw;
  openPhoneActions(shown, ev);
}

function openPhoneActions(tel, ev){
  if (ev) { ev.stopPropagation(); ev.preventDefault(); }
  const digits = (tel||'').replace(/\D/g,'');
  if (!digits || digits.length < 10) {
    alert('Esse cliente não tem telefone válido cadastrado.');
    return;
  }
  // Normaliza pra +55 (BR) se ainda não tem código de país
  const withCountry = digits.startsWith('55') ? digits : '55' + digits;
  const telHref = 'tel:+' + withCountry;
  const waHref  = 'https://wa.me/' + withCountry;

  const existing = document.getElementById('phone-actions-modal');
  if (existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'phone-actions-modal';
  overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };

  overlay.innerHTML = `

function copaNoPeriodo(x){ const d=(x.aprov_date||'').slice(0,10); return d>=COPA_INI && d<=COPA_END; }

function copaStats(){
  const aprov = rawData.filter(x => isAprovado(x) && copaNoPeriodo(x));
  const byS = {};
  // Snapshot fixo de junho (16-30/06) — rawData do mobile só tem o mês corrente
  Object.keys(COPA_JUNE).forEach(k => { byS[k] = { clientes: COPA_JUNE[k].c||0, baleias: COPA_JUNE[k].b||0 }; });
  aprov.forEach(x => {
    const k = x.s || '—';
    if(!byS[k]) byS[k] = { clientes:0, baleias:0 };
    if((x.fatura||0) > COPA_BALEIA_FATURA) byS[k].baleias++; else byS[k].clientes++;
  });
  const names = [...new Set([...Object.keys(byS), ...Object.keys(METAS)])];
  const rows = names.map(name => {
    const o = byS[name] || { clientes:0, baleias:0 };
    const fig = o.clientes + o.baleias*3;
    return { name, clientes:o.clientes, baleias:o.baleias, fig, unlocked:Math.min(fig,COPA_ALBUM) };
  }).sort((a,b)=> b.fig-a.fig || b.baleias-a.baleias || a.name.localeCompare(b.name));
  return rows;
}

    +     '<b>' + sel.fig + '</b><small>/44 figurinhas</small>'
    +     '<div class="copa-rbar big"><i style="width:' + selPct.toFixed(1) + '%"></i></div>'
    +     '<span class="copa-prog-sub">🎴 ' + sel.clientes + ' clientes · 🐋 ' + sel.baleias + ' baleias</span>'
    +   '</div>'
    + '</div>';

  COPA_GRUPOS.forEach(g => {
    html += '<div class="copa-grp-title">' + g.emoji + ' ' + g.nome + '</div><div class="copa-grid">';
    for(let n=g.ini; n<=g.fim; n++){
      const unlocked = n <= sel.unlocked;
      html += '<div class="copa-fig' + (unlocked?'':' lk') + '" onclick="openCopaFig(' + n + ',' + (unlocked?1:0) + ')">'
            +   '<img loading="lazy" src="' + copaImg(n) + '" alt="' + (COPA_NOMES[n]||'') + '">'
            +   (unlocked?'':'<span class="copa-lock">🔒</span>')
            + '</div>';
    }
    html += '</div>';
  });

  document.getElementById('s6-content').innerHTML = html;
}

function renderCampanha(){
  const tabs = Object.values(CAMP_CFG).map(c => {
    const on = CAMP_VIEW===c.key;
    return `<button onclick="setCampView('${c.key}')" style="flex:1;padding:9px 8px;border:none;border-radius:10px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;${on?'background:var(--blue);color:#fff':'background:#EEF0F6;color:var(--muted)'}">${c.btn}</button>`;
  }).join('');
  document.getElementById('s3-content').innerHTML =
    `<div style="display:flex;gap:8px;margin-bottom:12px">${tabs}</div>` + renderCampaignView(CAMP_CFG[CAMP_VIEW]);
}

function renderCampaignView(cfg){
  const campData = rawData.filter(x=>noPeriodo(x,cfg.ini,cfg.end)&&isAprovado(x));
  const byS = {};
  campData.forEach(x=>{ byS[x.s]=(byS[x.s]||0)+(cfg.metric==='count'?1:(x.mwh||0)); });
  const allCampSellers = [...new Set([...Object.keys(byS), ...Object.keys(METAS)])];
  const full = allCampSellers.map(name=>({name,val:byS[name]||0,meta:METAS[name]||15})).sort((a,b)=>b.val-a.val);
  const totalCamp = full.reduce((a,s)=>a+s.val,0);
  const medals = ['🥇','🥈','🥉'];

  let html = `
    <div class="camp-header">
      <div class="camp-title">${cfg.title}</div>
      <div class="camp-period">${cfg.period}</div>
      <div class="camp-sub">${cfg.metric==='count'?'Clientes aprovados':'Aprovados'} · ${cfg.totalWord}: ${campFmt(cfg,totalCamp)}${cfg.metric==='count'?' aprovados':' MWh'}</div>
    </div>

    <div class="rules-card">
      <div class="rules-title">📋 Regras da Campanha</div>
      <div class="rules-desc">${cfg.desc}</div>
      <div class="tiers-grid${cfg.tiers.length===3?' three-col':''}">
        ${[...cfg.tiers].sort((a,b)=>a.v-b.v).map(t=>`<div class="tier tier-${t.tier}"><div class="tier-mwh">${t.v} ${cfg.tierUnit}</div><div class="tier-prize">${t.label}</div></div>`).join('')}
      </div>
    </div>`;

  full.forEach((s,i)=>{
    const has = s.val > 0;
    const mesData = rawData.filter(x=>x.s===s.name&&noMes(x)&&isAprovado(x));
    const mes = mesData.reduce((a,x)=>a+x.mwh,0);
    const pct = s.meta>0?Math.min((mes/s.meta)*100,100):0;
    const pc = pct>=70?'var(--green)':pct>=40?'var(--blue)':'var(--red)';
    const tier = campTier(cfg, s.val);
    const next = campNext(cfg, s.val);
    const prizeInfo = tier ? `<span class="prize-badge b${tier.tier}">🏆 ${tier.label}</span>` : '';
    let nextInfo = '';
    if (next) nextInfo = `<div class="prize-empty">Faltam ${campFaltaTxt(cfg, next.v - s.val)} para ${next.label}</div>`;
    const safeName = s.name.replace(/'/g, "\\'");
    const cardClass = has ? 'rank-card clickable' : 'rank-card';
    const cardOnclick = has ? `onclick="openCampDetails('${safeName}', '${cfg.key}')"` : '';
    html += `
      <div class="${cardClass}" ${cardOnclick}>
        <div class="rank-num ${i<3&&has?'top':''}">${i<3&&has?medals[i]:i+1}</div>
        ${avatarImg(s.name, 'rank-avatar')}
        <div class="rank-info">
          <div class="rank-name">${s.name}${prizeInfo}</div>
          <div class="rank-praca" style="color:${isLider(s.name)?'var(--muted)':pc}">Mês: ${mes.toFixed(1)} MWh${isLider(s.name)?'':` · ${pct.toFixed(0)}% da meta`}</div>
          ${nextInfo}
        </div>
        <div class="rank-right">
          <div class="rank-mwh ${has?'':'zero'}">${has?campFmt(cfg,s.val):'—'}</div>
          <div class="rank-unit">${has?cfg.unit:''}</div>
        </div>
      </div>`;
  });
  return html;
}

function filterPropByPeriod(data, period){
  if(period === 'mes') return data; // todo o mês já filtrado
  // Calcula data de referência (PROP_TODAY)
  const ref = new Date(PROP_TODAY + 'T00:00:00');
  if(period === 'd0'){
    return data.filter(r => r.date === PROP_TODAY);
  }
  if(period === 'd1'){
    const y = new Date(ref); y.setDate(y.getDate()-1);
    const ystr = y.toISOString().slice(0,10);
    return data.filter(r => r.date === ystr);
  }
  if(period === 'semana'){
    // Semana atual: do início da semana (segunda) até hoje
    const start = new Date(ref);
    const day = start.getDay(); // 0=dom, 1=seg ... 5=Friday
    const diff = (day === 0 ? 6 : day - 1); // dias desde segunda
    start.setDate(start.getDate() - diff);
    const startStr = start.toISOString().slice(0,10);
    return data.filter(r => r.date >= startStr && r.date <= PROP_TODAY);
  }
  if(period === 's1'){
    // Semana passada: segunda a domingo da semana anterior
    const start = new Date(ref);
    const day = start.getDay();
    const diff = (day === 0 ? 6 : day - 1);
    start.setDate(start.getDate() - diff - 7);   // segunda da semana passada
    const end = new Date(start); end.setDate(end.getDate() + 6); // domingo
    const startStr = start.toISOString().slice(0,10);
    const endStr = end.toISOString().slice(0,10);
    return data.filter(r => r.date >= startStr && r.date <= endStr);
  }
  return data;
}

// v2.137 — testa se uma data ISO (YYYY-MM-DD) cai no período selecionado das Tarefas de Venda.
// Mesma semântica do desktop (dateInRealPeriod): D0=hoje, D-1=ontem, Semana=segunda→hoje, Mês=mês corrente.
// Tudo ancorado em PROP_TODAY (fuso Brasília) e em aritmética UTC p/ não sofrer drift de fuso.
function tarefaInPeriod(ds){
  if(!ds) return false;
  ds = String(ds).slice(0,10);
  const T = PROP_TODAY;
  if(propPeriod === 'mes') return ds.slice(0,7) === T.slice(0,7);
  const [y,m,d] = T.split('-').map(Number);
  if(propPeriod === 'd0') return ds === T;
  if(propPeriod === 'd1'){
    const yd = new Date(Date.UTC(y, m-1, d-1)).toISOString().slice(0,10);
    return ds === yd;
  }
  if(propPeriod === 'semana'){
    const ref = new Date(Date.UTC(y, m-1, d));
    const dow = ref.getUTCDay(); const off = (dow === 0 ? 6 : dow - 1);
    const start = new Date(ref.getTime() - off*86400000).toISOString().slice(0,10);
    return ds >= start && ds <= T;
  }
  if(propPeriod === 's1'){
    const ref = new Date(Date.UTC(y, m-1, d));
    const dow = ref.getUTCDay(); const off = (dow === 0 ? 6 : dow - 1);
    const start = new Date(ref.getTime() - (off+7)*86400000);
    const end = new Date(start.getTime() + 6*86400000);
    return ds >= start.toISOString().slice(0,10) && ds <= end.toISOString().slice(0,10);
  }
  return true;
}

    loadLeads().then(() => { const e = document.getElementById('s4-content'); if (e && e.offsetParent !== null) renderPropostas(); });
  }

  // v2.104 — Ranking é sempre do time todo (não filtra pela identidade/seller-select).
  let data = RAW_PROP;
  data = filterPropByPeriod(data, propPeriod);

  const totalProp = data.length;
  const totalMwh  = data.reduce((a,r)=>a+r.consumption_mwh,0);
  const totalCli  = new Set(data.map(r=>r.current_client_name)).size;
  const accepted  = data.filter(r=>r.accepted_proposal).length;
  const convRate  = totalProp>0?((accepted/totalProp)*100).toFixed(1):0;

  // By praça
  const pracas = {};
  data.forEach(r=>{
    if(!pracas[r.praca]) pracas[r.praca]={prop:0,mwh:0};
    pracas[r.praca].prop++;
    pracas[r.praca].mwh+=r.consumption_mwh;
  });

  // By seller — ordena pela métrica selecionada
  const sellers = {};
  data.forEach(r=>{
    if(!sellers[r.seller]) sellers[r.seller]={prop:0,mwh:0,aprov:0,aprovCount:0,tarefas:0};
    sellers[r.seller].prop++;
    sellers[r.seller].mwh+=r.consumption_mwh;
  });

  // v2.104 — MWh APROVADO por vendedor (vem de rawData/deals, não de propostas).
  // Respeita o mesmo filtro de período, mas pela data de aprovação (aprov_date).
  const aprovBase = rawData
    .filter(x => isAprovado(x))
    .map(x => ({ seller: x.s, mwh: x.mwh, date: x.aprov_date }));
  filterPropByPeriod(aprovBase, propPeriod).forEach(r=>{
    if(!sellers[r.seller]) sellers[r.seller]={prop:0,mwh:0,aprov:0,aprovCount:0,tarefas:0};
    sellers[r.seller].aprov += r.mwh;
    sellers[r.seller].aprovCount += 1;
  });

  // v2.137 — Tarefas de Venda: MESMA lógica/recorte do desktop (Tarefas de Vendas — Por Vendedor).
  // Conta = leads CRIADOS no período OU com PRÓXIMA INTERAÇÃO no período (stage ativo, exclui ganho/perdido).
  // Respeita o período selecionado (D0/D-1/Semana/Mês) no fuso de Brasília — antes ficava fixo em "hoje".
  const brDateMs = ms => { try { return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo'}).format(new Date(ms)); } catch(e){ return ''; } };
  // stages que o desktop normaliza p/ ganho/perdido (normalizeStage) e portanto NÃO contam como tarefa agendada ativa
  const INACTIVE_STAGES = ['ganho','won','signing_contract','active_member','perdido','lost'];
  (window.leads||[])
    .filter(l => String((l&&l.stage)||'').trim().toLowerCase() !== 'excluido')
    .forEach(l=>{
      const st = String((l&&l.stage)||'').trim().toLowerCase();
      const stageActive = INACTIVE_STAGES.indexOf(st) === -1;
      const createdISO = l.createdAt ? brDateMs(l.createdAt) : '';
      const criInPeriod = !!createdISO && tarefaInPeriod(createdISO);            // criados: qualquer stage (= criadosHoje do desktop)
      const proxISO = l.proximaInteracao ? String(l.proximaInteracao).slice(0,10) : '';
      const agInPeriod  = !!proxISO && tarefaInPeriod(proxISO) && stageActive;   // agendados: só stage ativo (= agHoje do desktop)
      if(criInPeriod || agInPeriod){
        const v = canonicalVendedor(l.vendedor||'');
        // resolve para nome canônico via EMAIL_NAME reverso
        const nome = Object.entries(CREDENTIALS).find(([,c])=>canonicalVendedor(c.nome)===v)?.[1]?.nome || l.vendedor;
        if(!sellers[nome]) sellers[nome]={prop:0,mwh:0,aprov:0,aprovCount:0,tarefas:0};
        sellers[nome].tarefas++;
      }
    });

  // v2.104 — vendedores fora do time: somem da LISTA do ranking, mas os números
  // continuam somando nos totais de praça (pracas vem de `data`, não daqui).
  const RANK_HIDDEN = ['Ananias Neto','Rosangela Mendes'];
  const topSellers = Object.entries(sellers)
    .filter(([name]) => !RANK_HIDDEN.includes(name))
    .sort((a,b)=>{
    if(propMetric === 'aprovado') return b[1].aprov - a[1].aprov;
    if(propMetric === 'qtd')      return b[1].aprovCount - a[1].aprovCount;
    if(propMetric === 'tarefas')  return b[1].tarefas - a[1].tarefas;
    return b[1].prop - a[1].prop;
  });

  const PC = {'Salvador':'#1D9E75','Feira de Santana':'#EF9F27','Natal':'#378ADD','CE':'#D4537E','SPI':'#7F77DD','Outros':'#888'};

  // Filtros de período + toggle métrica
  // v2.157 — aviso quando o S-1 (semana passada) inclui dias do mês anterior (fora da base do mês corrente)
  let s1Note = '';
  if(propPeriod === 's1'){
    const _r = new Date(PROP_TODAY + 'T00:00:00');
    const _day = _r.getDay(); const _diff = (_day === 0 ? 6 : _day - 1);
    const _wk = new Date(_r); _wk.setDate(_wk.getDate() - _diff - 7);

    }
  }
  let html = `
    <div class="filter-tabs">
      <div class="filter-tab ${propPeriod==='d0'?'active':''}" onclick="setPropPeriod('d0')">D0 · Hoje</div>
      <div class="filter-tab ${propPeriod==='d1'?'active':''}" onclick="setPropPeriod('d1')">D-1 · Ontem</div>

      <div class="filter-tab ${propPeriod==='mes'?'active':''}" onclick="setPropPeriod('mes')">Mês</div>
    </div>${s1Note}`;

  html += `<div class="section-head">Ranking por Vendedor</div>
    <div class="rk-seg">
      <div class="rk-seg-btn ${propMetric==='aprovado'?'active':''}" onclick="setPropMetric('aprovado')"><span class="ic">⚡</span><span class="lb">MWh aprov.</span></div>
      <div class="rk-seg-btn ${propMetric==='qtd'?'active':''}" onclick="setPropMetric('qtd')"><span class="ic">👥</span><span class="lb">Clientes</span></div>
      <div class="rk-seg-btn ${propMetric==='propostas'?'active':''}" onclick="setPropMetric('propostas')"><span class="ic">📋</span><span class="lb">Propostas</span></div>
      <div class="rk-seg-btn ${propMetric==='tarefas'?'active':''}" onclick="setPropMetric('tarefas')"><span class="ic">🤝</span><span class="lb">Visitas</span></div>
    </div>
    <div class="rk-scope">
      ${[['','Todas'],['salvador','Salvador'],['feira','Feira'],['natal','RN Capital'],['rninterior','RN Interior'],['spi','Campinas SPI'],['ribeirao','Ribeirão SPI'],['ce','CE']].map(o=>`<div class="rk-chip ${rankScope===o[0]?'active':''}" onclick="setRankScope('${o[0]}')">${o[1]}</div>`).join('')}
    </div>`;

  // Filtra vendedores pela praça selecionada
  const filteredSellers = rankScope
    ? topSellers.filter(([name])=> (SELLER_PRACA[name]||'outras') === rankScope)
    : topSellers;

  const medals = ['🥇','🥈','🥉'];

  function renderSellerCard(name, d, i){
    const isMe = name === (typeof getCurrentVendedor==='function'?getCurrentVendedor():'');
    let mainVal, mainUnit, subInfo;
    if(propMetric === 'aprovado'){
      mainVal = d.aprov.toFixed(1); mainUnit = 'MWh aprov.';
      subInfo = `✅ ${d.aprovCount} aprov · 📋 ${d.prop} props · 🤝 ${d.tarefas} visitas`;
    } else if(propMetric === 'qtd'){
      mainVal = d.aprovCount; mainUnit = d.aprovCount===1?'aprovado':'aprovados';
      subInfo = `⚡ ${d.aprov.toFixed(1)} MWh · 📋 ${d.prop} props · 🤝 ${d.tarefas} visitas`;
    } else if(propMetric === 'tarefas'){
      mainVal = d.tarefas; mainUnit = 'visitas';
      subInfo = `📋 ${d.prop} props · ⚡ ${d.aprov.toFixed(1)} MWh aprov.`;
    } else {
      mainVal = d.prop; mainUnit = 'props';
      subInfo = `🤝 ${d.tarefas} visitas · ⚡ ${d.aprov.toFixed(1)} MWh aprov.`;
    }
    const hasMwh = d.aprov > 0;
    const cardClass = (hasMwh ? 'rank-card clickable' : 'rank-card') + (isMe ? ' rank-me' : '');
    return `
      <div class="${cardClass}" ${hasMwh?`onclick="openRankSellerModal(this)"`:''} data-name="${name}" data-metric="${propMetric}" data-period="${propPeriod}">

        </div>

  }

  if(filteredSellers.length === 0){
    html += `<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">Sem dados neste período</div></div>`;
  } else {
    filteredSellers.forEach(([name,d],i)=>{ html += renderSellerCard(name,d,i); });
  }

  el.innerHTML = html;
}

// (aí também é preciso adicionar a foto). Tudo o mais (senha/praça/posição/meta) vem da planilha.
const EMAIL_NOME = Object.fromEntries(
  Object.entries(CREDENTIALS).map(([email, c]) => [email, c.nome])
);

// Normaliza o texto da coluna "Praça" da planilha → chave interna + rótulo exibido
function normPracaKey(txt){
  const s = (txt||'').toString().trim().toLowerCase();
  if(s.startsWith('salvador')) return 'salvador';
  if(s.startsWith('feira'))    return 'feira';
  if(s.startsWith('natal') || s === 'rn' || s.includes('capital')) return 'natal';
  if(s.includes('mossor') || s.includes('rn interior') || s === 'rninterior') return 'rninterior';
  if(s.includes('ribeir')) return 'ribeirao';
  if(s === 'spi' || s.includes('paulo') || s.includes('cpfl') || s.includes('interior') || s.includes('campinas')) return 'spi';
  if(s === 'ce' || s.includes('cear') || s.includes('fortaleza') || s.includes('enel')) return 'ce';
  return 'outras';
}
const PRACA_LABEL = { salvador:'Salvador', feira:'Feira de Santana', natal:'RN Capital', rninterior:'RN Interior', spi:'Campinas SPI', ribeirao:'Ribeirão Preto SPI', ce:'CE', outras:'Outros' };

// Aplica as linhas da aba Time (vindas do Apps Script) nas estruturas vivas do CRM.
// rows: [{ email, praca, posicao, meta, senha }]
function applyTeam(rows){
  if(!Array.isArray(rows) || !rows.length) return false;

  const novoVend = [];
  const ordem = ['Salvador','Feira de Santana','RN Capital','RN Interior','Campinas SPI','Ribeirão Preto SPI','CE'];

  rows.forEach(r => {
    const email = (r.email||'').toString().trim().toLowerCase();
    if(!email) return;
    const nome = EMAIL_NOME[email];
    if(!nome) return; // e-mail desconhecido: ignora (precisa entrar no EMAIL_NOME + foto)

    const key   = normPracaKey(r.praca);
    const label = PRACA_LABEL[key] || 'Outros';
    const pos   = (r.posicao||'').toString().trim().toLowerCase();
    const senha = (r.senha!=null ? String(r.senha) : (CREDENTIALS[email]?.senha || '')).trim();
    const meta  = (r.meta!=null && r.meta!=='' && !isNaN(parseFloat(r.meta))) ? parseFloat(r.meta) : (METAS[nome]||0);

    // Credenciais (login)
    CREDENTIALS[email] = { nome, senha };

    // Gestor (admin): fica em "Outros", não entra na lista de vendedores normais
    if(pos.startsWith('gest') || nome === 'Felipe Oliveira'){
      delete LIDERES[nome];
      return;
    }

    // Praça / meta
    SELLER_PRACA[nome] = key;
    METAS[nome] = meta;

    // Posição: líder vê a praça toda; consultor vê só ele
    if(pos.startsWith('lid') || pos.startsWith('líd')) LIDERES[nome] = key;
    else delete LIDERES[nome];

    novoVend.push({ nome, praca: label });
  });

  if(!novoVend.length) return false;

  // Reconstrói a lista de vendedores (ordenada por praça) + admin no fim
  novoVend.sort((a,b) => ordem.indexOf(a.praca) - ordem.indexOf(b.praca));
  novoVend.push({ nome: 'Felipe Oliveira', praca: 'Outros' });
  VENDEDORES = novoVend;

  // Re-deriva a praça de cada deal (depende de SELLER_PRACA) e re-renderiza
  try { rawData.forEach(x => x.praca = getPraca(x.city, x.s)); } catch(e){}
  try {
    initSellerSelect(true);
    renderIdentityBadge();
    if(typeof currentScreen !== 'undefined'){
      if(currentScreen==='resumo')   renderResumo();
      if(currentScreen==='carteira') renderCarteira();
      if(currentScreen==='propostas')renderPropostas();
    }
  } catch(e){}
  return true;
}

}

// ── chamada à API do Google Sheets ──
async function apiCall(action, payload, opts){
  if (!LEADS_API_ENABLED) {
    throw new Error('API offline');
  }
  const timeoutMs = (opts && opts.timeoutMs) || 30000; // v2.53 — 30s timeout
  const body = Object.assign({ action }, payload || {});
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const resp = await fetch(LEADS_API_URL, {
      method: 'POST',
      // Apps Script é estrito com Content-Type; text/plain evita preflight CORS
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
      signal: ctrl.signal
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const _txt = await resp.text();
    let data;
    try { data = JSON.parse(_txt); }
    catch(_e){ throw new Error(String(_txt).trim().charAt(0)==='<' ? 'Sincronizando… tente Atualizar' : 'resposta inválida da base'); }
    if (!data.ok) throw new Error(data.error || 'erro desconhecido');
    return data;
  } catch (err) {
    if (err && err.name === 'AbortError') {
      throw new Error(`tempo esgotado (${timeoutMs/1000}s) — sincronização lenta, tente de novo`);
    }
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

// v2.24: normaliza data pra YYYY-MM-DD (input type=date só aceita esse formato).
// Cobre o caso do Apps Script devolver a data com hora (ISO) ou em dd/mm/aaaa.
function normalizeDateStr(v){
  if(v === null || v === undefined) return '';
  let s = String(v).trim();
  if(!s) return '';
  // Já começa com YYYY-MM-DD (inclui ISO "2026-06-10T03:00:00Z") → pega a parte da data
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  // dd/mm/aaaa ou dd-mm-aaaa
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  return '';
}

// v2.154 — cache local persistente da ultima carga boa de leads (localStorage).
// Motivo: a resposta do Apps Script e grande (~3MB / milhares de leads) e leva ~15-20s;
// em rede movel a conexao as vezes cai no meio ("Failed to fetch"). Sem cache persistente,
// um sync falho num cold start cairia no seed fake. Com cache, o vendedor ve a ultima base real.
const LEADS_CACHE_KEY = 'liora.leads_cache_v1';
let leadsFromCache = false;   // true quando window.leads veio do cache (nao do sync vivo)
let leadsCacheTs = 0;         // timestamp (ms) da carga em cache exibida
function saveLeadsCache(leads){
  try {
    localStorage.setItem(LEADS_CACHE_KEY, JSON.stringify({ ts: Date.now(), leads: leads }));
  } catch(e){
    // quota estourou (base muito grande): guarda so os leads do vendedor logado como fallback minimo
    try {
      const me = (typeof canonicalVendedor==='function' && typeof getCurrentVendedor==='function')
        ? canonicalVendedor(getCurrentVendedor()||'') : '';
      const mine = me ? leads.filter(l => l && canonicalVendedor(l.vendedor||'')===me) : [];
      localStorage.setItem(LEADS_CACHE_KEY, JSON.stringify({ ts: Date.now(), leads: mine, partial: true }));
    } catch(_e){ /* desiste em silencio */ }
  }
}
function readLeadsCache(){
  try {
    const raw = localStorage.getItem(LEADS_CACHE_KEY);
    if(!raw) return null;
    const obj = JSON.parse(raw);
    if(obj && Array.isArray(obj.leads) && obj.leads.length) return obj;
  } catch(_e){}
  return null;
}
function fmtCacheTs(ms){
  try{
    const d=new Date(ms), z=n=>String(n).padStart(2,'0');
    const t=new Date();
    const same=d.getDate()===t.getDate()&&d.getMonth()===t.getMonth()&&d.getFullYear()===t.getFullYear();
    return (same?'hoje':`${z(d.getDate())}/${z(d.getMonth()+1)}`)+` ${z(d.getHours())}:${z(d.getMinutes())}`;
  }catch(e){return '';}
}

// v2.155 — auto-recuperacao: se o sync falhar, tenta sozinho em segundo plano
// (15s, 30s, 45s, 60s, 60s) ate voltar, sem o usuario precisar tocar em Atualizar.
let _leadsRetryTimer = null, _leadsRetryCount = 0;
function scheduleLeadsAutoRetry(){
  if (_leadsRetryTimer || _leadsRetryCount >= 5) return;
  const delay = Math.min(15000 * (_leadsRetryCount + 1), 60000);
  _leadsRetryTimer = setTimeout(async () => {
    _leadsRetryTimer = null; _leadsRetryCount++;
    leadsLoaded = false;               // permite recarregar
    await loadLeads();
    if (!leadsLoadError) {              // voltou ao normal: re-renderiza e zera
      _leadsRetryCount = 0;
      try { if (typeof renderFunil === 'function') renderFunil(); } catch(_e){}
    } else {
      scheduleLeadsAutoRetry();         // ainda falhando: agenda a proxima
    }
  }, delay);
}
function resetLeadsAutoRetry(){
  if (_leadsRetryTimer) { clearTimeout(_leadsRetryTimer); _leadsRetryTimer = null; }
  _leadsRetryCount = 0;
}

async function loadLeads(){
  if (leadsLoaded) return;
  if (!LEADS_API_ENABLED) {
    // Modo offline — usa seed
    window.leads = JSON.parse(JSON.stringify(LEADS_SEED));
    leadsLoaded = true;
    return;
  }
  try {
    // v2.140 — rede movel + payload ~2MB as vezes estoura o timeout; tenta 2x (45s, depois 60s)
    // com pequena pausa entre elas, antes de cair no cache local. Reduz o "Erro ao sincronizar" transitorio.
    let data, lastErr=null;
    const _pauses=[900,1800];
    for (let attempt=1; attempt<=3; attempt++){
      try { data = await apiCall('list', null, { timeoutMs: attempt===1 ? 45000 : 60000 }); lastErr=null; break; }
      catch(e){ lastErr=e; if(attempt<3) await new Promise(r=>setTimeout(r,_pauses[attempt-1])); }
    }
    if (lastErr) throw lastErr;
    window.leads = (data.leads || [])
      // v2.29: descarta leads marcados como excluídos no Sheets (kept para histórico,
      // mas não devem entrar em window.leads — senão contam no header e somem das abas).
      .filter(l => l && l.stage !== 'excluido')
      .map(l => {
        // v2.24: garante proximaInteracao em YYYY-MM-DD (senão o campo de data não preenche)
        l.proximaInteracao = normalizeDateStr(l.proximaInteracao);
        return l;
      });
    leadsLoaded = true;
    leadsLoadError = '';
    leadsFromCache = false;
    leadsCacheTs = 0;
    saveLeadsCache(window.leads);   // guarda a ultima carga boa
    resetLeadsAutoRetry();
  } catch (err) {
    leadsLoadError = err.message;
    // Fallback: mantém leads em memória se houver, senão usa seed
    if (window.leads.length === 0) {
      const cached = readLeadsCache();
      if (cached) {
        window.leads = cached.leads;
        leadsFromCache = true;
        leadsCacheTs = cached.ts || 0;
      } else {
        window.leads = JSON.parse(JSON.stringify(LEADS_SEED));
      }
    }
    leadsLoaded = true;  // marca como carregado pra não ficar em loop
    scheduleLeadsAutoRetry();   // tenta se recuperar sozinho em segundo plano
  }
}

// v2.22: lê o desfecho direto do formulário (DOM) e sincroniza no _leadQualif.
// Evita estado velho do _leadQualif e garante que validação e save usem o que está na tela.
function syncDesfechoFromDOM(){
  window._leadQualif = window._leadQualif || {};
  const prox = (document.getElementById('lead-proxima-interacao')?.value || '').trim();
  const lostChk = !!(document.getElementById('lead-lost-chk') && document.getElementById('lead-lost-chk').checked);
  const lostReason = (document.getElementById('lead-lost-reason')?.value || '').trim();
  window._leadQualif.proximaInteracao = prox;
  window._leadQualif.lost = lostChk;
  window._leadQualif.lostReason = lostChk ? lostReason : '';
  return { temProxima: !!prox, temMotivoPerdido: lostChk && !!lostReason };
}

// v2.44: lê TODOS os campos de qualificação direto do DOM e atualiza _leadQualif.
// Garante que dados preenchidos no form não se percam por (a) handler que não disparou
// a tempo, (b) prefill em edição que só aplica classe CSS sem atualizar o objeto, ou
// (c) pills nunca tocados em uma edição (cujo valor original seria sobrescrito por '').
function syncQualifFromDOM(){
  window._leadQualif = window._leadQualif || {};
  const q = window._leadQualif;
  const isOn = id => !!document.getElementById(id)?.classList.contains('active');
  const val  = id => (document.getElementById(id)?.value || '').trim();

  // Desfecho (proximaInteracao, lost, lostReason)
  syncDesfechoFromDOM();

  // Observações livres (textarea)
  q.obs = (document.getElementById('lead-obs')?.value || '').slice(0, 500);

  // TD (Toda Distribuidora? — pills TDS/TDN)
  q.td = isOn('td-tds') ? 'TDS' : isOn('td-tdn') ? 'TDN' : '';

  // Temperatura (Frio/Morno/Quente)
  q.temperatura = isOn('temp-frio') ? 'Frio' : isOn('temp-morno') ? 'Morno' : isOn('temp-quente') ? 'Quente' : '';

  // Schedule (multi-select via .schedule-cell.active)
  q.schedule = Array.from(document.querySelectorAll('.schedule-cell.active'))
    .map(c => `${c.dataset.dia}-${c.dataset.periodo}`);

  // CNPJ (Sim/Não pills + input cnpj)
  q.temCnpj = isOn('cnpj-sim') ? 'Sim' : isOn('cnpj-nao') ? 'Não' : '';
  q.cnpj = q.temCnpj === 'Sim' ? val('lead-cnpj') : '';

  // Crédito (Sim/Não/Não abordei pills)
  q.interesseCredito = isOn('credito-sim') ? 'Sim'
                     : isOn('credito-nao') ? 'Não'
                     : isOn('credito-na')  ? 'Não abordei'
                     : '';

  // Produtos apresentados (multi-select via PRODUTOS_BTN_MAP)
  q.produtos = Object.entries(PRODUTOS_BTN_MAP)
    .filter(([_, btnId]) => isOn(btnId))
    .map(([prod, _]) => prod);

  // v2.55 — extras condicionais do motivo de perdido
  const _resto = document.getElementById('lead-lost-resto');
  const _conc  = document.getElementById('lead-lost-concorrencia');
  q.lostRestoFatura = _resto ? (parseInt(_resto.value || '0', 10) || 0) : (q.lostRestoFatura || 0);
  q.lostConcorrenciaNome = _conc ? (_conc.value || '').trim() : (q.lostConcorrenciaNome || '');

  return q;
}

// v2.23: habilita/desabilita o botão "Cadastrar/Atualizar Lead" conforme a regra completa
// (Nome + Bairro + Cidade + desfecho: próxima interação OU perdido com motivo).
function updateSaveButtonState(){
  const btn = document.getElementById('btn-save-lead');
  if(!btn) return;
  const nome   = (document.getElementById('lead-nome')?.value || '').trim();
  const cidade = (document.getElementById('lead-cidade')?.value || '').trim();
  const bairro = (document.getElementById('lead-bairro')?.value || '').trim();
  const prox   = (document.getElementById('lead-proxima-interacao')?.value || '').trim();
  const lostChk = !!(document.getElementById('lead-lost-chk') && document.getElementById('lead-lost-chk').checked);
  const lostReason = (document.getElementById('lead-lost-reason')?.value || '').trim();
  const temDesfecho = !!prox || (lostChk && !!lostReason);
  // v2.48 — TD virou obrigatório
  const temTD = !!(document.getElementById('td-tds')?.classList.contains('active')
                || document.getElementById('td-tdn')?.classList.contains('active'));

  // v2.55 — extras condicionais dos motivos de perdido
  const fatura = parseInt(document.getElementById('lead-fatura')?.value || '0', 10) || 0;
  const restoVal = parseInt(document.getElementById('lead-lost-resto')?.value || '0', 10) || 0;
  const concorrencia = (document.getElementById('lead-lost-concorrencia')?.value || '').trim();
  const exigeFatura  = lostChk && LOST_REQ_FATURA_AVISO.indexOf(lostReason) >= 0;
  const exigeResto   = lostChk && LOST_REQ_RESTO_FATURA.indexOf(lostReason) >= 0;
  const exigeConc    = lostChk && LOST_REQ_CONCORRENCIA.indexOf(lostReason) >= 0;
  const okFatura = !exigeFatura || fatura > 0;
  const okResto  = !exigeResto || restoVal > 0;
  const okConc   = !exigeConc || !!concorrencia;

  const canSave = !!nome && !!cidade && !!bairro && temDesfecho && temTD && okFatura && okResto && okConc;
  btn.disabled = !canSave;
  btn.style.opacity = canSave ? '' : '0.45';
  btn.style.cursor = canSave ? '' : 'not-allowed';
  // Dica do que falta (só no cadastro/edição, sem sobrescrever o fluxo de proposta)
  const hint = document.getElementById('form-actions-hint');
  if(hint){
    if(canSave){
      hint.textContent = 'Tudo certo — pode salvar o lead.';
      hint.style.color = '#157A55';
    } else {
      const faltam = [];
      if(!nome) faltam.push('Nome');
      if(!bairro) faltam.push('Bairro');
      if(!cidade) faltam.push('Cidade');
      if(!temTD) faltam.push('Tomador de Decisão (TDS ou TDN)');
      if(!temDesfecho) faltam.push('próxima interação OU perdido + motivo');
      if(!okFatura) faltam.push('Fatura média (obrigatória pra "Plan usina própria")');
      if(!okResto) faltam.push('Quanto cliente paga (R$) com a usina');
      if(!okConc) faltam.push('Nome da concorrência');
      hint.textContent = 'Falta: ' + faltam.join(' · ');
      hint.style.color = '#B91C1C';
    }
  }
}

      // Lead perdido

function formatCnpj(v){
  // Formata 00.000.000/0000-00 enquanto digita
  const d = (v || '').replace(/\D/g, '').slice(0, 14);
  if(d.length <= 2) return d;
  if(d.length <= 5) return `${d.slice(0,2)}.${d.slice(2)}`;
  if(d.length <= 8) return `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5)}`;
  if(d.length <= 12) return `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8)}`;
  return `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8,12)}-${d.slice(12)}`;
}

function onCnpjInput(el){
  el.value = formatCnpj(el.value);
  window._leadQualif = window._leadQualif || {};
  window._leadQualif.cnpj = el.value;
}

        <div class="form-hint">Digite só os números — formatação automática</div>

// ⭐ v2.10 — Data da próxima interação
function onProximaInteracaoInput(el){
  const value = el.value; // formato YYYY-MM-DD
  window._leadQualif = window._leadQualif || {};
  window._leadQualif.proximaInteracao = value || '';
  updateSaveButtonState();

  // Hint amigável: "Daqui 3 dias" / "Amanhã" / "Hoje"
  const hint = document.getElementById('proxima-interacao-hint');
  if (!hint) return;
  if (!value) {
    hint.style.display = 'none';
    hint.textContent = '';
    return;
  }
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(value + 'T00:00:00');
  const diffDays = Math.round((target - today) / 86400000);
  let label = '';
  if (diffDays === 0) label = '📅 Hoje';
  else if (diffDays === 1) label = '📅 Amanhã';
  else if (diffDays > 1) label = `📅 Daqui ${diffDays} dias`;
  else label = `⚠️ ${Math.abs(diffDays)} dia(s) atrás`;
  hint.textContent = label;
  hint.style.display = 'block';
  hint.style.color = diffDays < 0 ? '#DC2626' : 'var(--blue)';

  updateStagePreview();
}

const PRODUTOS_BTN_MAP = {
  'Energia com desconto': 'prod-desconto',
  'Liora Empresa': 'prod-empresa',
  'Liora Antecipa': 'prod-antecipa',
  'Nenhum': 'prod-nenhum'

function toggleProduto(produto){
  window._leadQualif = window._leadQualif || {};
  window._leadQualif.produtos = window._leadQualif.produtos || [];
  let list = window._leadQualif.produtos;

  const idx = list.indexOf(produto);
  if (idx >= 0) {
    // já estava marcado → desmarca
    list.splice(idx, 1);
  } else {
    // marcando agora
    if (produto === 'Nenhum') {
      // "Nenhum" é exclusivo: limpa tudo e marca só ele
      list = ['Nenhum'];
    } else {
      // qualquer produto real: remove "Nenhum" se estiver marcado e adiciona o novo
      list = list.filter(p => p !== 'Nenhum');
      list.push(produto);
    }
  }
  window._leadQualif.produtos = list;

  // Atualiza UI
  Object.keys(PRODUTOS_BTN_MAP).forEach(p => {
    const btn = document.getElementById(PRODUTOS_BTN_MAP[p]);
    if (btn) btn.classList.toggle('active', list.includes(p));
  });

  updateStagePreview();
}

function setTD(val){
  window._leadQualif = window._leadQualif || {};
  window._leadQualif.td = (window._leadQualif.td === val) ? '' : val;
  document.getElementById('td-tds').classList.toggle('active', window._leadQualif.td === 'TDS');
  document.getElementById('td-tdn').classList.toggle('active', window._leadQualif.td === 'TDN');

// ── v2.5: Calcula fase do funil automaticamente baseado nos campos preenchidos ──
function computeStageFromForm(){
  // Lê todos os campos do form + state de qualificação
  const nome   = (document.getElementById('lead-nome')?.value || '').trim();
  const tel    = (document.getElementById('lead-tel')?.value || '').trim();
  const fat    = parseInt(document.getElementById('lead-fatura')?.value || '0', 10);
  const dist   = document.getElementById('lead-dist')?.value || '';
  const rua    = (document.getElementById('lead-rua')?.value || '').trim();
  const numero = (document.getElementById('lead-numero')?.value || '').trim();
  const bairro = (document.getElementById('lead-bairro')?.value || '').trim();
  const cep    = (document.getElementById('lead-cep')?.value || '').trim();
  const cidade = (document.getElementById('lead-cidade')?.value || '').trim();
  const estado = (document.getElementById('lead-estado')?.value || '').trim();
  const q      = window._leadQualif || {};

  // 1) Lead perdido sobrescreve tudo
  if (q.lost) return 'perdido';

  // 2) Fatura preenchida (> 0) → Propostas
  if (fat > 0) return 'propostas';

  // 3) Qualquer campo opcional preenchido → Qualificados
  //    (Tel, Dist, Rua, Número, CEP, UF, TDS/TDN, horários, temperatura, CNPJ, crédito, produtos, próx. interação)
  const hasQualif = !!tel || !!dist || !!rua || !!numero || !!cep || !!estado
                  || !!q.td || (q.schedule && q.schedule.length > 0) || !!q.temperatura
                  || !!q.temCnpj || !!q.interesseCredito
                  || (q.produtos && q.produtos.length > 0)
                  || !!q.proximaInteracao;
  if (hasQualif) return 'qualificados';

  // 4) Default — só obrigatórios preenchidos → Planejados
  return 'planejados';
}

  const sel = document.getElementById('reassign-vend');

  if(!nv){ setSt('Selecione um vendedor.', '#E5484D'); return; }
  if(canonicalVendedor(nv) === canonicalVendedor(lead.vendedor||'')){
    setSt('Esse já é o responsável atual.', '#E5484D'); return;
  }
  if(!confirm(`Transferir "${lead.nome||'este lead'}" para ${nv}?`)) return;
  setSt('⏳ Transferindo...');
  const anterior = lead.vendedor || '';
  lead.vendedor = nv;
  let res;
  try { res = await saveLead(lead); }
  catch(e){ res = { ok:false, error: (e && e.message) || 'erro' }; }
  if(res && (res.ok || res.offline)){
    saveLeadsCache(window.leads);
    cadastroToast = `✓ Lead "${lead.nome||''}" realocado para ${nv}`;
    editingLeadId = null;
    setFunilView('kanban');
  } else {
    lead.vendedor = anterior;   // reverte se falhou
    setSt('Erro ao transferir: ' + ((res && res.error) || 'tente novamente'), '#E5484D');
  }
}

  const partes = [];
  if(rua) partes.push(rua + (numero ? ', ' + numero : ''));
  if(bairro) partes.push(bairro);
  if(cidade) partes.push(cidade + (estado ? '/' + estado : ''));
  const loc = partes.join(' · ') || (cidade + (estado ? '/' + estado : ''));

  const id = 'L' + String(Date.now()).slice(-6);
  const q = window._leadQualif || {};
  const lead = {
    id, nome, tel, fatura: fat, dist, loc,
    endereco: { rua, numero, complemento, bairro, cep, cidade, estado, pais },
    coords: window._lastGeoCoords || null,
    stage: 'propostas',
    createdAt: Date.now(),
    vendedor: getCurrentVendedor(),
    td: q.td || '',
    schedule: q.schedule || [],
    temperatura: q.temperatura || '',
    lost: false,
    lostReason: '',
    temCnpj: q.temCnpj || '',
    cnpj: q.cnpj || '',
    interesseCredito: q.interesseCredito || '',
    produtos: q.produtos || [],
    proximaInteracao: q.proximaInteracao || '',
    obs: q.obs || '',
    proposta: {
      pct: PCT_DESC,
      economiaMensal, novaFatura, economiaAnual, economia5anos,
      geradaEm: Date.now()
    }
  };

  // Salva otimista (UI imediata + Sheets em background)
  window.leads.push(lead);
  lastCreatedId = id;
  window._lastGeoCoords = null;
  saveLead(lead).then(res => {
    if (!res.ok && !res.offline) console.warn('Falha ao sincronizar lead com proposta:', res.error);
  });

  // ⭐ v2.7 — Monta a mensagem padrão do bot (5 itens diretos)
  const msg = buildWhatsappMessage(lead);

  // Toast pra avisar que o lead foi salvo (vai aparecer no Kanban depois)
  cadastroToast = `✓ ${nome} salvo em Propostas — copie a mensagem e envie no WhatsApp`;

  // Libera flag
  window._generatingProposta = false;

  // ⭐ Abre modal de cópia em vez de WhatsApp direto
  showCopyPropostaModal(msg, nome);
}

// ⭐ v2.7 — Constrói a mensagem padrão do bot (5 itens numerados)
function buildWhatsappMessage(lead){
  const primeiroNome = (lead.nome || '').split(/\s+/)[0] || lead.nome || '';
  const tel = lead.tel || '';
  const fat = String(lead.fatura || '');
  // Item 4: Energia como crédito → "sim" SÓ se o cliente disse Sim; senão "não"
  const credito = (lead.interesseCredito === 'Sim') ? 'sim' : 'não';
  const dist = lead.dist || '';

  return [
    `1) ${primeiroNome}`,
    `2) ${tel}`,
    `3) ${fat}`,
    `4) ${credito}`,
    `5) ${dist}`,
  ].join('\n');
}

async function copyPropostaMessage(){
  const msgEl = document.querySelector('#copy-proposta-modal div[style*="monospace"]');
  if (!msgEl) return;
  const text = msgEl.innerText;
  const btn = document.getElementById('btn-copy-msg');
  const originalHtml = btn.innerHTML;

  try {
    // API moderna (HTTPS no Netlify funciona)
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
    } else {
      // Fallback: cria textarea temporário e usa execCommand
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.top = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    // Feedback visual: botão fica verde
    btn.innerHTML = '✅ Copiado! Cole no WhatsApp';
    btn.style.background = '#1D9E75';
    setTimeout(() => {
      btn.innerHTML = originalHtml;
      btn.style.background = '';
    }, 2200);
  } catch (err) {
    console.error('Falha ao copiar:', err);
    btn.innerHTML = '⚠️ Erro ao copiar — selecione manualmente';
    setTimeout(() => { btn.innerHTML = originalHtml; }, 2500);
  }
}

// ── GPS + Reverse Geocoding (Nominatim/OpenStreetMap, gratuito) ──
function usarMinhaLocalizacao(){
  const btn = document.getElementById('geo-btn');
  const status = document.getElementById('geo-status');

  if(!navigator.geolocation){
    status.className = 'geo-status err';
    status.textContent = '⚠️ Seu navegador não suporta GPS. Preencha o endereço manualmente abaixo.';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = `
    <svg viewBox="0 0 24 24" style="animation:spin 1s linear infinite"><circle cx="12" cy="12" r="10" stroke-opacity=".25"/><path d="M22 12a10 10 0 0 1-10 10"/></svg>
    Obtendo sua localização...
  `;
  status.className = 'geo-status info';
  status.textContent = 'Permita o acesso à localização no aviso do navegador...';

  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      window._lastGeoCoords = { lat, lon, accuracy: pos.coords.accuracy };

      status.className = 'geo-status info';
      status.textContent = `Localização obtida (precisão ~${Math.round(pos.coords.accuracy)}m). Buscando endereço...`;

      try {
        // Nominatim: reverse geocoding gratuito
        const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&addressdetails=1&accept-language=pt-BR`;
        const resp = await fetch(url, { headers: { 'Accept': 'application/json' } });
        if(!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        const a = data.address || {};

        const rua    = a.road || a.pedestrian || a.path || '';
        const numero = a.house_number || '';
        const cep    = a.postcode || '';
        // Bairro: Nominatim BR usa suburb / neighbourhood / quarter
        const bairro = a.suburb || a.neighbourhood || a.quarter || a.city_district || '';
        // Cidade: tira o suburb daqui (era bug: estava virando bairro)
        const cidade = a.city || a.town || a.village || a.municipality || '';
        const estado = (a.state_code || a['ISO3166-2-lvl4'] || a.state || '').replace('BR-','').slice(0,2).toUpperCase();
        const pais   = a.country || 'Brasil';

        // Preenche os campos
        if(rua) document.getElementById('lead-rua').value = rua;
        if(numero) document.getElementById('lead-numero').value = numero;
        if(bairro) document.getElementById('lead-bairro').value = bairro;
        if(cep) document.getElementById('lead-cep').value = cep;
        if(cidade) document.getElementById('lead-cidade').value = cidade;
        if(estado) document.getElementById('lead-estado').value = estado;
        if(pais) document.getElementById('lead-pais').value = pais;

        status.className = 'geo-status ok';
        const filled = [rua, numero, bairro, cep, cidade, estado].filter(Boolean).length;
        status.innerHTML = `✓ Endereço preenchido automaticamente (${filled}/6 campos). <b>Confira e edite se necessário.</b>`;
        updateSaveButtonState();  // v2.23: bairro/cidade vieram do GPS, atualiza o botão
      } catch (err) {
        status.className = 'geo-status err';
        status.innerHTML = '⚠️ GPS funcionou mas o serviço de endereço falhou. <b>Coordenadas salvas</b> — preencha o endereço manualmente.';
      } finally {
        btn.disabled = false;
        btn.innerHTML = `
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg>
          Tentar novamente
        `;
      }
    },
    (err) => {
      btn.disabled = false;
      btn.innerHTML = `
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg>
        Usar minha localização
      `;
      status.className = 'geo-status err';
      let msg = '';
      if(err.code === 1) msg = 'Permissão negada. Habilite o GPS nas configurações do navegador <b>ou preencha o endereço manualmente abaixo.</b>';
      else if(err.code === 2) msg = 'Localização indisponível (sem sinal de GPS). <b>Preencha manualmente.</b>';
      else if(err.code === 3) msg = 'Tempo esgotado. Tente novamente em local com melhor sinal <b>ou preencha manualmente.</b>';
      else msg = 'Erro ao obter localização. <b>Preencha manualmente.</b>';
      status.innerHTML = '⚠️ ' + msg;
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
  );
}

function renderFunilKanban(el){
  const me = getCurrentVendedor();

  // v2.27/v2.46: match canônico — normalize + aliases (renames). Antonio Carlos == Antonio Mariano.
  const meN = canonicalVendedor(me);

  // Aplica scope: meus leads ou (se líder) toda a praça ou (se gestor) time inteiro
  const allLeads = window.leads;
  const GESTOR = 'Felipe Oliveira';
  const praçaLider = liderPraca(me);
  const isLiderOuGestor = isGestor_(me) || !!praçaLider;

  // Se líder/gestor escolheu um liderado específico, filtra só por ele
  const viewAs = (isLiderOuGestor && funilViewAs) ? funilViewAs : null;

  const myLeads = me ? allLeads.filter(l => {
    if(viewAs) return canonicalVendedor(l.vendedor) === canonicalVendedor(viewAs);
    if(isGestor_(me)) return true;  // gestor vê tudo
    if(praçaLider){
      // líder: vê os próprios + todos os da praça
      const lPraca = (SELLER_PRACA[canonicalVendedor(l.vendedor)] || '').toLowerCase();
      return lPraca === praçaLider || canonicalVendedor(l.vendedor) === meN;
    }
    return canonicalVendedor(l.vendedor) === meN;
  }) : [];

  // ⭐ v2.11 — Calcula contagens dos filtros de visita (sempre baseado nos MEUS leads, etapas ativas)
  // Etapas ativas: planejados, qualificados, propostas, fechamentos (sem perdido e contratos)
  const ACTIVE_STAGES = ['planejados','qualificados','propostas','fechamentos'];
  const activeLeads = me ? myLeads.filter(l => ACTIVE_STAGES.includes(l.stage) && !isLeadPerdido(l)) : [];

  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = today.toISOString().slice(0,10);
  const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);
  const tomorrowStr = tomorrow.toISOString().slice(0,10);

  // v2.30 — limites da semana corrente (Seg–Dom, padrão BR) e do mês corrente
  const dayOfWeek = today.getDay();                            // 0=Dom, 1=Seg, ..., 6=Sáb
  const daysSinceMonday = dayOfWeek === 0 ? 6 : dayOfWeek - 1; // dias desde a segunda
  const weekStart = new Date(today); weekStart.setDate(today.getDate() - daysSinceMonday);
  const weekStartStr = weekStart.toISOString().slice(0,10);
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate() + 6);
  const weekEndStr = weekEnd.toISOString().slice(0,10);
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  const monthStartStr = monthStart.toISOString().slice(0,10);
  const monthEnd = new Date(today.getFullYear(), today.getMonth() + 1, 0);
  const monthEndStr = monthEnd.toISOString().slice(0,10);

  const visitCounts = {
    today:    activeLeads.filter(l => l.proximaInteracao === todayStr).length,
    tomorrow: activeLeads.filter(l => l.proximaInteracao === tomorrowStr).length,
    week:     activeLeads.filter(l => l.proximaInteracao >= weekStartStr && l.proximaInteracao <= weekEndStr).length,
    month:    activeLeads.filter(l => l.proximaInteracao >= monthStartStr && l.proximaInteracao <= monthEndStr).length,
    overdue:  activeLeads.filter(l => l.proximaInteracao && l.proximaInteracao < todayStr).length,
    // v2.59 — leads gerados hoje (todos os stages, inclusive perdido/contratos)
    createdToday: myLeads.filter(l => l.createdAt && new Date(l.createdAt).toISOString().slice(0,10) === todayStr).length
  };

  // Aplica o filtro escolhido
  let filteredLeads;
  let filterBanner = '';
  if (visitFilter) {
    // Filtro de visita ativo: força "meus" + etapas ativas
    if (visitFilter === 'today') {
      filteredLeads = activeLeads.filter(l => l.proximaInteracao === todayStr);

function setKanbanScope(scope){

// ⭐ v2.11 — Filtro por próxima interação
function setVisitFilter(filter){
  // Toggle: se clicar no filtro já ativo, desativa
  if (visitFilter === filter) {
    visitFilter = null;
  } else {
    visitFilter = filter;
  }
  // Quando ativa um filtro, vai pra primeira etapa com leads
  if (visitFilter) {
    const me = getCurrentVendedor();
    const norm = s => (s||'').replace(/\s+/g,' ').trim().toLowerCase();
    const meN = norm(me);
    const { leads: leadsInFilter } = getLeadsByVisitFilter(visitFilter);
    // Vai pra primeira etapa que tenha leads
    for (const s of FUNIL_STAGES) {
      if (leadsInFilter.some(l => l.stage === s.key)) {
        kanbanActiveStage = s.key;
        break;
      }
    }
  }
  renderFunil();
}

// v2.33 — Busca textual do Kanban. Mantém foco e cursor no input após cada keystroke.
function setSearchQuery(value){
  searchQuery = value;
  // v2.140 — debounce: só re-renderiza ~280ms DEPOIS de parar de digitar.
  // Antes re-renderizava a cada tecla (renderFunil), o que piscava a tela e
  // tirava o foco do campo, impedindo digitar o nome inteiro. Agora o texto
  // digitado fica no input nativo e o filtro roda quando o usuário pausa.
  clearTimeout(window._ksTimer);
  window._ksTimer = setTimeout(() => {
    renderFunil();
    const inp = document.getElementById('kanban-search-input');
    if (inp) {
      inp.focus();
      const len = inp.value.length;
      try { inp.setSelectionRange(len, len); } catch(e){}
    }
  }, 280);
}

function clearSearch(){
  searchQuery = '';
  renderFunil();
  setTimeout(() => {
    const inp = document.getElementById('kanban-search-input');
    if (inp) inp.focus();
  }, 0);
}

// Helper: dado um filterKey, devolve {leads, label} já normalizado

// v2.128 — Escopo do funil (mesma regra do kanban): gestor vê tudo, líder vê a praça,
// e respeita o seletor "Visualizando leads de" (funilViewAs). Antes o modal de recorte
// filtrava só por l.vendedor === me, então o gestor (sem leads próprios) via lista vazia.
function getFunilScopedLeads(){
  const me = getCurrentVendedor();
  if(!me) return [];
  const meN = canonicalVendedor(me);
  const GESTOR = 'Felipe Oliveira';
  const praçaLider = liderPraca(me);
  const isLiderOuGestor = isGestor_(me) || !!praçaLider;
  const viewAs = (isLiderOuGestor && funilViewAs) ? funilViewAs : null;
  return window.leads.filter(l => {
    if(viewAs) return canonicalVendedor(l.vendedor) === canonicalVendedor(viewAs);
    if(isGestor_(me)) return true;
    if(praçaLider){
      const lPraca = (SELLER_PRACA[canonicalVendedor(l.vendedor)] || '').toLowerCase();
      return lPraca === praçaLider || canonicalVendedor(l.vendedor) === meN;
    }
    return canonicalVendedor(l.vendedor) === meN;
  });
}

function getLeadsByVisitFilter(filterKey){
  const me = getCurrentVendedor();
  if(!me) return { leads: [], label: '' };
  const meN = canonicalVendedor(me);  // v2.46
  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = today.toISOString().slice(0,10);
  const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);
  const tomorrowStr = tomorrow.toISOString().slice(0,10);
  const dayOfWeek = today.getDay();
  const daysSinceMonday = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
  const weekStart = new Date(today); weekStart.setDate(today.getDate() - daysSinceMonday);
  const weekStartStr = weekStart.toISOString().slice(0,10);
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate() + 6);
  const weekEndStr = weekEnd.toISOString().slice(0,10);
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  const monthStartStr = monthStart.toISOString().slice(0,10);
  const monthEnd = new Date(today.getFullYear(), today.getMonth() + 1, 0);
  const monthEndStr = monthEnd.toISOString().slice(0,10);
  const ACTIVE_STAGES = ['planejados','qualificados','propostas','fechamentos'];
  const myLeads = getFunilScopedLeads().filter(l => ACTIVE_STAGES.includes(l.stage));
  if (filterKey === 'today')    return { leads: myLeads.filter(l => l.proximaInteracao === todayStr), label: 'pra hoje' };
  if (filterKey === 'tomorrow') return { leads: myLeads.filter(l => l.proximaInteracao === tomorrowStr), label: 'pra amanhã' };
  if (filterKey === 'week')     return { leads: myLeads.filter(l => l.proximaInteracao >= weekStartStr && l.proximaInteracao <= weekEndStr), label: 'desta semana (S0)' };
  if (filterKey === 'month')    return { leads: myLeads.filter(l => l.proximaInteracao >= monthStartStr && l.proximaInteracao <= monthEndStr), label: 'deste mês' };
  if (filterKey === 'overdue')  return { leads: myLeads.filter(l => l.proximaInteracao && l.proximaInteracao < todayStr), label: 'atrasados' };
  // v2.59 — leads gerados hoje (todos os stages, não filtra por ACTIVE_STAGES)
  if (filterKey === 'created_today') {
    const all = getFunilScopedLeads();
    return { leads: all.filter(l => l.createdAt && new Date(l.createdAt).toISOString().slice(0,10) === todayStr), label: 'gerados hoje' };
  }
  return { leads: [], label: '' };
}

function openVisitFilterModal(filterKey){
  const { leads, label } = getLeadsByVisitFilter(filterKey);

  const noLeads = leads.length === 0;

  });

// Abre Google Maps Directions com a rota: sua localização → cliente 1 → ... → cliente N
// Limite do Google Maps: 10 paradas no total (1 destino + 9 waypoints). Trunca se passar.
function openRouteInMaps(filterKey){
  const { leads } = getLeadsByVisitFilter(filterKey);
  if (leads.length === 0) { alert('Nenhum cliente nesse recorte.'); return; }
  // Ordena por proximaInteracao ASC (atrasado primeiro), depois nome
  const ordered = [...leads].sort((a,b) =>
    (a.proximaInteracao||'').localeCompare(b.proximaInteracao||'')
    || (a.nome||'').localeCompare(b.nome||''));
  const stops = ordered.map(l => {
    if (l.coords && l.coords.lat && l.coords.lon) return `${l.coords.lat},${l.coords.lon}`;
    const e = l.endereco || {};
    const parts = [e.rua, e.numero, e.bairro, e.cidade, e.estado].filter(Boolean);
    return parts.length ? parts.join(', ') : '';
  }).filter(s => s && s.length > 0);
  if (stops.length === 0) { alert('Nenhum cliente nesse recorte tem endereço cadastrado.'); return; }
  const TRUNCATE = 10;
  const truncated = stops.length > TRUNCATE;
  if (truncated) stops.length = TRUNCATE;
  const destination = stops[stops.length - 1];
  const waypoints = stops.slice(0, -1).join('|');
  let url = `https://www.google.com/maps/dir/?api=1&origin=&destination=${encodeURIComponent(destination)}&travelmode=driving`;
  if (waypoints) url += `&waypoints=${encodeURIComponent(waypoints)}`;
  if (truncated) {
    alert(`Você tem ${leads.length} clientes nesse recorte, mas o Google Maps só aceita 10 paradas. Vou abrir com os ${TRUNCATE} mais antigos. Roda esses primeiro e depois volta pros restantes.`);
  }
  window.open(url, '_blank');
}

        </span>
        <span class="lead-meta-item lead-meta-tel" onclick="openPhoneActions('${escapeHtml(lead.tel).replace(/'/g, '&apos;')}', event)">
          <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          ${escapeHtml(lead.tel)}
        </span>
        <span class="lead-meta-item">⏱ ${ago}</span>
      </div>
      ${lead.proposta ? `
        <div style="margin-top:8px;padding:6px 10px;background:linear-gradient(90deg,#ECF7F1 0%,#fff 100%);border-left:3px solid #1D9E75;border-radius:6px;font-size:11px;color:#157A55;font-weight:700;display:flex;align-items:center;gap:6px">
          <span>✨</span>
          <span>Proposta gerada · economia R$ ${lead.proposta.economiaMensal.toLocaleString('pt-BR')}/mês</span>
        </div>
      ` : ''}
      ${(() => {
        if (!lead.proximaInteracao) return '';
        // v2.58 — quem já tá em Contratos não precisa mais de follow-up; some o badge
        if (lead.stage === 'contratos') return '';
        const today = new Date(); today.setHours(0,0,0,0);
        const target = new Date(lead.proximaInteracao + 'T00:00:00');
        const diff = Math.round((target - today) / 86400000);
        let label, bg, color, border, icon;
        if (diff < 0) { label = `Atrasado · ${Math.abs(diff)}d`; bg = '#FEF2F2'; color = '#991B1B'; border = '#DC2626'; icon = '⚠️'; }
        else if (diff === 0) { label = 'Visita hoje'; bg = '#EEF2FF'; color = '#3730A3'; border = '#0201F3'; icon = '📅'; }
        else if (diff === 1) { label = 'Visita amanhã'; bg = '#FEFCE8'; color = '#854D0E'; border = '#EAB308'; icon = '⏰'; }
        else { label = `Em ${diff}d`; bg = '#F4F5FA'; color = '#6B7280'; border = '#9CA3AF'; icon = '📅'; }
        return `<div style="margin-top:8px;padding:5px 10px;background:${bg};border-left:3px solid ${border};border-radius:6px;font-size:11px;color:${color};font-weight:700;display:flex;align-items:center;gap:6px">
          <span>${icon}</span><span>${label}</span>
        </div>`;
      })()}
      <div class="lead-foot">
        <div class="lead-bill">R$ ${lead.fatura.toLocaleString('pt-BR')}<span style="font-size:10px;color:var(--muted);font-weight:600">&nbsp;/ fatura</span></div>
        <div class="lead-dist">${escapeHtml(lead.dist)}</div>
      </div>
      ${vendedorBadge}
      <div class="lead-move" onclick="event.stopPropagation()">
        <button class="lead-move-btn regress" ${!prevStage?'disabled':''} onclick="event.stopPropagation();moveLead('${lead.id}', ${prevStage ? `'${prevStage.key}'` : 'null'})">
          ← ${prevStage ? prevStage.short : ''}
        </button>
        <button class="lead-move-btn advance" ${!nextStage?'disabled':''} onclick="event.stopPropagation();moveLead('${lead.id}', ${nextStage ? `'${nextStage.key}'` : 'null'})">
          ${nextStage ? nextStage.short : 'Final'} →
        </button>
      </div>
    </div>
  `;
}

// ⭐ v2.8 — Abre lead em modo edição (ou visualização se não for o dono)
function openEditLead(leadId, ev){
  // Stop propagation pra evitar dupla chamada
  if (ev) ev.stopPropagation();
  // Se clique veio em botão de mover (ou descendente), ignora
  if (ev && ev.target.closest('.lead-move-btn')) return;

  editingLeadId = leadId;
  setFunilView('cadastro'); // reusa a mesma view, mas em modo edição
}

function goToKanbanStage(key){
  kanbanActiveStage = key;
  const idx = FUNIL_STAGES.findIndex(s => s.key === key);
  const scrollEl = document.getElementById('kanban-scroll');
  if(scrollEl && scrollEl.children[idx]){
    scrollEl.scrollTo({ left: scrollEl.children[idx].offsetLeft - 16, behavior: 'smooth' });
  }
  document.querySelectorAll('.kanban-tab').forEach((t, i) => {
    t.classList.toggle('active', FUNIL_STAGES[i].key === key);
  });
}

function moveLead(id, newStage){
  if(!newStage) return;
  const lead = window.leads.find(l => l.id === id);
  if(!lead) return;
  lead.stage = newStage;
  kanbanActiveStage = newStage;
  renderFunil();
  // Sincroniza no Sheets em background
  updateLeadStage(id, newStage).then(res => {
    if (!res.ok && !res.offline) {
      console.warn('Falha ao sincronizar movimento:', res.error);
    }
  });
}

const STAGE_DESC={'WAITING_DOCUMENTS':'Falta documento pra análise','BACKGROUND_CHECKING':'Em processo de análise do time de Ops','BACKGROUND CHECKING':'Em processo de análise do time de Ops','BGC_PARCEIRO':'Já aprovado na análise de risco; agora em análise do Antecipa (parte 2). Prazo de até 1,5 dia útil.','BGC_REVIEW':'Em processo de análise do time de Ops','REQUEST_TITULARIDADE':'Aprovado na análise, aguardando processo de troca de titularidade','TITULARIDADE_ONGOING':'Troca de titularidade solicitada, aguardando confirmação da distribuidora','TITULARIDADE ONGOING':'Troca de titularidade solicitada, aguardando confirmação da distribuidora','REGISTERING_DG':'Troca de titularidade aprovada, aguardando cadastro na DG para gerar a fatura','ACTIVE_MEMBER':'Troca aprovada e cliente cadastrado na DG para gerar faturas Liora','ACTIVE MEMBER':'Troca aprovada e cliente cadastrado na DG para gerar faturas Liora'};
function escapeHtml(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
