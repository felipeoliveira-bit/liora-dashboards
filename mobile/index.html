// SCREEN: MISSÃO DA SEMANA (v2.168 — campanha "Semana do Antecipa")
// Visível SÓ para líderes e gestão (nav-missao nasce display:none).
// Meta: MWh aprovados em clientes Antecipa, SOMA DO TIME, 24→31/08.
// Tiers 5/8/15 MWh -> R$750/R$1.500/R$3.000 · pagamento 01/09.
// Pré-requisito: 1 venda de Antecipa POR VENDEDOR do time.
// Fonte: rawData (produto LIORA_ANTECIPA_* + aprov_date na janela).
// ══════════════════════════════════════════════════════════════════
const MIS_INI = '2026-08-24';
const MIS_FIM = '2026-08-31';
const MIS_TIERS = [{mwh:5,premio:750},{mwh:8,premio:1500},{mwh:15,premio:3000}];
const MIS_MAX = 15;
// Felipe 24/08: campanha recalibrada p/ 24-30/08; 01/09: esticada ate 31/08. A janela toda
// vale 1,5x -- nao existe periodo de largada nesta semana.
const MIS_BONUS_INI = '2026-08-24';
const MIS_BONUS = 1.5;
function misTemBonus(r){ return (r.aprov_date || '') >= MIS_BONUS_INI; }
function misMwhCamp(r){ const m = Number(r.mwh) || 0; return misTemBonus(r) ? m * MIS_BONUS : m; }
let misVerTodos = false;

function misLiderDaPraca(k){
  for (const nome in LIDERES) if (liderPracas(nome).indexOf(k) !== -1) return nome;
  return '';
}
function misLabel(k){
  return (typeof PRACA_DEF !== 'undefined' && PRACA_DEF[k]) ? PRACA_DEF[k].label : k;
}
function misPracaDe(nome){
  return SELLER_PRACA[nome] || SELLER_PRACA[(typeof canonicalVendedor==='function' ? canonicalVendedor(nome||'') : nome)] || '';
}
function misEhAntecipa(r){
  return String(r.produto || '').toUpperCase().indexOf('ANTECIPA') !== -1;
}
function misRegistros(){
  return (typeof rawData !== 'undefined' ? rawData : []).filter(function(r){
    const a = r.aprov_date || '';
    return misEhAntecipa(r) && a >= MIS_INI && a <= MIS_FIM;
  });
}
function misRoster(){
  const out = {};
  for (const nome in SELLER_PRACA){
    const k = SELLER_PRACA[nome];
    if (!k || !misLiderDaPraca(k)) continue;
    if (isGestor_(nome) || isOculto_(nome) || isExTime_(nome)) continue;
    if (isLider(nome)) continue;   // Felipe 14/08: líder não precisa vender 1 Antecipa
    (out[k] = out[k] || []).push(nome);
  }
  for (const k in out) out[k].sort();
  return out;
}
function misTimes(){
  const roster = misRoster();
  const T = {};
  Object.keys(roster).forEach(function(k){
    T[k] = {k:k, mwh:0, base:0, bonus:0, nBonus:0, n:0, vend:{}, roster:roster[k].slice()};
  });
  misRegistros().forEach(function(r){
    const k = misPracaDe(r.s);
    if (!T[k]) return;
    const _m = Number(r.mwh) || 0;
    T[k].base += _m;
    T[k].mwh += misMwhCamp(r);
    if (misTemBonus(r)){ T[k].bonus += _m * (MIS_BONUS - 1); T[k].nBonus += 1; }
    T[k].n += 1;
    T[k].vend[r.s] = (T[k].vend[r.s] || 0) + 1;
    if (T[k].roster.indexOf(r.s) === -1 && !isLider(r.s)) T[k].roster.push(r.s);
  });
  return T;
}
function misTier(m){ let t = null; for (const x of MIS_TIERS) if (m >= x.mwh) t = x; return t; }
function misProx(m){ for (const x of MIS_TIERS) if (m < x.mwh) return x; return null; }
function misMwh(v){ return (Math.round(v*100)/100).toFixed(2).replace('.', ','); }
function misBRL(v){ return 'R$ ' + v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function misData(iso){ const m = String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? (m[3]+'/'+m[2]) : '—'; }
function misDias(){
  const hoje = new Date(new Date().toLocaleString('en-US', {timeZone:'America/Sao_Paulo'}));
  return Math.ceil((new Date(MIS_FIM + 'T23:59:59-03:00') - hoje) / 86400000);
}

function misCard(t){
  const tier = misTier(t.mwh), prox = misProx(t.mwh);
  const faltam = t.roster.filter(function(v){ return !t.vend[v]; });
  const okPre = t.roster.length > 0 && faltam.length === 0;
  const pct = Math.min(100, (t.mwh / MIS_MAX) * 100);
  let prize;
  if (tier && okPre) prize = '<div class="mis-prize on"><span>🏆 Prêmio do líder</span><span>' + misBRL(tier.premio) + '</span></div>';
  else if (tier) prize = '<div class="mis-prize blocked"><span>⚠️ ' + misBRL(tier.premio) + ' travado</span><span>' + faltam.length + ' sem venda</span></div>';
  else prize = '<div class="mis-prize off"><span>Ainda sem prêmio</span><span>meta 1 = 5 MWh</span></div>';
  const next = prox
    ? '<div class="mis-next">Faltam <b>' + misMwh(prox.mwh - t.mwh) + ' MWh</b> para ' + misBRL(prox.premio) + '</div>'
    : '<div class="mis-next">Meta máxima batida 🚀</div>';
  const chips = t.roster.map(function(v){
    const n = t.vend[v] || 0;
    return '<span class="mis-chip ' + (n ? 'ok' : 'no') + '">' + (n ? '✓ ' : '○ ') + v + (n > 1 ? (' ·' + n) : '') + '</span>';
  }).join('') || '<span class="mis-chip no">sem vendedores mapeados</span>';
  const marks = MIS_TIERS.map(function(x){ return '<div class="mk" style="left:' + ((x.mwh/MIS_MAX)*100) + '%"></div>'; }).join('');
  return '<div class="mis-card' + (tier && okPre ? ' done' : '') + '">' +
    '<div class="mis-top"><div class="mis-name">' + misLabel(t.k) + '</div><div class="mis-lider">' + misLiderDaPraca(t.k) + '</div></div>' +
    '<div class="mis-mwh">' + misMwh(t.mwh) + ' <small>MWh · ' + t.n + ' aprovado' + (t.n === 1 ? '' : 's') + '</small></div>' +
    '<div style="font-size:11px;margin:-4px 0 8px;line-height:1.4">' +
      '<span style="color:var(--blue);font-weight:700">' + misMwh(t.base) + '</span> <span style="color:var(--muted)">normal</span>' +
      (t.bonus > 0
        ? ' <span style="color:var(--purple);font-weight:800">+ ' + misMwh(t.bonus) + ' bônus 1,5×</span> <span style="color:var(--purple)">(' + t.nBonus + ' desta semana)</span>'
        : ' <span style="color:var(--purple);font-weight:700">· nenhum aprovado 17-23/08 ainda (valem 1,5×)</span>') +
    '</div>' +
    '<div class="mis-bar"><div class="f' + (tier ? ' gold' : '') + '" style="width:' + pct + '%"></div>' + marks + '</div>' +
    '<div class="mis-leg"><span>0</span><span>5</span><span>8</span><span>15 MWh</span></div>' +
    prize + next +
    '<div class="mis-pre"><div class="mis-pre-t">Pré-requisito · 1 Antecipa por vendedor</div><div class="mis-chips">' + chips + '</div></div>' +
  '</div>';
}

function misToggle(){ misVerTodos = !misVerTodos; renderMissao(); }

function renderMissao(){
  const el = document.getElementById('s7-content');
  if (!el) return;
  const me = getCurrentVendedor();
  if (!(isLider(me) || isGestor_(me))){
    el.innerHTML = '<div class="empty"><div class="empty-icon">🔒</div><div class="empty-text">Painel exclusivo de líderes e gestão.</div></div>';
    return;
  }
  const T = misTimes();
  const minhas = liderPracas(me);
  const minha = minhas[0] || '';
  const gestor = isGestor_(me);
  const chaves = Object.keys(T).sort(function(a,b){ return T[b].mwh - T[a].mwh; });
  const mostrar = (gestor || misVerTodos || !minhas.length) ? chaves : chaves.filter(function(k){ return minhas.indexOf(k) !== -1; });

  const d = misDias();
  const restam = d > 1 ? ('faltam ' + d + ' dias') : (d === 1 ? 'último dia' : (d === 0 ? 'encerra hoje' : 'encerrada'));

  let h = '<div class="mis-pills"><span class="mis-pill">24/08 a 31/08</span>' +
          '<span class="mis-pill alt">Pagamento 01/09</span>' +
          '<span class="mis-pill ghost">' + restam + '</span></div>' +
          '<div style="background:#F3F1FF;border:1px solid #D9D4FF;border-radius:12px;padding:10px 12px;margin-bottom:12px">' +
            '<div style="font-size:12px;font-weight:800;color:var(--purple);text-align:center">⚡ Cliente aprovado de 24 a 31/08 vale 1,5×</div>' +
            '<div style="font-size:11px;color:var(--muted);text-align:center;margin-top:4px;line-height:1.5">' +
              'Cliente de 2 MWh conta como <b style="color:var(--purple)">3 MWh</b> pro time. Vale para todo aprovado da semana.<br>' +
              '<span style="color:var(--blue);font-weight:700">Azul</span> = MWh normal · <span style="color:var(--purple);font-weight:700">roxo</span> = bônus.' +
            '</div>' +
          '</div>' +
          '<div class="mis-tiers">' + MIS_TIERS.map(function(x, i){
            return '<div class="mis-tier"><div class="l">Meta ' + (i+1) + '</div><div class="v">' + x.mwh + ' MWh</div><div class="p">' + misBRL(x.premio) + '</div><div class="l">p/ o líder</div></div>';
          }).join('') + '</div>';

  if (!gestor && minha){
    h += '<button class="mis-toggle" onclick="misToggle()">' + (misVerTodos ? '↩ Ver só o meu time' : '👀 Ver todos os times') + '</button>';

function initSellerSelect(keepSelection){
  const sel = document.getElementById('seller-select');
  if (!sel) return;
  let lista;
  try { lista = VENDEDORES; } catch(e) { return; }

  const me = (typeof getCurrentVendedor === 'function') ? getCurrentVendedor() : '';
  const wrap = document.querySelector('.seller-select-wrap');
  const pracasLider = liderPracas(me);
  const praça = pracasLider[0] || '';
  const isGestor = isGestor_(me);

  // v2.122 — preserva a escolha manual ao reconstruir (senão o select volta sempre p/ "me")
  const prev = sel.value;

  // Reconstrói o select sempre que a identidade mudar
  sel.innerHTML = '';

  if(isGestor){
    // Gestor: vê todos ordenados por praça
    const order = ['Salvador','Feira de Santana','RN Capital','RN Interior','Campinas SPI','Ribeirão Preto SPI','CE'];
    order.forEach(pr => {
      const grupo = lista.filter(v => v.praca === pr && !isExTime_(v.nome));
      if(!grupo.length) return;
      const og = document.createElement('optgroup'); og.label = pr;
      grupo.forEach(v => { const o=document.createElement('option'); o.value=v.nome; o.textContent=v.nome; og.appendChild(o); });
      sel.appendChild(og);
    });
    sel.value = (keepSelection && lista.some(v=>v.nome===prev)) ? prev : me;
    if(wrap) wrap.style.display = '';
    const lbl = wrap?.querySelector('label'); if(lbl) lbl.textContent = 'Visualizando vendedor';
  } else if(praça){
    // Líder: vê time da praça
    const time = lista.filter(v => pracasLider.indexOf((SELLER_PRACA[v.nome]||'').toLowerCase()) !== -1 && !isExTime_(v.nome));
    time.forEach(v => {
      const o = document.createElement('option'); o.value = v.nome; o.textContent = v.nome + (v.nome === me ? ' (eu)' : '');
      sel.appendChild(o);
    });
    sel.value = (keepSelection && time.some(v=>v.nome===prev)) ? prev : me;
    if(wrap) wrap.style.display = '';
    const lbl = wrap?.querySelector('label'); if(lbl) lbl.textContent = 'Visualizando vendedor';
  } else {
    // Consultor: esconde o seletor, mostra só ele mesmo
    if(me){
      const o = document.createElement('option'); o.value = me; o.textContent = me; sel.appendChild(o);
      sel.value = me;
    }
    if(wrap) wrap.style.display = 'none';
  }
}

// v2.62 — Regras de remuneração variável (Julho) por praça
const REM_RULES = {
  abc:   { label: 'Salvador · Feira · RN Capital', min: 15, meta: 19, sup: 25 },
  defgh: { label: 'SPI · Ceará',               min: 12, meta: 15, sup: 20 },
};
const REM_PRIZES = { sup: 3500, meta: 2000, min: 1000 };
function getRemRules(seller){
  const praca = (SELLER_PRACA[seller] || '').toLowerCase();
  const group = (praca === 'spi' || praca === 'ce' || praca === 'rninterior' || praca === 'ribeirao') ? 'defgh' : 'abc';
  return REM_RULES[group];
}

// v2.104 — prêmio atual e quanto falta pro próximo nível de remuneração (mês).
function remProgressInfo(seller, mwh){
  const r = getRemRules(seller);
  if(!r) return null;
  // tiers em ordem crescente de volume
  const tiers = [
    { nome: 'Mínima',     mwh: r.min, prize: REM_PRIZES.min },
    { nome: 'Meta',       mwh: r.meta, prize: REM_PRIZES.meta },
    { nome: 'Super Meta', mwh: r.sup, prize: REM_PRIZES.sup },
  ];
  let atual = null;
  for(const t of tiers){ if(mwh >= t.mwh) atual = t; }
  const proximo = tiers.find(t => t.mwh > mwh) || null;
  // v2.161 — acima da Super Meta: SOMA +R$ 1000 por bloco de 5 MWh adicionais ja conquistados (ago · temporario)
  let premio = atual ? atual.prize : 0;
  let premioNome = atual ? atual.nome : null;
  if(atual && mwh >= r.sup){
    const bonusCount = Math.floor((mwh - r.sup) / 5);
    if(bonusCount > 0){
      premio += bonusCount * 1000;
      premioNome = 'Super Meta + ' + bonusCount + '\u00d7 b\u00f4nus';
    }
  }
  return {
    premio,
    premioNome,
    proximo,
    falta: proximo ? Math.max(proximo.mwh - mwh, 0) : 0,
  };
}
function renderRemProgress(seller, mwh){
  const i = remProgressInfo(seller, mwh);
  if(!i) return '';
  const premioTxt = i.premio > 0
    ? `<span style="color:var(--green);font-weight:800">R$ ${i.premio.toLocaleString('pt-BR')}</span> <span style="color:var(--muted)">(${i.premioNome})</span>`
    : `<span style="color:var(--muted)">Ainda sem prêmio do mês</span>`;
  let faltaTxt;
  if(i.proximo){
    faltaTxt = `Faltam <b>${i.falta.toFixed(1)} MWh</b> para ${i.proximo.nome} (R$ ${i.proximo.prize.toLocaleString('pt-BR')})`;
  } else {
    // v2.160 — Super Meta atingida: bônus +R$ 1000 a cada 5 MWh adicionais (agosto · temporário)
    const rr = getRemRules(seller);
    const sup = rr ? rr.sup : 0;
    const faltaBonus = Math.max(5 - ((mwh - sup) % 5), 0);
    faltaTxt = `🎉 Super Meta! Faltam <b>${faltaBonus.toFixed(1)} MWh</b> para ganhar <b>+R$ 1.000</b>`;
  }
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid #F0F0F5">
      <div style="font-size:13px;color:var(--ink)">${premioTxt}</div>
      <div style="font-size:11px;color:var(--muted);text-align:right">${faltaTxt}</div>
    </div>`;
}

// ===== v2.138 — Card de Metas do LÍDER (RV proporcional + aceleradores) =====
// Atingimento do líder = MWh APROVADOS DO TIME (praça) ÷ meta do líder (aba "Time").
// 100% = R$ 2.000. <60% defrator zera. 60–104% proporcional. 105/120/150/200 = aceleradores. (atualizado 04/08: 120%→R$3.300/ref2.200, 150%→R$5.000/ref2.500, 200%→R$9.000/ref3.000)
const LIDER_BASE_RV = 2000;
function liderRV(pct){
  if(pct < 60)  return 0;
  if(pct < 105) return Math.round(pct/100 * LIDER_BASE_RV);
  if(pct < 120) return 2400;
  if(pct < 150) return 3300;
  if(pct < 200) return 5000;
  return 9000;
}
function liderProxMarco(pct){ return [60,105,120,150,200].find(m => pct < m) || null; }
function teamMwhAprovado(praca){
  return rawData
    .filter(x => (SELLER_PRACA[x.s]||'').toLowerCase() === praca && noMes(x) && isAprovado(x))

  // v2.180 (Felipe 25/08) — líder de mais de uma praça precisa ver o número SEPARADO

  const cardPorPraca = pracas.length < 2 ? '' : `

          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px">

  const membros = VENDEDORES
    .filter(v => pracas.indexOf((SELLER_PRACA[v.nome]||'').toLowerCase()) !== -1 && v.nome !== seller && !isOculto_(v.nome))
    .map(v => ({

  let html = `

        <div>
          <div style="font-size:32px;font-weight:800;color:var(--blue);line-height:1">${teamMwh.toFixed(1)}</div>

          <div style="font-size:28px;font-weight:800;color:${pc}">${pct.toFixed(0)}%</div>
          <div style="font-size:11px;color:var(--muted)">de atingimento</div>
        </div>

      <div class="bar-bg"><div class="bar-fill" style="width:${barW.toFixed(0)}%;background:var(--blue)"></div></div>

    return `
      <div class="client-card" onclick="document.getElementById('seller-select').value=this.dataset.nome;renderCarteira()" data-nome="${escapeHtml(m.nome)}" style="cursor:pointer">
        <div class="client-name">${escapeHtml(m.nome)}${m.nome===seller?' · você':''}</div>

          <span class="days-badge" style="color:${mc}">${mp.toFixed(0)}% · meta ${m.mt}</span>
        </div>
      </div>`;
  };
  if(pracas.length < 2){
    html += `<div class="section-head">Time (${membros.length})</div>`;
    membros.forEach(function(m){ html += _cardMembro(m); });
  } else {
    // v2.180 — uma seção por praça, para a líder saber de quem é cada número
    porPraca.forEach(function(p){

    if(_resto.length){
      html += `<div class="section-head">Outros (${_resto.length})</div>`;
      _resto.forEach(function(m){ html += _cardMembro(m); });
    }
  }
  return html;
}

function _cardBrDate(ms){ try { return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo'}).format(new Date(ms)); } catch(e){ return ''; } }
// v2.141 — TEMP: mostra JULHO/2026 (mês fechado) p/ mostrar ao time. Voltar p/ PROP_TODAY qd quiser mês corrente.
const VIS_MES = '2026-07';
const VIS_MES_LABEL = 'julho';
function diasUteisDoMesFechado(){
  const p = VIS_MES.split('-').map(Number); const y=p[0], m=p[1];
  const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
  let n=0; for(let dd=1; dd<=last; dd++){ const wd=new Date(Date.UTC(y,m-1,dd)).getUTCDay(); if(wd>=1&&wd<=5) n++; }
  return n||1;
}
function visitasMesDoVendedor(seller){
  if(!window.leads || !leads.length) return 0;
  const mes = VIS_MES;
  const INACT = ['ganho','won','signing_contract','active_member','perdido','lost'];
  const alvo = canonicalVendedor(seller);
  let n=0;
  leads.forEach(function(l){
    if(String((l&&l.stage)||'').trim().toLowerCase()==='excluido') return;
    const v = canonicalVendedor(l.vendedor||'');
    const nome = (Object.entries(CREDENTIALS).find(function(e){return canonicalVendedor(e[1].nome)===v;})||[null,{}])[1].nome || l.vendedor;
    if(canonicalVendedor(nome)!==alvo) return;
    const st = String((l&&l.stage)||'').trim().toLowerCase();
    const stageActive = INACT.indexOf(st)===-1;
    const criISO = l.createdAt ? _cardBrDate(l.createdAt) : '';
    const criInMes = criISO && criISO.slice(0,7)===mes;
    const proxISO = l.proximaInteracao ? String(l.proximaInteracao).slice(0,10) : '';
    const agInMes = proxISO && proxISO.slice(0,7)===mes && stageActive;
    if(criInMes || agInMes) n++;
  });
  return n;
}
function diasUteisDecorridosMes(){
  const parts = PROP_TODAY.split('-').map(Number);
  const y=parts[0], m=parts[1], d=parts[2];
  let n=0;
  for(let dd=1; dd<=d; dd++){ const wd = new Date(Date.UTC(y,m-1,dd)).getUTCDay(); if(wd>=1 && wd<=5) n++; }
  return n || 1;
}

const CAMP_CFG = {

// v2.181 \u2014 Semana 24-31/08 (Felipe 01/09: esticada ate 31/08): o MWh do Antecipa vale 1,5x SO na Campanha da Semana.
// Meta mensal, rankings e "MWh aprovados" continuam no valor real (Felipe 17/08).
function isAntecipaDeal(x){ return /ANTECIPA/i.test(x.produto||'') && isAprovado(x); }  // Felipe 18/08: era !!credito_ok, o que escondia o Antecipa aprovado por risco (Pix nao gera analise de credito) do ranking/campanha
function campParts(cfg, deals){
  deals = deals || [];
  if(!cfg || cfg.metric==='count'){ const n=deals.length; return {base:n,bonus:0,total:n,nAntecipa:n}; }
  const mult = (cfg.antecipaBonus||1);
  let base=0, bonus=0, nAnt=0;
  deals.forEach(d=>{ const m=d.mwh||0; base+=m; if(mult>1 && isAntecipaDeal(d)){ bonus += m*(mult-1); nAnt++; } });
  return {base:base, bonus:bonus, total:base+bonus, nAntecipa:nAnt};
}
function campVal(cfg, deals){ return campParts(cfg, deals).total; }
function campMatch(cfg, x){ if(cfg && cfg.key==='antecipa'){ return isAntecipaDeal(x); } return true; }
function campNum(v){ return (Math.floor(v*100)/100).toFixed(2); }
// Quebra visivel: MWh normal (azul) x bonus Antecipa (roxo)
function campBreakdownLine(cfg, parts){
  if(!cfg || cfg.metric==='count' || !(cfg.antecipaBonus>1)) return '';
  if(!(parts.bonus>0)){
    return '<div style="font-size:11px;color:var(--muted);margin-top:1px;line-height:1.4">'
      + '<span style="color:var(--blue);font-weight:700">'+campNum(parts.base)+'</span> MWh normal \u00b7 '
      + '<span style="color:var(--purple);font-weight:700">nenhum Antecipa ainda \u2014 vale 1,5\u00d7</span></div>';
  }
  return '<div style="font-size:11px;color:var(--muted);margin-top:1px;line-height:1.4">'
    + '<span style="color:var(--blue);font-weight:700">'+campNum(parts.base)+'</span> MWh normal + '
    + '<span style="color:var(--purple);font-weight:800">'+campNum(parts.bonus)+' b\u00f4nus Antecipa</span> '
    + '<span style="color:var(--purple)">('+parts.nAntecipa+' cliente'+(parts.nAntecipa===1?'':'s')+' \u00d7 1,5)</span></div>';
}
function campFmt(cfg, v){ return cfg.metric==='count' ? String(v) : (Math.floor(v*100)/100).toFixed(2); }
function campTier(cfg, v){ for(const t of cfg.tiers){ if(v>=t.v) return t; } return null; }
function campNext(cfg, v){ const asc=[...cfg.tiers].sort((a,b)=>a.v-b.v); for(const t of asc){ if(v<t.v) return t; } return null; }
function campFaltaTxt(cfg, falta){ return cfg.metric==='count' ? (falta===1?'1 cliente':falta+' clientes') : (Math.ceil(falta*100)/100).toFixed(2)+' MWh'; }

// v2.104 — calcula prêmio atual e quanto falta pro próximo tier da campanha.

function renderCampProgress(cfg, val){
  const tier = campTier(cfg, val);
  const next = campNext(cfg, val);
  const premioTxt = tier
    ? `<span style="color:var(--green);font-weight:800">${tier.label}</span> garantido`
    : `<span style="color:var(--muted)">Sem prêmio ainda</span>`;
  const faltaTxt = next
    ? `Faltam <b>${campFaltaTxt(cfg, next.v - val)}</b> para ${next.label}`
    : `🎉 Faixa máxima atingida!`;
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0 2px">
      <div style="font-size:13px;color:var(--ink)">${premioTxt}</div>
      <div style="font-size:11px;color:var(--muted);text-align:right">${faltaTxt}</div>
    </div>`;
}

var calcSaidaMes = 2;
function openCalcSaida(){
  closeCalcSaida();
  var modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'calc-saida-modal';
  modal.onclick = function(e){ if(e.target === modal) closeCalcSaida(); };
  modal.innerHTML = `
    <div class="modal-sheet" style="max-height:92vh;overflow-y:auto">
      <div class="modal-handle"></div>
      <button class="modal-close" onclick="closeCalcSaida()">✕</button>
      <div class="modal-title">Calculadora Liora Antecipa</div>
      <div class="modal-sub">Quanto o cliente devolve se cancelar antes de completar 12 meses do Liora Antecipa.</div>
      <div class="calc-field">
        <label>Valor adiantado ao cliente</label>
        <div class="calc-prefix"><span>R$</span><input type="number" id="calc-valor" value="1000" min="0" step="0.01" inputmode="decimal"></div>
      </div>
      <div class="calc-field">
        <label>Mês em que o cliente quer sair <span id="calc-badge" class="calc-badge d10">1º–6º mês · deságio 10%</span></label>
        <div class="calc-months" id="calc-months"></div>
      </div>
      <div class="calc-field">
        <label>Correção monetária (IGP-M)</label>
        <div style="padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;background:#F7F8FC;color:var(--text);font-size:15px;font-weight:700">1% <span style="font-weight:400;color:var(--muted);font-size:12.5px">— fixo</span></div>
      </div>
      <div class="calc-result">
        <div class="calc-result-label">Valor total a devolver</div>
        <div class="calc-result-value" id="calc-total">R$ 0,00</div>
        <div class="calc-break">
          <div class="k">Meses restantes até 12</div><div class="v" id="calc-mr">–</div>
          <div class="k">Valor proporcional (pro-rata)</div><div class="v" id="calc-pr">–</div>
          <div class="k">Deságio comercial</div><div class="v" id="calc-ds">–</div>
          <div class="k">Valor + deságio</div><div class="v" id="calc-cd">–</div>
          <div class="k">Correção (IGP-M 1%)</div><div class="v" id="calc-co">–</div>
          <div class="k tr">Total a devolver</div><div class="v tr" id="calc-tr">–</div>
        </div>
      </div>
      <div class="calc-note"><strong>Fórmula:</strong> (Valor × meses restantes ÷ 12) × (1 + deságio) + correção IGP-M.<br>Deságio: <b>10%</b> saindo do 1º ao 6º mês · <b>5%</b> do 7º ao 12º. A correção IGP-M (1%) é aplicada sobre o valor já com deságio.</div>
    </div>`;
  document.body.appendChild(modal);
  var mrow = modal.querySelector('#calc-months');
  for(var m=1;m<=12;m++){
    (function(mm){
      var b=document.createElement('div');
      b.className='calc-month'+(mm===calcSaidaMes?' active':'');
      b.textContent=mm;
      b.onclick=function(){ calcSaidaMes=mm; mrow.querySelectorAll('.calc-month').forEach(function(x){x.classList.remove('active');}); b.classList.add('active'); calcSaidaCompute(); };
      mrow.appendChild(b);
    })(m);
  }
  modal.querySelector('#calc-valor').addEventListener('input', calcSaidaCompute);
  calcSaidaCompute();
}
function closeCalcSaida(){ var m=document.getElementById('calc-saida-modal'); if(m) m.remove(); }
function calcSaidaCompute(){
  var fmt=function(n){ return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); };
  var valor=parseFloat(document.getElementById('calc-valor').value)||0;
  var igpm=0.01; // IGP-M fixo em 1%
  var mes=calcSaidaMes;
  var mr=Math.max(12-mes,0);
  var ds=mes<=6?0.10:0.05;
  var pr=valor*(mr/12);
  var cd=pr*(1+ds);
  var co=cd*igpm;
  var total=cd+co;
  document.getElementById('calc-mr').textContent=mr;
  document.getElementById('calc-pr').textContent=fmt(pr);
  document.getElementById('calc-ds').textContent=(ds*100).toFixed(0)+'%';
  document.getElementById('calc-cd').textContent=fmt(cd);
  document.getElementById('calc-co').textContent=fmt(co);
  document.getElementById('calc-tr').textContent=fmt(total);
  document.getElementById('calc-total').textContent=fmt(total);
  var badge=document.getElementById('calc-badge');
  if(mes<=6){ badge.textContent='1º–6º mês · deságio 10%'; badge.className='calc-badge d10'; }
  else { badge.textContent='7º–12º mês · deságio 5%'; badge.className='calc-badge d5'; }
}

// Evolui o antigo card "Aguardando documentação": além do documento que
// falta, mostra o que a ANÁLISE DE RISCO apontou (fatura vencida, contrato
// a refazer, foto ilegível, baixa renda...). Escopo igual ao resto do CRM:
// vendedor vê os próprios clientes, líder vê a praça, gestão vê tudo.
// Fonte: rawData (isAgDocs + campo motivo via obsAnalise) — nada novo no build.
// ══════════════════════════════════════════════════════════════════
let pendFiltro = 'all';     // all | docs | risco
let pendPraca  = 'all';     // só a gestão troca
const pendAberto = {};      // indice do grupo -> aberto?

function pendEscopo(){
  const me = (typeof getCurrentVendedor==='function') ? getCurrentVendedor() : '';
  if(!me) return {tipo:'none', me:''};
  if(typeof isGestor_==='function' && isGestor_(me)) return {tipo:'all', me:me};
  if(typeof isLider==='function' && isLider(me))     return {tipo:'praca', me:me, praca:(typeof liderPraca==='function'?liderPraca(me):''), pracas:(typeof liderPracas==='function'?liderPracas(me):[])};
  return {tipo:'self', me:me};
}

// O que está pendente neste cliente (pode ser mais de uma coisa ao mesmo tempo).
function pendDe(x){
  const out = [];
  // Felipe 26/08: cliente PERDIDO nao e' pendencia - nao ha o que cobrar.
  // isAgDocs ja filtrava lost_at, mas os ramos 'risco' (obsAnalise) e 'antecipa'
  // (pendAntecipa) nao olhavam lost_at nenhum: obsAnalise so silencia quem cai em
  // isNegado(), e isNegado() reconhece apenas motivo com 'analise de risco'/'reprovado'.
  // Motivo COMERCIAL ('Cliente desistiu', 'Telefone incorreto', 'Cliente possui Energia
  // Solar') nao era negado, entao o perdido voltava pro card (10 clientes / 3,5 MWh).
  // Excecao mantida: perda POS-VENDA (troca de titularidade) continua aprovada, e se
  // tiver Antecipa pendurado ainda tem dinheiro pra buscar.
  if(typeof isPerdido==='function' && isPerdido(x)) return out;
  // ⚠️ Felipe 26/08: cliente APROVADO nao e' pendencia de venda. Sobra so o ramo
  // 'antecipa' (o pagamento ainda tem dinheiro a buscar); os ramos 'docs' e 'risco'
  // saem, porque a obs de risco dele e' HISTORICA (ja foi aprovado) e poluia o chip
  // Analise com 16 cards ja resolvidos ("1 fatura vencida ref JUL/26" em quem passou).
  // Quem nao tem Antecipa pendurado sai da aba inteira.
  if(typeof isAprovado==='function' && isAprovado(x)){
    const _a = (typeof pendAntecipa==='function') ? pendAntecipa(x) : '';
    return _a ? [{k:'antecipa', ico:'⏳', txt:_a}] : out;
  }
  if(typeof isAgDocs==='function' && isAgDocs(x)){
    const d = (x.docs||'').trim();
    if(d === '__OK__') out.push({k:'docs', ico:'📄', txt:'Documentos recebidos — aguardando processamento', ok:true});
    else out.push({k:'docs', ico:'📄', txt: d ? ('Falta: ' + d) : 'Documentos pendentes (detalhe indisponível)'});
  }
  const ant = (typeof pendAntecipa==='function') ? pendAntecipa(x) : '';
  if(ant) out.push({k:'antecipa', ico:'⏳', txt: ant});
  const obs = (typeof obsAnalise==='function') ? obsAnalise(x) : '';
  if(obs) out.push({k:'risco', ico:'🔎', txt: obs});
  return out;
}

function pendBase(ignorarPraca){
  const e = pendEscopo();
  if(e.tipo==='none') return [];
  const out = [];
  rawData.forEach(function(x){
    if(e.tipo==='self'){
      if(canonicalVendedor(x.s||'') !== canonicalVendedor(e.me)) return;
    } else if(e.tipo==='praca'){
      const _ks = (e.pracas && e.pracas.length) ? e.pracas : [String(e.praca||'').toLowerCase()];
      if(_ks.indexOf(String(SELLER_PRACA[x.s]||'').toLowerCase()) === -1) return;
    } else if(!ignorarPraca && pendPraca !== 'all'){
      if(((x.praca && x.praca.key) || 'outras') !== pendPraca) return;
    }
    const p = pendDe(x);
    if(p.length) out.push({x:x, pend:p});
  });
  out.sort(function(a,b){ return (b.x.idle||0)-(a.x.idle||0) || (b.x.mwh||0)-(a.x.mwh||0); });
  return out;
}

function pendSetFiltro(f){ pendFiltro = f; renderPendencias(); }
function pendSetPraca(v){ pendPraca = v; renderPendencias(); }
function pendToggle(i){ pendAberto[i] = !pendAberto[i]; renderPendencias(); }

function pendChip(id, ico, label, n, ativo){

    + '<div class="client-city">' + escapeHtml(x.city || '—') + (x.dist ? ' · ' + escapeHtml(x.dist) : '') + '</div>'
    + sigLine(x)
    + '<div class="client-meta">'
      + '<span class="status-badge" style="background:' + si.bg + ';color:' + si.color + '">' + si.label + '</span>'
      + '<span class="mwh-badge">' + (x.mwh||0).toFixed(2) + ' MWh</span>'
      + '<span class="days-badge" style="color:' + idleColor + '">' + (x.idle||0) + 'd parado</span>'
    + '</div>';
  r.pend.forEach(function(p){
    const cor = p.ok ? ['#EAF3DE','#C9E2B4','#1D6B4F']
              : p.k==='docs'     ? ['#FFF8E1','#F5E0A3','#795500']
              : p.k==='antecipa' ? ['#F3F1FF','#D6D0FB','#4C41B0']
              :                    ['#FFF1E6','#FBD3A8','#8A4B00'];
    h += '<div class="acao-text" style="background:' + cor[0] + ';border:1px solid ' + cor[1] + ';color:' + cor[2]
      + ';border-radius:10px;padding:8px 10px;margin-top:6px">' + p.ico + ' ' + escapeHtml(p.txt) + '</div>';
  });
  if(x.deal_id){
    h += '<button class="relatar-btn" data-deal-id="' + escapeHtml(x.deal_id) + '" data-cliente-nome="' + escapeHtml(x.c||'')

      + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 11a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v3a4 4 0 0 1-4 4H8l-5 4z"/></svg>'
      + 'Relatar situação ao suporte</button>';
  }
  return h + '</div>';
}

// Numeros do card do Field: pendencias de TODAS as pracas (o card sempre foi global),
// independente do filtro/escopo escolhido dentro da aba Pendencias.
// ⚠️ Felipe 26/08: o card diz "MWh travados", entao NAO pode contar quem JA esta
// aprovado. Desde o v2.174 o aprovado com Antecipa pendurado continua na ABA (tem
// acao a fazer, e certo), mas ele vazava pro KPI: 21 dos 71 clientes / 21,2 dos
// 52,6 MWh eram GD ja aprovada, contada ao mesmo tempo no hero "Aprovado · Agosto"
// e como "travada". Um unico cliente (11,27 MWh, GD aprovada, so o Antecipa
// pendente) era 21% do card. O KPI passa a contar SO o nao-aprovado; a aba
// Pendencias (pendBase/pendDe) segue intacta e continua listando os aprovados
// com Antecipa pendurado. NAO reaproveite _pendTodas() para a aba.
function _pendTodas(){
  const out = [];
  try {
    rawData.forEach(function(x){
      if(typeof isAprovado==='function' && isAprovado(x)) return;   // aprovado nao esta travado
      const p = pendDe(x);
      if(p.length) out.push({x:x, pend:p});
    });
  } catch(e){ console.warn('pendencias (resumo):', e && e.message); return []; }
  return out;
}
function _pendCountResumo(){ return _pendTodas().length; }
function _pendMwhResumo(){ return _pendTodas().reduce(function(a,r){ return a + (r.x.mwh||0); }, 0); }

// Filtro de praca em pills (v2.173.1). Trocou o <select>, que nao parecia clicavel
// no celular. Conta em cima da base SEM o filtro de praca, senao a pill selecionada
// zeraria as outras. Mostra so praca que tem pendencia (+ a selecionada, sempre).
function pendPracaPills(){
  const ordem = ['salvador','feira','natal','rninterior','spi','ribeirao','ce','outras'];
  const todas = pendBase(true);
  const porPraca = {};
  todas.forEach(function(r){
    const k = (r.x.praca && r.x.praca.key) || 'outras';
    if(!porPraca[k]) porPraca[k] = {n:0, mwh:0};
    porPraca[k].n++; porPraca[k].mwh += (r.x.mwh||0);
  });
  function pill(k, label, n, cor){
    const on = pendPraca === k;
    return '<button onclick="pendSetPraca(\'' + k + '\')" style="flex:0 0 auto;padding:8px 12px;border-radius:999px;'
      + 'background:' + (on ? cor : '#fff') + ';border:1.5px solid ' + (on ? cor : 'var(--border)') + ';'
      + 'color:' + (on ? '#fff' : 'var(--ink)') + ';font-family:inherit;font-size:11.5px;font-weight:800;'
      + 'cursor:pointer;white-space:nowrap">' + escapeHtml(label) + ' · ' + n + '</button>';
  }
  let out = '<div style="font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:2px 0 6px">Praça</div>'
    + '<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px;-webkit-overflow-scrolling:touch">'
    + pill('all', 'Todas', todas.length, 'var(--blue)');
  ordem.forEach(function(k){
    if(!PRACA_DEF[k]) return;
    const d = porPraca[k];
    if(!d && pendPraca !== k) return;                 // praca sem pendencia nao ocupa espaco
    out += pill(k, PRACA_DEF[k].label, d ? d.n : 0, PRACA_DEF[k].color);
  });
  return out + '</div>';
}

function renderPendencias(){
  const el = document.getElementById('s8-content');
  if(!el) return;
  const e = pendEscopo();
  if(e.tipo === 'none'){
    el.innerHTML = '<div class="empty"><div class="empty-icon">👆</div><div class="empty-text">Identifica-te no topo da tela pra ver as pendências</div></div>';
    return;
  }
  const base  = pendBase();
  // 'Todas' e o header contam SO o nao-aprovado, pra bater com o card do Field
  // ("MWh travados"). O chip Antecipa segue mostrando o aprovado com pagamento
  // pendurado - la o rotulo e' Antecipa, nao pendencia de venda.
  const naoApr = base.filter(function(r){ return !(typeof isAprovado==='function' && isAprovado(r.x)); });
  const nDocs = base.filter(function(r){ return r.pend.some(function(p){ return p.k==='docs'; }); }).length;
  const nRisk = base.filter(function(r){ return r.pend.some(function(p){ return p.k==='risco'; }); }).length;
  const nAnt  = base.filter(function(r){ return r.pend.some(function(p){ return p.k==='antecipa'; }); }).length;
  const rows  = pendFiltro==='all' ? naoApr : base.filter(function(r){ return r.pend.some(function(p){ return p.k===pendFiltro; }); })
                  .map(function(r){ return {x:r.x, pend:r.pend.filter(function(p){ return p.k===pendFiltro; })}; });
  const mwh   = rows.reduce(function(a,r){ return a + (r.x.mwh||0); }, 0);
  const alvo  = e.tipo==='self' ? 'Seus clientes'
              : (e.tipo==='praca' ? ('Time · ' + (misLabel ? misLabel(e.praca) : e.praca))
              : (pendPraca==='all' ? 'Todas as praças' : (PRACA_DEF[pendPraca] ? PRACA_DEF[pendPraca].label : pendPraca)));

  let h = '<button onclick="setScreen(\'resumo\')" style="display:flex;align-items:center;gap:6px;width:100%;margin-bottom:10px;padding:10px 12px;background:#fff;border:1.5px solid var(--border);border-radius:12px;font-family:inherit;font-size:12px;font-weight:800;color:var(--ink);cursor:pointer">\u2190 Voltar pro Field</button>'
    + '<div class="camp-header" style="background:linear-gradient(135deg,#F59E0B 0%,#B45309 100%)">'
    + '<div class="camp-title">Pendências · ' + escapeHtml(alvo) + '</div>'
    + '<div class="camp-period">' + rows.length + ' cliente' + (rows.length===1?'':'s') + '</div>'
    + '<div class="camp-sub">' + mwh.toFixed(1) + (pendFiltro==='antecipa' ? ' MWh com Antecipa a receber' : ' MWh travados') + ' · toque no cliente pra ver o detalhe</div>'
    + '</div>';

  h += '<div style="display:flex;gap:6px;margin-bottom:10px">'
    + pendChip('all','📋','Todas', naoApr.length, pendFiltro==='all')
    + pendChip('docs','📄','Docs', nDocs, pendFiltro==='docs')
    + pendChip('risco','🔎','Análise', nRisk, pendFiltro==='risco')
    + pendChip('antecipa','⏳','Antecipa', nAnt, pendFiltro==='antecipa')
    + '</div>';

  if(e.tipo === 'all'){
    h += pendPracaPills();
  }

  if(!rows.length){
    h += '<div class="empty"><div class="empty-icon">✅</div><div class="empty-text">Nenhuma pendência com esse filtro. Time em dia!</div></div>';
    el.innerHTML = h;
    return;
  }

  if(e.tipo === 'self'){
    rows.forEach(function(r){ h += pendCard(r); });
    el.innerHTML = h;
    return;
  }

  // líder/gestão: acordeão por vendedor, quem tem mais pendência primeiro
  const grupos = {};
  rows.forEach(function(r){ const k = r.x.s || '(sem vendedor)'; (grupos[k] = grupos[k] || []).push(r); });
  const nomes = Object.keys(grupos).sort(function(a,b){
    return grupos[b].length - grupos[a].length || a.localeCompare(b,'pt-BR');
  });
  nomes.forEach(function(nome, i){
    const g = grupos[nome];
    const gm = g.reduce(function(a,r){ return a + (r.x.mwh||0); }, 0);
    if(pendAberto[i] === undefined) pendAberto[i] = true;   // líder abre o time já expandido
    const open = !!pendAberto[i];
    h += '<div class="agd-praca' + (open?' open':'') + '">'
      + '<button class="agd-vend-head" onclick="pendToggle(' + i + ')">'
        + ((typeof avatarImg==='function') ? avatarImg(nome,'agd-avatar') : '')
        + '<span class="agd-vend-name">' + escapeHtml(nome) + '</span>'
        + '<span class="agd-vend-stat">' + g.length + ' · ' + gm.toFixed(1) + ' MWh</span>'
        + '<span class="agd-caret"' + (open?' style="transform:rotate(90deg)"':'') + '>▶</span>'
      + '</button>'
      + '<div class="agd-praca-body">' + g.map(pendCard).join('') + '</div>'
      + '</div>';
  });
  el.innerHTML = h;
}

// v2.104 — Drill-down "Aguardando documentação": praça → vendedor → clientes
function openAgDocsModal(){
  const me = getCurrentVendedor();  // fix: me precisa estar em escopo (botao troca / isLider)
  const docs = rawData.filter(isAgDocs);
  // agrupa por praça e vendedor
  const byPraca = {};
  docs.forEach(x => {
    const pk = x.praca?.key || 'outras';
    const pl = x.praca?.label || 'Outras';
    const pc = x.praca?.color || '#888';
    if(!byPraca[pk]) byPraca[pk] = { label: pl, color: pc, count: 0, mwh: 0, vend: {} };
    byPraca[pk].count++; byPraca[pk].mwh += x.mwh;
    if(!byPraca[pk].vend[x.s]) byPraca[pk].vend[x.s] = { count: 0, mwh: 0, clientes: [] };
    byPraca[pk].vend[x.s].count++; byPraca[pk].vend[x.s].mwh += x.mwh;
    byPraca[pk].vend[x.s].clientes.push(x);
  });
  const ordem = ['salvador','feira','natal','rninterior','spi','ribeirao','ce','outras'];
  const pracasOrd = Object.keys(byPraca).sort((a,b)=>{
    const ia=ordem.indexOf(a), ib=ordem.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });

  const pracasHtml = pracasOrd.map(pk => {
    const p = byPraca[pk];
    const vendOrd = Object.keys(p.vend).sort((a,b)=>p.vend[b].mwh - p.vend[a].mwh);
    const vendHtml = vendOrd.map(v => {
      const vd = p.vend[v];
      const cliHtml = vd.clientes
        .sort((a,b)=>b.mwh-a.mwh)
        .map(c => `
          <div class="agd-cli${c.deal_id?' agd-cli-act':''}"${c.deal_id?` onclick="this.classList.toggle('open')"`:''}>
            <div class="agd-cli-name">${escapeHtml(c.c || 'Cliente sem nome')}</div>
            <div class="agd-cli-meta">⚡ ${(c.mwh||0).toFixed(2)} MWh · ${escapeHtml(c.dist||'—')}${c.city?` · 📍 ${escapeHtml(c.city)}`:''}${c.idle?` · ⏳ ${c.idle}d parado`:''}</div>
            ${(c.docs==='__OK__') ? `<div class="agd-cli-docs ok">✅ Documentos recebidos</div>` : (c.docs&&c.docs.trim()) ? `<div class="agd-cli-docs">📄 Falta: ${escapeHtml(c.docs.trim())}</div>` : `<div class="agd-cli-docs muted">📄 Documentos pendentes (detalhe indisponível)</div>`}
            ${c.deal_id ? `
            <div class="agd-cli-actions">
              <button class="relatar-btn" data-deal-id="${escapeHtml(c.deal_id)}" data-cliente-nome="${escapeHtml(c.c)}" onclick="event.stopPropagation(); openRelatarSituacaoFromBtn(this)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 11a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v3a4 4 0 0 1-4 4H8l-5 4z"/></svg>
                Relatar situação ao suporte
              </button>
              ${(isGestor_(me)||isLider(me))?`<button onclick="event.stopPropagation(); openTrocarResponsavel('${c.deal_id}')" style="display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:6px;padding:9px 12px;background:#FFF7ED;border:1px solid #FED7AA;border-radius:10px;font-size:12px;font-weight:700;color:#C2410C;cursor:pointer;font-family:inherit">🔄 Solicitar troca de responsável</button>`:''}
              <button onclick="event.stopPropagation(); solicitarPerdido('${c.deal_id}')" style="display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:6px;padding:9px 12px;background:#FEF2F2;border:1px solid #FECACA;border-radius:10px;font-size:12px;font-weight:700;color:#B91C1C;cursor:pointer;font-family:inherit">🚫 Solicitar perdido</button>
            </div>`:''}
          </div>`).join('');
      return `
        <div class="agd-vend">
          <button class="agd-vend-head" onclick="this.parentElement.classList.toggle('open')">
            ${avatarImg(v, 'agd-avatar')}
            <span class="agd-vend-name">${escapeHtml(v)}</span>
            <span class="agd-vend-stat">${vd.count} · ${vd.mwh.toFixed(1)} MWh</span>
            <span class="agd-caret">▸</span>
          </button>
          <div class="agd-vend-body">${cliHtml}</div>
        </div>`;
    }).join('');
    return `
      <div class="agd-praca">
        <button class="agd-praca-head" onclick="this.parentElement.classList.toggle('open')">
          <span class="agd-dot" style="background:${p.color}"></span>
          <span class="agd-praca-name">${escapeHtml(p.label)}</span>
          <span class="agd-praca-stat">${p.count} clientes · ${p.mwh.toFixed(1)} MWh</span>
          <span class="agd-caret">▸</span>
        </button>
        <div class="agd-praca-body">${vendHtml}</div>
      </div>`;
  }).join('');

  const totC = docs.length, totM = docs.reduce((a,x)=>a+x.mwh,0);
  const existing = document.getElementById('agdocs-modal');
  if(existing) existing.remove();
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'agdocs-modal';
  modal.onclick = (e)=>{ if(e.target===modal) closeAgDocsModal(); };
  modal.innerHTML = `
    <div class="modal-sheet" style="max-height:85vh;overflow-y:auto">
      <div class="modal-handle"></div>
      <button class="modal-close" onclick="closeAgDocsModal()">✕</button>
      <div class="modal-title">📄 Aguardando documentação</div>
      <div class="modal-sub">${totC} clientes · ${totM.toFixed(1)} MWh travados · toque na praça para ver os vendedores</div>

    </div>`;
  document.body.appendChild(modal);

function closeAgDocsModal(){
  const m = document.getElementById('agdocs-modal');
  if(m) m.remove();
}

// v2.104 — Solicitar troca de responsável: sheet com mensagem pré-montada + campo de novo responsável

      <button class="modal-close" onclick="document.getElementById('trocar-resp-modal').remove()">✕</button>

      </div>

                [...document.querySelectorAll('#trocar-resp-modal button')].find(b=>b.textContent.includes('Copiar'));
    if(btn){ const orig=btn.textContent; btn.textContent='✓ Copiado!'; setTimeout(()=>btn.textContent=orig,1800); }
  });
}

function _fmtDate(iso){
  if(!iso) return '—';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : iso;
}
function _fmtCPF(v){
  const d = String(v||'').replace(/\D/g,'');
  if (d.length !== 11) return v || '—';
  return `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6,9)}-${d.slice(9)}`;
}
function _fmtCNPJ(v){
  const d = String(v||'').replace(/\D/g,'');
  if (d.length !== 14) return v || '—';
  return `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8,12)}-${d.slice(12)}`;
}
function _fmtMoney(v){
  if (!v && v !== 0) return '—';
  return 'R$ ' + Number(v).toFixed(2).replace('.', ',').replace(/(\d)(?=(\d{3})+,)/g, '$1.');
}
function _fmtTel(v){
  const d = String(v||'').replace(/\D/g,'');
  if (d.length < 10) return v || '—';
  // +55 (XX) XXXXX-XXXX
  const start = d.length === 13 ? 2 : 0; // se já tem 55, pula
  const rest = d.slice(start);
  const ddd = rest.slice(0,2);
  const num = rest.slice(2);
  const sep = num.length === 9 ? 5 : 4;
  return `(${ddd}) ${num.slice(0,sep)}-${num.slice(sep)}`;
}

// ── PAGAMENTO ANTECIPA (planilha de depositos, ao vivo) ─────────────────
// Cruza o contract_id do deal com a planilha de controle de depositos via
// action 'pagAntecipa' do Apps Script (v2.38). O Apps Script le a planilha
// com a conta do dono do script; o front so manda o contract_id do cliente
// que o usuario abriu. Cache em memoria pra nao reconsultar no mesmo acesso.
const _PAG_CACHE = {};

// Busca em LOTE. O Apps Script le a planilha de depositos INTEIRA a cada
// chamada, entao pedir 1 contrato custa o mesmo que pedir 142 (~2s medidos).
// Como ele roda uma execucao por vez POR USUARIO, uma chamada por cliente
// aberto entraria na fila atras da sincronizacao de leads (15-20s) e a secao
// demoraria a preencher. Uma chamada so traz todos os contratos Antecipa da
// carteira; da 2a abertura em diante e instantaneo e sem rede.
let _PAG_PROMISE = null;              // busca em voo (aberturas simultaneas entram de carona)
let _PAG_TS = 0;                      // quando o lote foi carregado
const _PAG_TTL_MS = 10 * 60 * 1000;   // 10 min: deposito novo aparece sem recarregar o app

function _pagIdsDaCarteira(){
  try {
    const vistos = {}, ids = [];
    for (let i = 0; i < rawData.length; i++) {
      const x = rawData[i];
      if (!x || !x.cid) continue;
      if (String(x.produto || '').toUpperCase().indexOf('ANTECIPA') < 0) continue;
      if (vistos[x.cid]) continue;
      vistos[x.cid] = 1; ids.push(x.cid);
    }
    return ids;
  } catch (_e) { return []; }
}

function _pagFetchLote(cidGarantido){
  if (_PAG_PROMISE) return _PAG_PROMISE;
  const ids = _pagIdsDaCarteira();
  if (cidGarantido && ids.indexOf(cidGarantido) < 0) ids.push(cidGarantido);
  if (!ids.length) return Promise.resolve();
  _PAG_PROMISE = apiCall('pagAntecipa', { contract_ids: ids }, { timeoutMs: 30000 })
    .then(function(r){
      const pag = (r && r.pag) || {};
      // guarda null pros contratos sem deposito: 'undefined' segue significando
      // "ainda nao buscado", que e o que o _loadPagAntecipa testa.
      for (let i = 0; i < ids.length; i++) _PAG_CACHE[ids[i]] = pag[ids[i]] || null;
      _PAG_TS = Date.now();
      _PAG_PROMISE = null;
    })
    .catch(function(err){ _PAG_PROMISE = null; throw err; });   // erro nao gruda: da pra tentar de novo
  return _PAG_PROMISE;
}

// Rede de campo cai. Tenta o lote, repete 1x depois de 1,5s e, se ainda assim
// falhar, pede SO o contrato deste cliente (requisicao minima) — melhor mostrar
// o pagamento de um do que nenhum.
async function _pagBuscaComRetry(cid){
  try { await _pagFetchLote(cid); return; }
  catch (_e1) {
    await new Promise(function(r){ setTimeout(r, 1500); });
    try { await _pagFetchLote(cid); return; }
    catch (_e2) {
      const r = await apiCall('pagAntecipa', { contract_ids: [cid] }, { timeoutMs: 15000 });
      _PAG_CACHE[cid] = (r && r.pag && r.pag[cid]) || null;
    }
  }
}

// Botao "tentar de novo" do recado de erro: devolve o estado de carregando e
// chama de novo (o erro nunca fica no cache, entao a nova tentativa e limpa).
function _pagTentarDeNovo(cid){
  const box = document.getElementById('cd-pag-box');
  if (box) {
    box.innerHTML = '<div class="cd-section-title">\uD83D\uDCB8 Pagamento Antecipa</div>'
      + '<div class="cd-row"><div class="cd-row-k">Status</div><div class="cd-row-v" style="color:var(--muted)">consultando\u2026</div></div>';
    box.style.display = '';
  }
  _loadPagAntecipa(cid);
}

async function _loadPagAntecipa(cid){
  function done(html){
    const load = document.getElementById('cd-pag-load');
    if (load) load.remove();
    const box = document.getElementById('cd-pag-box');
    if (!box) return;                       // modal ja foi fechado
    if (!html) { box.remove(); return; }    // sem pagamento => secao nao aparece
    box.innerHTML = html;
    box.style.display = '';
  }

  try {
    if (_PAG_TS && (Date.now() - _PAG_TS) > _PAG_TTL_MS) {   // lote velho: derruba e rebusca
      for (const k in _PAG_CACHE) delete _PAG_CACHE[k];
      _PAG_TS = 0;
    }
    let lista = _PAG_CACHE[cid];
    if (lista === undefined) {
      await _pagBuscaComRetry(cid);        // 1 chamada cobre a carteira toda (c/ retry)
      lista = _PAG_CACHE[cid];
    }
    if (!lista || !lista.length) { done(''); return; }

    const pagos  = lista.filter(p => /transferid/i.test(p.status || ''));
    const falhou = lista.some(p => /falha/i.test(p.status || ''));
    const total  = pagos.reduce((s,p) => s + (Number(p.valor) || 0), 0);
    const datas  = pagos.map(p => p.data).filter(Boolean);

    let resumo, cor;
    if (pagos.length)   { resumo = pagos.length > 1 ? `Pago (${pagos.length} parcelas)` : 'Pago'; cor = '#1D9E75'; }
    else if (falhou)    { resumo = 'Falha no pagamento';                                          cor = 'var(--red)'; }
    else                { resumo = lista[0].status || 'Em processamento';                         cor = 'var(--orange)'; }

    const linhas = lista.map(function(p, i){
      let url = String(p.comprovante || '').trim(); if(url.indexOf('1TAfY8Wcnkhr6sMVYGHN8qexYLEjBXJc2')>=0) url='';
      const link = /^https?:\/\//i.test(url)
        ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener" class="cd-row-v-link" style="text-decoration:none" onclick="event.stopPropagation()">ver comprovante (UC ${escapeHtml(String(p.uc||''))}) (UC ${escapeHtml(String(p.uc||''))}) (UC ${escapeHtml(String(p.uc||''))}) (UC ${escapeHtml(String(p.uc||''))}) (UC ${escapeHtml(String(p.uc||''))}) (UC ${escapeHtml(String(p.uc||''))}) (UC ${escapeHtml(String(p.uc||''))}) ›</a>`
        : '<span style="color:var(--muted)">sem comprovante</span>';
      const rot = (lista.length > 1 ? ('Parcela ' + (i+1)) : 'Valor') + (p.data ? ' · ' + escapeHtml(p.data) : '');
      const st  = /transferid/i.test(p.status || '') ? '' :
                  ` <span style="color:var(--muted)">(${escapeHtml(p.status || '—')})</span>`;
      return `<div class="cd-row">
                <div class="cd-row-k">${rot}</div>
                <div class="cd-row-v">${p.valor != null ? _fmtMoney(p.valor) : '—'}${st} · ${link}</div>
              </div>`;
    }).join('');

    done(`<div class="cd-section-title">💸 Pagamento Antecipa</div>
      <div class="cd-row">
        <div class="cd-row-k">Status</div>
        <div class="cd-row-v" style="color:${cor};font-weight:600">${escapeHtml(resumo)}</div>
      </div>
      ${pagos.length > 1 ? `<div class="cd-row"><div class="cd-row-k">Total pago</div><div class="cd-row-v" style="font-weight:600">${_fmtMoney(total)}</div></div>` : ''}
      ${datas.length ? `<div class="cd-row"><div class="cd-row-k">${datas.length > 1 ? 'Último pagamento' : 'Data do pagamento'}</div><div class="cd-row-v">${escapeHtml(datas[datas.length-1])}</div></div>` : ''}
      ${linhas}`);
  } catch (e) {
    done(`<div class="cd-section-title">💸 Pagamento Antecipa</div>
      <div class="cd-row">
        <div class="cd-row-k">Status</div>
        <div class="cd-row-v" style="color:var(--muted)">não deu pra consultar agora</div>
      </div>
      <div class="cd-row cd-row-action" onclick="event.stopPropagation(); _pagTentarDeNovo('${escapeHtml(cid)}')">
        <div class="cd-row-k" style="max-width:58%">${escapeHtml(String((e && e.message) || e))}</div>
        <div class="cd-row-v cd-row-v-link">tentar de novo ›</div>
      </div>`);
  }
}

function dialLeadTel(ev){
  const el = document.getElementById('lead-tel');
  const raw = ((el && el.value) || '').trim();
  const digits = raw.replace(/\D/g,'');
  if (digits.length < 10) { alert('Digite o telefone com DDD (mín. 10 dígitos) antes de contatar.'); if (el) el.focus(); return; }
  // Abre o menu com as opções Ligar e WhatsApp (mesmo do detalhe do cliente)
  const shown = (typeof _fmtTel === 'function') ? _fmtTel(raw) : raw;
  openPhoneActions(shown, ev);
}

function openPhoneActions(tel, ev){
  if (ev) { ev.stopPropagation(); ev.preventDefault(); }
  const digits = (tel||'').replace(/\D/g,'');
  if (!digits || digits.length < 10) {
    alert('Esse cliente não tem telefone válido cadastrado.');
    return;
  }
  // Normaliza pra +55 (BR) se ainda não tem código de país
  const withCountry = digits.startsWith('55') ? digits : '55' + digits;
  const telHref = 'tel:+' + withCountry;
  const waHref  = 'https://wa.me/' + withCountry;

  const existing = document.getElementById('phone-actions-modal');
  if (existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'phone-actions-modal';
  overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };

  overlay.innerHTML = `
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <button class="modal-close" onclick="document.getElementById('phone-actions-modal').remove()">✕</button>
      <div class="modal-title">${escapeHtml(tel)}</div>
      <div class="modal-sub">Como você quer falar com o cliente?</div>

        <span class="phone-action-icon">📞</span>

function copaStats(){
  const aprov = rawData.filter(x => isAprovado(x) && copaNoPeriodo(x));
  const byS = {};
  // Snapshot fixo de junho (16-30/06) — rawData do mobile só tem o mês corrente
  Object.keys(COPA_JUNE).forEach(k => { byS[k] = { clientes: COPA_JUNE[k].c||0, baleias: COPA_JUNE[k].b||0 }; });
  aprov.forEach(x => {
    const k = x.s || '—';
    if(!byS[k]) byS[k] = { clientes:0, baleias:0 };
    if((x.fatura||0) > COPA_BALEIA_FATURA) byS[k].baleias++; else byS[k].clientes++;
  });
  const names = [...new Set([...Object.keys(byS), ...Object.keys(METAS)])];
  const rows = names.map(name => {
    const o = byS[name] || { clientes:0, baleias:0 };
    const fig = o.clientes + o.baleias*3;
    return { name, clientes:o.clientes, baleias:o.baleias, fig, unlocked:Math.min(fig,COPA_ALBUM) };
  }).sort((a,b)=> b.fig-a.fig || b.baleias-a.baleias || a.name.localeCompare(b.name));
  return rows;
}

    <div class="rules-card">
      <div class="rules-title">📋 Regras da Campanha</div>
      <div class="rules-desc">${cfg.desc}</div>
      ${temBonus ? `<div style="background:#F3F1FF;border:1px solid #D9D4FF;border-radius:12px;padding:10px 12px;margin-bottom:12px">
        <div style="font-size:12px;font-weight:800;color:var(--purple);text-align:center">⚡ Nesta semana o MWh do Antecipa vale 1,5×</div>
        <div style="font-size:11px;color:var(--muted);text-align:center;margin-top:4px;line-height:1.5">
          Cliente de 2 MWh no Antecipa entra como <b style="color:var(--purple)">3 MWh</b> aqui.<br>
          <span style="color:var(--blue);font-weight:700">Azul</span> = MWh normal · <span style="color:var(--purple);font-weight:700">roxo</span> = bônus Antecipa.
        </div>
      </div>` : ''}
      <div class="tiers-grid${cfg.tiers.length===3?' three-col':''}">
        ${[...cfg.tiers].sort((a,b)=>a.v-b.v).map(t=>`<div class="tier tier-${t.tier}"><div class="tier-mwh">${t.v} ${cfg.tierUnit}</div><div class="tier-prize">${t.label}</div></div>`).join('')}
      </div>
    </div>`;

  full.forEach((s,i)=>{
    const has = s.val > 0;
    const mesData = rawData.filter(x=>x.s===s.name&&noMes(x)&&isAprovado(x));
    const mes = mesData.reduce((a,x)=>a+x.mwh,0);
    const pct = s.meta>0?(mes/s.meta)*100:0;  // atingimento real (pode passar de 100%); sem barra aqui, entao nao precisa cap (Felipe 24/07)
    const pc = pct>=70?'var(--green)':pct>=40?'var(--blue)':'var(--red)';
    const tier = campTier(cfg, s.val);
    const next = campNext(cfg, s.val);
    const prizeInfo = tier ? `<span class="prize-badge b${tier.tier}">🏆 ${tier.label}</span>` : '';
    let nextInfo = '';
    if (next) nextInfo = `<div class="prize-empty">Faltam ${campFaltaTxt(cfg, next.v - s.val)} para ${next.label}</div>`;
    const safeName = s.name.replace(/'/g, "\\'");
    const cardClass = has ? 'rank-card clickable' : 'rank-card';
    const cardOnclick = has ? `onclick="openCampDetails('${safeName}', '${cfg.key}')"` : '';
    html += `
      <div class="${cardClass}" ${cardOnclick}>
        <div class="rank-num ${i<3&&has?'top':''}">${i<3&&has?medals[i]:i+1}</div>
        ${avatarImg(s.name, 'rank-avatar')}
        <div class="rank-info">
          <div class="rank-name">${s.name}${prizeInfo}</div>
          <div class="rank-praca" style="color:${isLider(s.name)?'var(--muted)':pc}">Mês: ${mes.toFixed(1)} MWh${isLider(s.name)?'':` · ${pct.toFixed(0)}% da meta`}</div>
          ${temBonus && has ? `<div style="font-size:11px;margin-top:2px;line-height:1.4"><span style="color:var(--blue);font-weight:700">${campNum(s.parts.base)}</span> <span style="color:var(--muted)">normal</span>${s.parts.bonus>0?` <span style="color:var(--purple);font-weight:800">+ ${campNum(s.parts.bonus)} Antecipa</span>`:''}</div>` : ''}
          ${nextInfo}
        </div>
        <div class="rank-right">
          <div class="rank-mwh ${has?'':'zero'}">${has?campFmt(cfg,s.val):'—'}</div>
          <div class="rank-unit">${has?cfg.unit:''}</div>
        </div>
      </div>`;
  });
  return html;
}

// Data dos dados: 2026-06-03 (última data no RAW_PROP) — usar como "hoje"
const PROP_TODAY = (function(){
  // Data REAL de hoje no fuso de Brasília (independe do fuso do aparelho e da data dos dados).
  // Antes era fixa na data máxima dos dados, o que fazia D-1 apontar pro dia errado quando o dado estava atrasado.
  try { return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); }
  catch(e){ return new Date(Date.now()-3*3600000).toISOString().slice(0,10); }
})();

function filterPropByPeriod(data, period){
  if(period === 'mes') return data; // todo o mês já filtrado
  // Calcula data de referência (PROP_TODAY)
  const ref = new Date(PROP_TODAY + 'T00:00:00');
  if(period === 'd0'){
    return data.filter(r => r.date === PROP_TODAY);
  }
  if(period === 'd1'){
    const y = new Date(ref); y.setDate(y.getDate()-1);
    const ystr = y.toISOString().slice(0,10);
    return data.filter(r => r.date === ystr);
  }
  if(period === 'semana'){
    // Semana atual: do início da semana (segunda) até hoje
    const start = new Date(ref);
    const day = start.getDay(); // 0=dom, 1=seg ... 5=Friday
    const diff = (day === 0 ? 6 : day - 1); // dias desde segunda
    start.setDate(start.getDate() - diff);
    const startStr = start.toISOString().slice(0,10);
    return data.filter(r => r.date >= startStr && r.date <= PROP_TODAY);
  }
  if(period === 's1'){
    // Semana passada: segunda a domingo da semana anterior
    const start = new Date(ref);
    const day = start.getDay();
    const diff = (day === 0 ? 6 : day - 1);
    start.setDate(start.getDate() - diff - 7);   // segunda da semana passada
    const end = new Date(start); end.setDate(end.getDate() + 6); // domingo
    const startStr = start.toISOString().slice(0,10);
    const endStr = end.toISOString().slice(0,10);
    return data.filter(r => r.date >= startStr && r.date <= endStr);
  }
  return data;
}

// v2.137 — testa se uma data ISO (YYYY-MM-DD) cai no período selecionado das Tarefas de Venda.
// Mesma semântica do desktop (dateInRealPeriod): D0=hoje, D-1=ontem, Semana=segunda→hoje, Mês=mês corrente.
// Tudo ancorado em PROP_TODAY (fuso Brasília) e em aritmética UTC p/ não sofrer drift de fuso.
function tarefaInPeriod(ds){
  if(!ds) return false;
  ds = String(ds).slice(0,10);
  const T = PROP_TODAY;
  if(propPeriod === 'mes') return ds.slice(0,7) === T.slice(0,7);
  const [y,m,d] = T.split('-').map(Number);
  if(propPeriod === 'd0') return ds === T;
  if(propPeriod === 'd1'){
    const yd = new Date(Date.UTC(y, m-1, d-1)).toISOString().slice(0,10);
    return ds === yd;
  }
  if(propPeriod === 'semana'){
    const ref = new Date(Date.UTC(y, m-1, d));
    const dow = ref.getUTCDay(); const off = (dow === 0 ? 6 : dow - 1);
    const start = new Date(ref.getTime() - off*86400000).toISOString().slice(0,10);
    return ds >= start && ds <= T;
  }
  if(propPeriod === 's1'){
    const ref = new Date(Date.UTC(y, m-1, d));
    const dow = ref.getUTCDay(); const off = (dow === 0 ? 6 : dow - 1);
    const start = new Date(ref.getTime() - (off+7)*86400000);
    const end = new Date(start.getTime() + 6*86400000);
    return ds >= start.toISOString().slice(0,10) && ds <= end.toISOString().slice(0,10);
  }
  return true;
}

function renderPropostas() {
  const el = document.getElementById('s4-content');
  // v2.167 — Propostas/Ranking nao usam mais leads (Visitas saiu); nao forca load de leads aqui.

  // v2.104 — Ranking é sempre do time todo (não filtra pela identidade/seller-select).
  let data = RAW_PROP;
  data = filterPropByPeriod(data, propPeriod);

  const totalProp = data.length;
  const totalMwh  = data.reduce((a,r)=>a+r.consumption_mwh,0);
  const totalCli  = new Set(data.map(r=>r.current_client_name)).size;
  const accepted  = data.filter(r=>r.accepted_proposal).length;
  const convRate  = totalProp>0?((accepted/totalProp)*100).toFixed(1):0;

  // By praça
  const pracas = {};
  data.forEach(r=>{
    if(!pracas[r.praca]) pracas[r.praca]={prop:0,mwh:0};
    pracas[r.praca].prop++;
    pracas[r.praca].mwh+=r.consumption_mwh;
  });

  // By seller — ordena pela métrica selecionada
  const sellers = {};
  data.forEach(r=>{
    if(!sellers[r.seller]) sellers[r.seller]={prop:0,mwh:0,aprov:0,aprovCount:0,tarefas:0,antecipa:0,antMwh:0};
    sellers[r.seller].prop++;
    sellers[r.seller].mwh+=r.consumption_mwh;
  });

  // v2.104 — MWh APROVADO por vendedor (vem de rawData/deals, não de propostas).
  // Respeita o mesmo filtro de período, mas pela data de aprovação (aprov_date).
  const aprovBase = rawData
    .filter(x => isAprovado(x))
    .map(x => ({ seller: x.s, mwh: x.mwh, date: x.aprov_date }));
  filterPropByPeriod(aprovBase, propPeriod).forEach(r=>{
    if(!sellers[r.seller]) sellers[r.seller]={prop:0,mwh:0,aprov:0,aprovCount:0,tarefas:0,antecipa:0,antMwh:0};
    sellers[r.seller].aprov += r.mwh;
    sellers[r.seller].aprovCount += 1;
  });

  // v2.168 — ranking Antecipa: clientes com produto Antecipa vigente (crédito aprovado)
  const antecipaBase = rawData
    .filter(x => isAprovado(x) && campMatch(CAMP_CFG.antecipa, x))
    .map(x => ({ seller: x.s, mwh: x.mwh, date: x.aprov_date }));
  filterPropByPeriod(antecipaBase, propPeriod).forEach(r=>{
    if(!sellers[r.seller]) sellers[r.seller]={prop:0,mwh:0,aprov:0,aprovCount:0,tarefas:0,antecipa:0,antMwh:0};
    sellers[r.seller].antecipa = (sellers[r.seller].antecipa||0) + 1;
    sellers[r.seller].antMwh   = (sellers[r.seller].antMwh||0) + (r.mwh||0);   // MWh 1x (o 1,5x e so da campanha)
  });

  // v2.167 — ranking de Visitas removido: dependia dos leads de TODOS os vendedores
  // (payload pesado no celular). Ranking usa so RAW_PROP/rawData (ja embutidos).

  // v2.104 — vendedores fora do time: somem da LISTA do ranking, mas os números
  // continuam somando nos totais de praça (pracas vem de `data`, não daqui).
  const RANK_HIDDEN = OCULTOS_TIME;
  const topSellers = Object.entries(sellers)
    .filter(([name]) => !RANK_HIDDEN.includes(name))
    .sort((a,b)=>{
    if(propMetric === 'aprovado') return b[1].aprov - a[1].aprov;
    if(propMetric === 'qtd')      return b[1].aprovCount - a[1].aprovCount;
    if(propMetric === 'antecipa'){
      if(antRankBy === 'mwh') return (b[1].antMwh||0) - (a[1].antMwh||0);
      return ((b[1].antecipa||0) - (a[1].antecipa||0)) || ((b[1].antMwh||0) - (a[1].antMwh||0));
    }
    return b[1].prop - a[1].prop;
  });

  const PC = {'Salvador':'#1D9E75','Feira de Santana':'#EF9F27','Natal':'#378ADD','CE':'#D4537E','SPI':'#7F77DD','Outros':'#888'};

  // Filtros de período + toggle métrica
  // v2.157 — aviso quando o S-1 (semana passada) inclui dias do mês anterior (fora da base do mês corrente)
  let s1Note = '';
  if(propPeriod === 's1'){
    const _r = new Date(PROP_TODAY + 'T00:00:00');
    const _day = _r.getDay(); const _diff = (_day === 0 ? 6 : _day - 1);
    const _wk = new Date(_r); _wk.setDate(_wk.getDate() - _diff - 7);
    const _ms = PROP_TODAY.slice(0,7) + '-01';
    if(_wk.toISOString().slice(0,10) < _ms){
      s1Note = `<div style="font-size:10px;color:#92400E;background:#FEF3C7;border:1px solid #FCD34D;border-radius:8px;padding:6px 9px;margin:0 0 10px">⚠️ A semana passada começou em ${_wk.toISOString().slice(8,10)}/${_wk.toISOString().slice(5,7)} (mês anterior). O ranking mostra só a partir de 01/${_ms.slice(5,7)}.</div>`;
    }
  }
  let html = `
    <div class="filter-tabs">
      <div class="filter-tab ${propPeriod==='d0'?'active':''}" onclick="setPropPeriod('d0')">D0 · Hoje</div>
      <div class="filter-tab ${propPeriod==='d1'?'active':''}" onclick="setPropPeriod('d1')">D-1 · Ontem</div>
      <div class="filter-tab ${propPeriod==='semana'?'active':''}" onclick="setPropPeriod('semana')">Semana</div>
      <div class="filter-tab ${propPeriod==='s1'?'active':''}" onclick="setPropPeriod('s1')">S-1</div>
      <div class="filter-tab ${propPeriod==='mes'?'active':''}" onclick="setPropPeriod('mes')">Mês</div>
    </div>${s1Note}`;

  html += `<div class="section-head">Ranking por Vendedor</div>
    <div class="rk-seg">
      <div class="rk-seg-btn ${propMetric==='aprovado'?'active':''}" onclick="setPropMetric('aprovado')"><span class="ic">⚡</span><span class="lb">MWh aprov.</span></div>
      <div class="rk-seg-btn ${propMetric==='antecipa'?'active':''}" onclick="setPropMetric('antecipa')"><span class="ic">💳</span><span class="lb">Antecipa</span></div>
      <div class="rk-seg-btn ${propMetric==='qtd'?'active':''}" onclick="setPropMetric('qtd')"><span class="ic">👥</span><span class="lb">Clientes</span></div>
      <div class="rk-seg-btn ${propMetric==='propostas'?'active':''}" onclick="setPropMetric('propostas')"><span class="ic">📋</span><span class="lb">Propostas</span></div>
    </div>
    ${propMetric==='antecipa' ? `<div class="rk-sub">
      <span class="rk-sub-lb">Ordenar por</span>
      <div class="rk-sub-btn ${antRankBy==='cli'?'active':''}" onclick="setAntRankBy('cli')">💳 Clientes</div>
      <div class="rk-sub-btn ${antRankBy==='mwh'?'active':''}" onclick="setAntRankBy('mwh')">⚡ MWh</div>
    </div>` : ''}
    <div class="rk-scope">
      ${[['','Todas'],['salvador','Salvador'],['feira','Feira'],['natal','RN Capital'],['rninterior','RN Interior'],['spi','Campinas SPI'],['ribeirao','Ribeirão SPI'],['ce','CE']].map(o=>`<div class="rk-chip ${rankScope===o[0]?'active':''}" onclick="setRankScope('${o[0]}')">${o[1]}</div>`).join('')}
    </div>`;

  // Filtra vendedores pela praça selecionada
  const filteredSellers = rankScope
    ? topSellers.filter(([name])=> (SELLER_PRACA[name]||'outras') === rankScope)
    : topSellers;

  const medals = ['🥇','🥈','🥉'];

  function renderSellerCard(name, d, i){
    const isMe = name === (typeof getCurrentVendedor==='function'?getCurrentVendedor():'');
    let mainVal, mainUnit, subInfo;
    if(propMetric === 'aprovado'){
      mainVal = d.aprov.toFixed(1); mainUnit = 'MWh aprov.';
      subInfo = `✅ ${d.aprovCount} aprov · 📋 ${d.prop} props`;
    } else if(propMetric === 'qtd'){
      mainVal = d.aprovCount; mainUnit = d.aprovCount===1?'aprovado':'aprovados';
      subInfo = `⚡ ${d.aprov.toFixed(1)} MWh · 📋 ${d.prop} props`;
    } else if(propMetric === 'antecipa'){
      if(antRankBy === 'mwh'){
        mainVal = (d.antMwh||0).toFixed(1); mainUnit = 'MWh antecipa';
        subInfo = `💳 ${d.antecipa||0} antecipa · 📋 ${d.prop} props`;
      } else {
        mainVal = (d.antecipa||0); mainUnit = 'antecipa';
        subInfo = `⚡ ${(d.antMwh||0).toFixed(1)} MWh antecipa · 📋 ${d.prop} props`;
      }
    } else {
      mainVal = d.prop; mainUnit = 'props';
      subInfo = `⚡ ${d.aprov.toFixed(1)} MWh aprov.`;
    }
    const hasMwh = d.aprov > 0;
    const cardClass = (hasMwh ? 'rank-card clickable' : 'rank-card') + (isMe ? ' rank-me' : '');
    return `
      <div class="${cardClass}" ${hasMwh?`onclick="openRankSellerModal(this)"`:''} data-name="${name}" data-metric="${propMetric}" data-period="${propPeriod}">
        <div class="rank-num ${i<3?'top':''}">${i<3?medals[i]:i+1}</div>
        ${avatarImg(name, 'rank-avatar')}
        <div class="rank-info">
          <div class="rank-name">${name}${isMe?' <span style="color:var(--blue);font-size:10px;font-weight:800">· você</span>':''}</div>
          <div class="rank-praca" style="color:var(--muted)">${subInfo}</div>
        </div>
        <div class="rank-right">
          <div class="rank-mwh">${mainVal}</div>
          <div class="rank-unit">${mainUnit}</div>
        </div>
      </div>`;
  }

  if(filteredSellers.length === 0){
    html += `<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">Sem dados neste período</div></div>`;
  } else {
    filteredSellers.forEach(([name,d],i)=>{ html += renderSellerCard(name,d,i); });
  }

  el.innerHTML = html;
}

function isLider(name){ return !!(name && LIDERES[name]); }
function liderPracas(name){
  const v = name ? LIDERES[name] : null;
  if(!v) return [];
  return Array.isArray(v) ? v.slice() : [v];
}
function liderPraca(name){ return liderPracas(name)[0] || ''; }   // compat: 1a praça
function lideraPraca(name, k){
  return !!k && liderPracas(name).indexOf(String(k).toLowerCase()) !== -1;
}
// v2.156 — permissão de edição: dono, ou líder da praça do dono, ou gestor.
function canEditLead(lead){
  const me = getCurrentVendedor();
  if(!me) return false;
  const meN = canonicalVendedor(me);
  const owner = canonicalVendedor((lead && lead.vendedor) || '');
  if(!owner || owner === meN) return true;          // sem dono ou o próprio dono
  if(isGestor_(me)) return true;                     // gestor edita qualquer lead
  const pl = liderPracas(me);                        // líder edita os leads das praças dele
  if(pl.length) return pl.indexOf((SELLER_PRACA[owner] || '').toLowerCase()) !== -1;
  return false;
}

// Mapa fixo e-mail → nome canônico (com acentos). Só muda quando alguém entra/sai do time
// (aí também é preciso adicionar a foto). Tudo o mais (senha/praça/posição/meta) vem da planilha.
const EMAIL_NOME = Object.fromEntries(
  Object.entries(CREDENTIALS).map(([email, c]) => [email, c.nome])
);

// Normaliza o texto da coluna "Praça" da planilha → chave interna + rótulo exibido
function normPracaKey(txt){
  const s = (txt||'').toString().trim().toLowerCase();
  if(s.startsWith('salvador')) return 'salvador';
  if(s.startsWith('feira'))    return 'feira';
  if(s.startsWith('natal') || s === 'rn' || s.includes('capital')) return 'natal';
  if(s.includes('mossor') || s.includes('rn interior') || s === 'rninterior') return 'rninterior';
  if(s.includes('ribeir')) return 'ribeirao';
  if(s === 'spi' || s.includes('paulo') || s.includes('cpfl') || s.includes('interior') || s.includes('campinas')) return 'spi';
  if(s === 'ce' || s.includes('cear') || s.includes('fortaleza') || s.includes('enel')) return 'ce';
  return 'outras';
}
const PRACA_LABEL = { salvador:'Salvador', feira:'Feira de Santana', natal:'RN Capital', rninterior:'RN Interior', spi:'Campinas SPI', ribeirao:'Ribeirão Preto SPI', ce:'CE', outras:'Outros' };

// Aplica as linhas da aba Time (vindas do Apps Script) nas estruturas vivas do CRM.
// rows: [{ email, praca, posicao, meta, senha }]
function applyTeam(rows){
  if(!Array.isArray(rows) || !rows.length) return false;

  const novoVend = [];
  const ordem = ['Salvador','Feira de Santana','RN Capital','RN Interior','Campinas SPI','Ribeirão Preto SPI','CE'];

  rows.forEach(r => {
    const email = (r.email||'').toString().trim().toLowerCase();
    if(!email) return;
    const nome = EMAIL_NOME[email];
    if(!nome) return; // e-mail desconhecido: ignora (precisa entrar no EMAIL_NOME + foto)

    const key   = normPracaKey(r.praca);
    const label = PRACA_LABEL[key] || 'Outros';
    const pos   = (r.posicao||'').toString().trim().toLowerCase();
    const senha = (r.senha!=null ? String(r.senha) : (CREDENTIALS[email]?.senha || '')).trim();
    const meta  = (r.meta!=null && r.meta!=='' && !isNaN(parseFloat(r.meta))) ? parseFloat(r.meta) : (METAS[nome]||0);

    // Credenciais (login)
    CREDENTIALS[email] = { nome, senha };

    // Gestor (admin): fica em "Outros", não entra na lista de vendedores normais
    if(pos.startsWith('gest') || nome === 'Felipe Oliveira'){
      delete LIDERES[nome];
      return;
    }

    // Praça / meta
    SELLER_PRACA[nome] = key;
    METAS[nome] = meta;

    // Posição: líder vê a praça toda; consultor vê só ele
    if(pos.startsWith('lid') || pos.startsWith('líd')){
      // v2.179 — a planilha só tem 1 praça por pessoa; reaplica as praças extras
      const _ex = (LIDER_EXTRA[nome] || []).filter(function(k){ return k !== key; });
      LIDERES[nome] = _ex.length ? [key].concat(_ex) : key;
    }
    else delete LIDERES[nome];

    novoVend.push({ nome, praca: label });
  });

  if(!novoVend.length) return false;

  // Reconstrói a lista de vendedores (ordenada por praça) + admin no fim
  novoVend.sort((a,b) => ordem.indexOf(a.praca) - ordem.indexOf(b.praca));
  novoVend.push({ nome: 'Felipe Oliveira', praca: 'Outros' });
  VENDEDORES = novoVend;

  // Re-deriva a praça de cada deal (depende de SELLER_PRACA) e re-renderiza
  try { rawData.forEach(x => x.praca = getPraca(x.city, x.s)); } catch(e){}
  try {
    initSellerSelect(true);
    renderIdentityBadge();
    if(typeof currentScreen !== 'undefined'){
      if(currentScreen==='resumo')   renderResumo();
      if(currentScreen==='carteira') renderCarteira();
      if(currentScreen==='propostas')renderPropostas();
    }
  } catch(e){}
  return true;
}

function doLogin(email, senha, containerId){
  const cred = CREDENTIALS[(email||'').trim().toLowerCase()];
  // v2.124 — senha case-insensitive (evita falha por maiúscula/minúscula entre digitação e planilha)
  if(!cred || String(cred.senha||'').trim().toLowerCase() !== String(senha||'').trim().toLowerCase()){
    const errEl = document.getElementById(containerId+'-err');
    if(errEl){ errEl.textContent = 'E-mail ou senha incorretos.'; errEl.style.display='block'; }
    const pwEl = document.getElementById(containerId+'-pw');
    if(pwEl){ pwEl.style.borderColor='#FF4444'; pwEl.value=''; pwEl.focus(); }
    return;
  }
  setLastEmail((email||'').trim().toLowerCase());
  pickIdentity(cred.nome);
}

// Valida o par e-mail+senha em tempo real: borda verde + ✓ quando confere
function loginValid(containerId){
  const emEl  = document.getElementById(containerId+'-email');
  const pwEl  = document.getElementById(containerId+'-pw');
  const okEl  = document.getElementById(containerId+'-ok');
  if(!emEl || !pwEl || !okEl) return;
  const email = (emEl.value||'').trim().toLowerCase();
  const senha = (pwEl.value||'').trim().toLowerCase();
  const cred  = CREDENTIALS[email];

// v2.46 — Aliases de vendedores renomeados. Resolve o caso em que leads gravados
// na planilha mantêm o nome antigo (vendedor.field gravado no momento do cadastro)
// mesmo depois do rename. Sem isso, "Antonio Mariano" se identifica e vê 0 leads
// porque os antigos estão como "Antonio Carlos" no Sheets.
const VENDEDOR_ALIASES = {
  'antonio carlos':   'antonio mariano',
  'bruno rodrigues':  'bruno andrade',
  'ananias oliveira': 'ananias neto'
};
function canonicalVendedor(name){
  const n = (name||'').replace(/\s+/g,' ').trim().toLowerCase();
  return VENDEDOR_ALIASES[n] || n;
}

const SESSION_KEY  = 'liora.session.v1';   // legado (sessionStorage) — mantido só p/ compatibilidade
const AUTH_KEY     = 'liora.auth.v1';      // localStorage — login PERSISTE entre reaberturas/deploys
const AUTH_TTL_MS  = 90*24*60*60*1000;     // validade de 90 dias, renovada a cada abertura

// login válido? novo: flag persistente em localStorage (com validade); compat: sessão desta aba
function _authOk(){
  try {
    const raw = localStorage.getItem(AUTH_KEY);
    if(raw){
      const ts = parseInt(raw,10);
      if(isNaN(ts)) return true;                       // valor antigo sem timestamp
      if(Date.now()-ts < AUTH_TTL_MS) return true;
      localStorage.removeItem(AUTH_KEY);               // expirou
    }
    if(sessionStorage.getItem(SESSION_KEY)) return true;  // compat: quem já estava logado nesta aba
  } catch(e) {}
  return false;
}
function _authTouch(){ try { localStorage.setItem(AUTH_KEY, String(Date.now())); } catch(e) {} }

function getCurrentVendedor(){
  try {
    if(!_authOk()) return '';
    return localStorage.getItem(IDENTITY_KEY) || '';
  } catch(e) { return ''; }
}
function setCurrentVendedor(name){
  try { setTimeout(function(){ if(typeof updateMissaoNav==='function') updateMissaoNav(); }, 0); } catch(e) {}
  try {
    localStorage.setItem(IDENTITY_KEY, name || '');
    _authTouch();                                // persiste o login
    sessionStorage.setItem(SESSION_KEY, '1');    // mantém compatibilidade
  } catch(e) {}
}
function clearCurrentVendedor(){
  try {
    localStorage.removeItem(IDENTITY_KEY);
    localStorage.removeItem(AUTH_KEY);
    sessionStorage.removeItem(SESSION_KEY);
  } catch(e) {}
}

// Retorna o último e-mail usado (para pré-preencher o campo)
function getLastEmail(){
  try { return localStorage.getItem('liora.last_email') || ''; } catch(e) { return ''; }
}
function setLastEmail(email){
  try { localStorage.setItem('liora.last_email', email); } catch(e) {}
}
