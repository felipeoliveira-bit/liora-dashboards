// Data dos dados: 2026-06-03 (última data no RAW_PROP) — usar como "hoje"
const PROP_TODAY = (function(){
  // Data REAL de hoje no fuso de Brasília (independe do fuso do aparelho e da data dos dados).
  // Antes era fixa na data máxima dos dados, o que fazia D-1 apontar pro dia errado quando o dado estava atrasado.
  try { return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); }
  catch(e){ return new Date(Date.now()-3*3600000).toISOString().slice(0,10); }
})();

// v2.13.5 — WhatsApp do time de suporte (apenas dígitos, formato internacional)
const SUPORTE_WHATSAPP = '5511952136036'; // +55 11 95213-6036

function filterPropByPeriod(data, period){
  if(period === 'mes') return data; // todo o mês já filtrado
  // Calcula data de referência (PROP_TODAY)
  const ref = new Date(PROP_TODAY + 'T00:00:00');
  if(period === 'd0'){
    return data.filter(r => r.date === PROP_TODAY);
  }
  if(period === 'd1'){
    const y = new Date(ref); y.setDate(y.getDate()-1);
    const ystr = y.toISOString().slice(0,10);
    return data.filter(r => r.date === ystr);
  }
  if(period === 'semana'){
    // Semana atual: do início da semana (segunda) até hoje
    const start = new Date(ref);
    const day = start.getDay(); // 0=dom, 1=seg ... 5=Friday
    const diff = (day === 0 ? 6 : day - 1); // dias desde segunda
    start.setDate(start.getDate() - diff);
    const startStr = start.toISOString().slice(0,10);
    return data.filter(r => r.date >= startStr && r.date <= PROP_TODAY);
  }
  return data;
}

function renderPropostas() {
  const el = document.getElementById('s4-content');

  // v2.104 — Ranking é sempre do time todo (não filtra pela identidade/seller-select).
  let data = RAW_PROP;
  data = filterPropByPeriod(data, propPeriod);

  const totalProp = data.length;
  const totalMwh  = data.reduce((a,r)=>a+r.consumption_mwh,0);
  const totalCli  = new Set(data.map(r=>r.current_client_name)).size;
  const accepted  = data.filter(r=>r.accepted_proposal).length;
  const convRate  = totalProp>0?((accepted/totalProp)*100).toFixed(1):0;

  // By praça
  const pracas = {};
  data.forEach(r=>{
    if(!pracas[r.praca]) pracas[r.praca]={prop:0,mwh:0};
    pracas[r.praca].prop++;
    pracas[r.praca].mwh+=r.consumption_mwh;
  });

  // By seller — ordena pela métrica selecionada
  const sellers = {};
  data.forEach(r=>{
    if(!sellers[r.seller]) sellers[r.seller]={prop:0,mwh:0,aprov:0,tarefas:0};
    sellers[r.seller].prop++;
    sellers[r.seller].mwh+=r.consumption_mwh;
  });

  // v2.104 — MWh APROVADO por vendedor (vem de rawData/deals, não de propostas).
  // Respeita o mesmo filtro de período, mas pela data de aprovação (aprov_date).
  const aprovBase = rawData
    .filter(x => isAprovado(x))
    .map(x => ({ seller: x.s, mwh: x.mwh, date: x.aprov_date }));
  filterPropByPeriod(aprovBase, propPeriod).forEach(r=>{
    if(!sellers[r.seller]) sellers[r.seller]={prop:0,mwh:0,aprov:0,tarefas:0};
    sellers[r.seller].aprov += r.mwh;
  });

  // v2.116 — Tarefas de Venda Hoje: leads criados hoje OU com próxima interação hoje
  const todayStr = new Date().toISOString().slice(0,10);
  (window.leads||[])
    .filter(l => String((l&&l.stage)||'').trim().toLowerCase() !== 'excluido')
    .forEach(l=>{
      const createdToday = l.createdAt && new Date(l.createdAt).toISOString().slice(0,10) === todayStr;
      const intToday     = l.proximaInteracao === todayStr;
      if(createdToday || intToday){
        const v = canonicalVendedor(l.vendedor||'');
        // resolve para nome canônico via EMAIL_NAME reverso
        const nome = Object.entries(CREDENTIALS).find(([,c])=>canonicalVendedor(c.nome)===v)?.[1]?.nome || l.vendedor;
        if(!sellers[nome]) sellers[nome]={prop:0,mwh:0,aprov:0,tarefas:0};
        sellers[nome].tarefas++;
      }
    });

  // v2.104 — vendedores fora do time: somem da LISTA do ranking, mas os números
  // continuam somando nos totais de praça (pracas vem de `data`, não daqui).
  const RANK_HIDDEN = ['Ananias Neto'];
  const topSellers = Object.entries(sellers)
    .filter(([name]) => !RANK_HIDDEN.includes(name))
    .sort((a,b)=>{
    if(propMetric === 'aprovado') return b[1].aprov - a[1].aprov;
    if(propMetric === 'tarefas')  return b[1].tarefas - a[1].tarefas;
    return b[1].prop - a[1].prop;
  });

  const PC = {'Salvador':'#1D9E75','Feira de Santana':'#EF9F27','Natal':'#378ADD','CE':'#D4537E','SPI':'#7F77DD','Outros':'#888'};

  // Filtros de período + toggle métrica
  let html = `
    <div class="filter-tabs">
      <div class="filter-tab ${propPeriod==='d0'?'active':''}" onclick="setPropPeriod('d0')">D0 · Hoje</div>
      <div class="filter-tab ${propPeriod==='d1'?'active':''}" onclick="setPropPeriod('d1')">D-1 · Ontem</div>
      <div class="filter-tab ${propPeriod==='semana'?'active':''}" onclick="setPropPeriod('semana')">Semana</div>
      <div class="filter-tab ${propPeriod==='mes'?'active':''}" onclick="setPropPeriod('mes')">Mês</div>
    </div>`;

  html += `<div class="section-head">Ranking por Vendedor</div>
    <div style="display:flex;gap:8px;margin-bottom:10px;align-items:center">
      <div class="metric-toggle" style="flex:1">
        <div class="metric-toggle-btn ${propMetric==='aprovado'?'active':''}" onclick="setPropMetric('aprovado')">✅ MWh Aprov.</div>
        <div class="metric-toggle-btn ${propMetric==='propostas'?'active':''}" onclick="setPropMetric('propostas')">📋 Propostas</div>
        <div class="metric-toggle-btn ${propMetric==='tarefas'?'active':''}" onclick="setPropMetric('tarefas')">📞 Visitas Hoje</div>
      </div>
    </div>
    <div class="metric-toggle" style="margin-bottom:12px">
      <div class="metric-toggle-btn ${rankScope===''?'active':''}" onclick="setRankScope('')">🌐 Todas</div>
      <div class="metric-toggle-btn ${rankScope==='Salvador'?'active':''}" onclick="setRankScope('Salvador')">Salvador</div>
      <div class="metric-toggle-btn ${rankScope==='Feira de Santana'?'active':''}" onclick="setRankScope('Feira de Santana')">Feira</div>
      <div class="metric-toggle-btn ${rankScope==='Natal'?'active':''}" onclick="setRankScope('Natal')">Natal</div>
      <div class="metric-toggle-btn ${rankScope==='CE'?'active':''}" onclick="setRankScope('CE')">CE</div>
      <div class="metric-toggle-btn ${rankScope==='SPI'?'active':''}" onclick="setRankScope('SPI')">SPI</div>
    </div>`;

  // Filtra vendedores pela praça selecionada
  const filteredSellers = rankScope
    ? topSellers.filter(([name])=>{
        const sp = SELLER_PRACA[name]||'outras';
        const label = sp==='salvador'?'Salvador':sp==='feira'?'Feira de Santana':sp==='natal'?'Natal':sp==='ce'?'CE':sp==='spi'?'SPI':'Outros';
        return label === rankScope;
      })
    : topSellers;

  const medals = ['🥇','🥈','🥉'];

  function renderSellerCard(name, d, i){
    let mainVal, mainUnit, subInfo;
    if(propMetric === 'aprovado'){
      mainVal = d.aprov.toFixed(1); mainUnit = 'MWh aprov.';
      subInfo = `${d.prop} propostas · ${d.tarefas} visitas`;
    } else if(propMetric === 'tarefas'){
      mainVal = d.tarefas; mainUnit = 'visitas';
      subInfo = `${d.prop} propostas · ${d.aprov.toFixed(1)} MWh aprov.`;
    } else {
      mainVal = d.prop; mainUnit = 'props';
      subInfo = `${d.tarefas} visitas · ${d.aprov.toFixed(1)} MWh aprov.`;
    }
    const hasMwh = d.aprov > 0;
    const cardClass = hasMwh ? 'rank-card clickable' : 'rank-card';
    return `
      <div class="${cardClass}" ${hasMwh?`onclick="openRankSellerModal(this)"`:''} data-name="${name}" data-metric="${propMetric}" data-period="${propPeriod}">
        <div class="rank-num ${i<3?'top':''}">${i<3?medals[i]:i+1}</div>
        ${avatarImg(name, 'rank-avatar')}
        <div class="rank-info">
          <div class="rank-name">${name}</div>
          <div class="rank-praca" style="color:var(--muted)">${subInfo}</div>
        </div>
        <div class="rank-right">
          <div class="rank-mwh">${mainVal}</div>
          <div class="rank-unit">${mainUnit}</div>
        </div>
      </div>`;
  }

  if(filteredSellers.length === 0){
    html += `<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">Sem dados neste período</div></div>`;
  } else {
    filteredSellers.forEach(([name,d],i)=>{ html += renderSellerCard(name,d,i); });
  }

  el.innerHTML = html;
}

// Mapa fixo e-mail → nome canônico (com acentos). Só muda quando alguém entra/sai do time
// (aí também é preciso adicionar a foto). Tudo o mais (senha/praça/posição/meta) vem da planilha.
const EMAIL_NOME = Object.fromEntries(
  Object.entries(CREDENTIALS).map(([email, c]) => [email, c.nome])
);

// Normaliza o texto da coluna "Praça" da planilha → chave interna + rótulo exibido
function normPracaKey(txt){
  const s = (txt||'').toString().trim().toLowerCase();
  if(s.startsWith('salvador')) return 'salvador';
  if(s.startsWith('feira'))    return 'feira';
  if(s.startsWith('natal') || s === 'rn') return 'natal';
  if(s === 'spi' || s.includes('paulo') || s.includes('cpfl') || s.includes('interior')) return 'spi';
  if(s === 'ce' || s.includes('cear') || s.includes('fortaleza') || s.includes('enel')) return 'ce';
  return 'outras';
}
const PRACA_LABEL = { salvador:'Salvador', feira:'Feira de Santana', natal:'Natal', spi:'SPI', ce:'CE', outras:'Outros' };

// Aplica as linhas da aba Time (vindas do Apps Script) nas estruturas vivas do CRM.
// rows: [{ email, praca, posicao, meta, senha }]
function applyTeam(rows){
  if(!Array.isArray(rows) || !rows.length) return false;

  const novoVend = [];
  const ordem = ['Salvador','Feira de Santana','Natal','SPI','CE'];

  rows.forEach(r => {
    const email = (r.email||'').toString().trim().toLowerCase();
    if(!email) return;
    const nome = EMAIL_NOME[email];
    if(!nome) return; // e-mail desconhecido: ignora (precisa entrar no EMAIL_NOME + foto)

    const key   = normPracaKey(r.praca);
    const label = PRACA_LABEL[key] || 'Outros';
    const pos   = (r.posicao||'').toString().trim().toLowerCase();
    const senha = (r.senha!=null ? String(r.senha) : (CREDENTIALS[email]?.senha || '')).trim();
    const meta  = (r.meta!=null && r.meta!=='' && !isNaN(parseFloat(r.meta))) ? parseFloat(r.meta) : (METAS[nome]||0);

    // Credenciais (login)
    CREDENTIALS[email] = { nome, senha };

    // Gestor (admin): fica em "Outros", não entra na lista de vendedores normais
    if(pos.startsWith('gest') || nome === 'Felipe Oliveira'){
      delete LIDERES[nome];
      return;
    }

    // Praça / meta
    SELLER_PRACA[nome] = key;
    METAS[nome] = meta;

    // Posição: líder vê a praça toda; consultor vê só ele
    if(pos.startsWith('lid') || pos.startsWith('líd')) LIDERES[nome] = key;
    else delete LIDERES[nome];

    novoVend.push({ nome, praca: label });
  });

  if(!novoVend.length) return false;

  // Reconstrói a lista de vendedores (ordenada por praça) + admin no fim
  novoVend.sort((a,b) => ordem.indexOf(a.praca) - ordem.indexOf(b.praca));
  novoVend.push({ nome: 'Felipe Oliveira', praca: 'Outros' });
  VENDEDORES = novoVend;

  // Re-deriva a praça de cada deal (depende de SELLER_PRACA) e re-renderiza
  try { rawData.forEach(x => x.praca = getPraca(x.city, x.s)); } catch(e){}
  try {
    initSellerSelect(true);
    renderIdentityBadge();
    if(typeof currentScreen !== 'undefined'){
      if(currentScreen==='resumo')   renderResumo();
      if(currentScreen==='carteira') renderCarteira();
      if(currentScreen==='propostas')renderPropostas();
    }
  } catch(e){}
  return true;
}

function doLogin(email, senha, containerId){
  const cred = CREDENTIALS[(email||'').trim().toLowerCase()];
  // v2.124 — senha case-insensitive (evita falha por maiúscula/minúscula entre digitação e planilha)
  if(!cred || String(cred.senha||'').trim().toLowerCase() !== String(senha||'').trim().toLowerCase()){
    const errEl = document.getElementById(containerId+'-err');
    if(errEl){ errEl.textContent = 'E-mail ou senha incorretos.'; errEl.style.display='block'; }
    const pwEl = document.getElementById(containerId+'-pw');
    if(pwEl){ pwEl.style.borderColor='#FF4444'; pwEl.value=''; pwEl.focus(); }
    return;
  }
  setLastEmail((email||'').trim().toLowerCase());
  pickIdentity(cred.nome);
}

// Mostra/oculta a senha ao tocar no olho
function togglePw(containerId){
  const pw  = document.getElementById(containerId+'-pw');
  const eye = document.getElementById(containerId+'-eye');
  if(!pw || !eye) return;
  const mostrar = pw.type === 'password';
  pw.type = mostrar ? 'text' : 'password';
  eye.innerHTML = mostrar ? EYE_OPEN : EYE_CLOSED;
}

// Valida o par e-mail+senha em tempo real: borda verde + ✓ quando confere
function loginValid(containerId){
  const emEl  = document.getElementById(containerId+'-email');
  const pwEl  = document.getElementById(containerId+'-pw');
  const okEl  = document.getElementById(containerId+'-ok');
  if(!emEl || !pwEl || !okEl) return;
  const email = (emEl.value||'').trim().toLowerCase();
  const senha = (pwEl.value||'').trim().toLowerCase();
  const cred  = CREDENTIALS[email];
  const ok = !!cred && senha.length>0 && String(cred.senha||'').trim().toLowerCase() === senha;
  okEl.style.display = ok ? 'flex' : 'none';
  pwEl.style.borderColor = ok ? '#16a34a' : '#E0E3EF';
}

// ── chamada à API do Google Sheets ──
async function apiCall(action, payload, opts){
  if (!LEADS_API_ENABLED) {
    throw new Error('API offline');
  }
  const timeoutMs = (opts && opts.timeoutMs) || 30000; // v2.53 — 30s timeout
  const body = Object.assign({ action }, payload || {});
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const resp = await fetch(LEADS_API_URL, {
      method: 'POST',
      // Apps Script é estrito com Content-Type; text/plain evita preflight CORS
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
      signal: ctrl.signal
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error || 'erro desconhecido');
    return data;
  } catch (err) {
    if (err && err.name === 'AbortError') {
      throw new Error(`tempo esgotado (${timeoutMs/1000}s) — sincronização lenta, tente de novo`);
    }
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

// v2.24: normaliza data pra YYYY-MM-DD (input type=date só aceita esse formato).
// Cobre o caso do Apps Script devolver a data com hora (ISO) ou em dd/mm/aaaa.
function normalizeDateStr(v){
  if(v === null || v === undefined) return '';
  let s = String(v).trim();
  if(!s) return '';
  // Já começa com YYYY-MM-DD (inclui ISO "2026-06-10T03:00:00Z") → pega a parte da data
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  // dd/mm/aaaa ou dd-mm-aaaa
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  return '';
}

async function loadLeads(){
  if (leadsLoaded) return;
  if (!LEADS_API_ENABLED) {
    // Modo offline — usa seed
    window.leads = JSON.parse(JSON.stringify(LEADS_SEED));
    leadsLoaded = true;
    return;
  }
  try {
    const data = await apiCall('list');
    window.leads = (data.leads || [])
      // v2.29: descarta leads marcados como excluídos no Sheets (kept para histórico,
      // mas não devem entrar em window.leads — senão contam no header e somem das abas).
      .filter(l => l && l.stage !== 'excluido')
      .map(l => {
        // v2.24: garante proximaInteracao em YYYY-MM-DD (senão o campo de data não preenche)
        l.proximaInteracao = normalizeDateStr(l.proximaInteracao);
        return l;
      });
    leadsLoaded = true;
    leadsLoadError = '';
  } catch (err) {
    leadsLoadError = err.message;
    // Fallback: mantém leads em memória se houver, senão usa seed
    if (window.leads.length === 0) {
      window.leads = JSON.parse(JSON.stringify(LEADS_SEED));
    }
    leadsLoaded = true;  // marca como carregado pra não ficar em loop
  }
}

// v2.22: lê o desfecho direto do formulário (DOM) e sincroniza no _leadQualif.
// Evita estado velho do _leadQualif e garante que validação e save usem o que está na tela.
function syncDesfechoFromDOM(){
  window._leadQualif = window._leadQualif || {};
  const prox = (document.getElementById('lead-proxima-interacao')?.value || '').trim();
  const lostChk = !!(document.getElementById('lead-lost-chk') && document.getElementById('lead-lost-chk').checked);
  const lostReason = (document.getElementById('lead-lost-reason')?.value || '').trim();
  window._leadQualif.proximaInteracao = prox;
  window._leadQualif.lost = lostChk;
  window._leadQualif.lostReason = lostChk ? lostReason : '';
  return { temProxima: !!prox, temMotivoPerdido: lostChk && !!lostReason };
}

// v2.44: lê TODOS os campos de qualificação direto do DOM e atualiza _leadQualif.
// Garante que dados preenchidos no form não se percam por (a) handler que não disparou
// a tempo, (b) prefill em edição que só aplica classe CSS sem atualizar o objeto, ou
// (c) pills nunca tocados em uma edição (cujo valor original seria sobrescrito por '').
function syncQualifFromDOM(){
  window._leadQualif = window._leadQualif || {};
  const q = window._leadQualif;
  const isOn = id => !!document.getElementById(id)?.classList.contains('active');
  const val  = id => (document.getElementById(id)?.value || '').trim();

  // Desfecho (proximaInteracao, lost, lostReason)
  syncDesfechoFromDOM();

  // Observações livres (textarea)
  q.obs = (document.getElementById('lead-obs')?.value || '').slice(0, 500);

  // TD (Toda Distribuidora? — pills TDS/TDN)
  q.td = isOn('td-tds') ? 'TDS' : isOn('td-tdn') ? 'TDN' : '';

  // Temperatura (Frio/Morno/Quente)
  q.temperatura = isOn('temp-frio') ? 'Frio' : isOn('temp-morno') ? 'Morno' : isOn('temp-quente') ? 'Quente' : '';

  // Schedule (multi-select via .schedule-cell.active)
  q.schedule = Array.from(document.querySelectorAll('.schedule-cell.active'))
    .map(c => `${c.dataset.dia}-${c.dataset.periodo}`);

  // CNPJ (Sim/Não pills + input cnpj)
  q.temCnpj = isOn('cnpj-sim') ? 'Sim' : isOn('cnpj-nao') ? 'Não' : '';
  q.cnpj = q.temCnpj === 'Sim' ? val('lead-cnpj') : '';

  // Crédito (Sim/Não/Não abordei pills)
  q.interesseCredito = isOn('credito-sim') ? 'Sim'
                     : isOn('credito-nao') ? 'Não'
                     : isOn('credito-na')  ? 'Não abordei'
                     : '';

  // Produtos apresentados (multi-select via PRODUTOS_BTN_MAP)
  q.produtos = Object.entries(PRODUTOS_BTN_MAP)
    .filter(([_, btnId]) => isOn(btnId))
    .map(([prod, _]) => prod);

  // v2.55 — extras condicionais do motivo de perdido
  const _resto = document.getElementById('lead-lost-resto');
  const _conc  = document.getElementById('lead-lost-concorrencia');
  q.lostRestoFatura = _resto ? (parseInt(_resto.value || '0', 10) || 0) : (q.lostRestoFatura || 0);
  q.lostConcorrenciaNome = _conc ? (_conc.value || '').trim() : (q.lostConcorrenciaNome || '');

  return q;
}

  const cidade = (document.getElementById('lead-cidade')?.value || '').trim();
  const bairro = (document.getElementById('lead-bairro')?.value || '').trim();
  const prox   = (document.getElementById('lead-proxima-interacao')?.value || '').trim();
  const lostChk = !!(document.getElementById('lead-lost-chk') && document.getElementById('lead-lost-chk').checked);
  const lostReason = (document.getElementById('lead-lost-reason')?.value || '').trim();
  const temDesfecho = !!prox || (lostChk && !!lostReason);
  // v2.48 — TD virou obrigatório
  const temTD = !!(document.getElementById('td-tds')?.classList.contains('active')
                || document.getElementById('td-tdn')?.classList.contains('active'));

  // v2.55 — extras condicionais dos motivos de perdido
  const fatura = parseInt(document.getElementById('lead-fatura')?.value || '0', 10) || 0;
  const restoVal = parseInt(document.getElementById('lead-lost-resto')?.value || '0', 10) || 0;
  const concorrencia = (document.getElementById('lead-lost-concorrencia')?.value || '').trim();
  const exigeFatura  = lostChk && LOST_REQ_FATURA_AVISO.indexOf(lostReason) >= 0;
  const exigeResto   = lostChk && LOST_REQ_RESTO_FATURA.indexOf(lostReason) >= 0;
  const exigeConc    = lostChk && LOST_REQ_CONCORRENCIA.indexOf(lostReason) >= 0;
  const okFatura = !exigeFatura || fatura > 0;
  const okResto  = !exigeResto || restoVal > 0;
  const okConc   = !exigeConc || !!concorrencia;

  const canSave = !!nome && !!cidade && !!bairro && temDesfecho && temTD && okFatura && okResto && okConc;
  btn.disabled = !canSave;
  btn.style.opacity = canSave ? '' : '0.45';
  btn.style.cursor = canSave ? '' : 'not-allowed';
  // Dica do que falta (só no cadastro/edição, sem sobrescrever o fluxo de proposta)
  const hint = document.getElementById('form-actions-hint');
  if(hint){
    if(canSave){
      hint.textContent = 'Tudo certo — pode salvar o lead.';
      hint.style.color = '#157A55';
    } else {
      const faltam = [];
      if(!nome) faltam.push('Nome');
      if(!bairro) faltam.push('Bairro');
      if(!cidade) faltam.push('Cidade');
      if(!temTD) faltam.push('Tomador de Decisão (TDS ou TDN)');
      if(!temDesfecho) faltam.push('próxima interação OU perdido + motivo');
      if(!okFatura) faltam.push('Fatura média (obrigatória pra "Plan usina própria")');
      if(!okResto) faltam.push('Quanto cliente paga (R$) com a usina');
      if(!okConc) faltam.push('Nome da concorrência');
      hint.textContent = 'Falta: ' + faltam.join(' · ');
      hint.style.color = '#B91C1C';
    }
  }
}

        }
      } else if (leadBeingEdited.temCnpj === 'Não') {
        document.getElementById('cnpj-nao')?.classList.add('active');
      }

      // Crédito
      if (leadBeingEdited.interesseCredito === 'Sim') document.getElementById('credito-sim')?.classList.add('active');
      else if (leadBeingEdited.interesseCredito === 'Não') document.getElementById('credito-nao')?.classList.add('active');
      else if (leadBeingEdited.interesseCredito === 'Não abordei') document.getElementById('credito-na')?.classList.add('active');

      // v2.9: Produtos apresentados (multi)
      const prodList = Array.isArray(leadBeingEdited.produtos) ? leadBeingEdited.produtos : [];
      Object.keys(PRODUTOS_BTN_MAP).forEach(p => {
        const btn = document.getElementById(PRODUTOS_BTN_MAP[p]);
        if (btn && prodList.includes(p)) btn.classList.add('active');
      });

      // v2.10/v2.24: Próxima interação (normaliza pra YYYY-MM-DD antes de preencher)
      const _prox = normalizeDateStr(leadBeingEdited.proximaInteracao);
      if (_prox) {
        const dateInput = document.getElementById('lead-proxima-interacao');
        if (dateInput) {
          dateInput.value = _prox;
          onProximaInteracaoInput(dateInput);
        }
      }

      // v2.14: Obs
      if (leadBeingEdited.obs) {
        const obsInput = document.getElementById('lead-obs');
        if (obsInput) {
          obsInput.value = leadBeingEdited.obs;
          onObsInput(obsInput);
        }
      }

      // Lead perdido
      if (leadBeingEdited.lost) {
        const chk = document.getElementById('lead-lost-chk');
        if (chk) { chk.checked = true; toggleLost(); }
        // Pré-selecionar motivo
        setTimeout(() => {
          const sel = document.getElementById('lead-lost-reason');
          if (sel) {
            sel.value = leadBeingEdited.lostReason || '';
            // v2.55 — dispara setLostReason pra mostrar campos condicionais
            setLostReason(sel.value);
            // ...e preenche extras salvos
            const restoEl = document.getElementById('lead-lost-resto');
            const concEl  = document.getElementById('lead-lost-concorrencia');
            if (restoEl && leadBeingEdited.lostRestoFatura) restoEl.value = leadBeingEdited.lostRestoFatura;
            if (concEl  && leadBeingEdited.lostConcorrenciaNome) concEl.value = leadBeingEdited.lostConcorrenciaNome;
            window._leadQualif = window._leadQualif || {};
            window._leadQualif.lostRestoFatura = leadBeingEdited.lostRestoFatura || 0;
            window._leadQualif.lostConcorrenciaNome = leadBeingEdited.lostConcorrenciaNome || '';
          }
          updateSaveButtonState();  // v2.23: reflete motivo restaurado na edição
        }, 30);
      }
    }

    const watch = ['lead-nome','lead-tel','lead-fatura','lead-dist','lead-cidade','lead-bairro'];
    watch.forEach(id => {
      const el = document.getElementById(id);
      if(el) el.addEventListener('input', updateProposalButton);
      if(el) el.addEventListener('change', updateProposalButton);
    });
    updateProposalButton();
    updateSaveButtonState();  // v2.23: estado inicial do botão Salvar
  }, 0);
}

function formatCnpj(v){
  // Formata 00.000.000/0000-00 enquanto digita
  const d = (v || '').replace(/\D/g, '').slice(0, 14);
  if(d.length <= 2) return d;
  if(d.length <= 5) return `${d.slice(0,2)}.${d.slice(2)}`;
  if(d.length <= 8) return `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5)}`;
  if(d.length <= 12) return `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8)}`;
  return `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8,12)}-${d.slice(12)}`;
}

function onProximaInteracaoInput(el){
  const value = el.value; // formato YYYY-MM-DD
  window._leadQualif = window._leadQualif || {};
  window._leadQualif.proximaInteracao = value || '';
  updateSaveButtonState();

  // Hint amigável: "Daqui 3 dias" / "Amanhã" / "Hoje"
  const hint = document.getElementById('proxima-interacao-hint');
  if (!hint) return;
  if (!value) {
    hint.style.display = 'none';
    hint.textContent = '';
    return;
  }
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(value + 'T00:00:00');
  const diffDays = Math.round((target - today) / 86400000);
  let label = '';
  if (diffDays === 0) label = '📅 Hoje';
  else if (diffDays === 1) label = '📅 Amanhã';
  else if (diffDays > 1) label = `📅 Daqui ${diffDays} dias`;
  else label = `⚠️ ${Math.abs(diffDays)} dia(s) atrás`;
  hint.textContent = label;
  hint.style.display = 'block';
  hint.style.color = diffDays < 0 ? '#DC2626' : 'var(--blue)';

  updateStagePreview();
}

function toggleProduto(produto){
  window._leadQualif = window._leadQualif || {};
  window._leadQualif.produtos = window._leadQualif.produtos || [];
  let list = window._leadQualif.produtos;

  const idx = list.indexOf(produto);
  if (idx >= 0) {
    // já estava marcado → desmarca
    list.splice(idx, 1);
  } else {
    // marcando agora
    if (produto === 'Nenhum') {
      // "Nenhum" é exclusivo: limpa tudo e marca só ele
      list = ['Nenhum'];
    } else {
      // qualquer produto real: remove "Nenhum" se estiver marcado e adiciona o novo
      list = list.filter(p => p !== 'Nenhum');
      list.push(produto);
    }
  }
  window._leadQualif.produtos = list;

  // Atualiza UI
  Object.keys(PRODUTOS_BTN_MAP).forEach(p => {
    const btn = document.getElementById(PRODUTOS_BTN_MAP[p]);

// ── v2.5: Calcula fase do funil automaticamente baseado nos campos preenchidos ──
function computeStageFromForm(){
  // Lê todos os campos do form + state de qualificação
  const nome   = (document.getElementById('lead-nome')?.value || '').trim();
  const tel    = (document.getElementById('lead-tel')?.value || '').trim();
  const fat    = parseInt(document.getElementById('lead-fatura')?.value || '0', 10);
  const dist   = document.getElementById('lead-dist')?.value || '';
  const rua    = (document.getElementById('lead-rua')?.value || '').trim();
  const numero = (document.getElementById('lead-numero')?.value || '').trim();
  const bairro = (document.getElementById('lead-bairro')?.value || '').trim();
  const cep    = (document.getElementById('lead-cep')?.value || '').trim();
  const cidade = (document.getElementById('lead-cidade')?.value || '').trim();
  const estado = (document.getElementById('lead-estado')?.value || '').trim();
  const q      = window._leadQualif || {};

  // 1) Lead perdido sobrescreve tudo
  if (q.lost) return 'perdido';

  // 2) Fatura preenchida (> 0) → Propostas
  if (fat > 0) return 'propostas';

  // 3) Qualquer campo opcional preenchido → Qualificados
  //    (Tel, Dist, Rua, Número, CEP, UF, TDS/TDN, horários, temperatura, CNPJ, crédito, produtos, próx. interação)
  const hasQualif = !!tel || !!dist || !!rua || !!numero || !!cep || !!estado
                  || !!q.td || (q.schedule && q.schedule.length > 0) || !!q.temperatura
                  || !!q.temCnpj || !!q.interesseCredito
                  || (q.produtos && q.produtos.length > 0)
                  || !!q.proximaInteracao;
  if (hasQualif) return 'qualificados';

  // 4) Default — só obrigatórios preenchidos → Planejados
  return 'planejados';
}

async function submitLead(){
  // ⭐ Guarda contra duplo-clique: se já está salvando, ignora
  if (window._submittingLead) return;
  window._submittingLead = true;

  // Pega o botão e troca pro estado "Cadastrando..."
  const btnCadastrar = document.querySelector('.form-btn-sec[onclick*="submitLead"]');
  const btnProposta = document.getElementById('btn-proposta');
  const originalBtnText = btnCadastrar ? btnCadastrar.innerHTML : '';
  if (btnCadastrar) {
    btnCadastrar.disabled = true;
    btnCadastrar.style.opacity = '.6';
    btnCadastrar.style.cursor = 'wait';
    btnCadastrar.innerHTML = '⏳ Cadastrando...';
  }
  if (btnProposta) btnProposta.disabled = true;

  // v2.53 — helper idempotente pra restaurar o botão (chamado no finally)
  const restoreBtn = () => {
    window._submittingLead = false;
    if (btnCadastrar) {
      btnCadastrar.disabled = false;
      btnCadastrar.style.opacity = '';
      btnCadastrar.style.cursor = '';
      btnCadastrar.innerHTML = originalBtnText;
    }
    if (btnProposta) btnProposta.disabled = false;
  };

  try {

  const nome = (document.getElementById('lead-nome').value || '').trim();
  const tel  = (document.getElementById('lead-tel').value || '').trim();
  const email = (document.getElementById('lead-email')?.value || '').trim();
  const fat  = parseInt(document.getElementById('lead-fatura').value || '0', 10);
  const dist = document.getElementById('lead-dist').value;

  const rua    = (document.getElementById('lead-rua').value || '').trim();
  const numero = (document.getElementById('lead-numero').value || '').trim();
  const complemento = (document.getElementById('lead-complemento').value || '').trim();
  const bairro = (document.getElementById('lead-bairro').value || '').trim();
  const cep    = (document.getElementById('lead-cep').value || '').trim();
  const cidade = (document.getElementById('lead-cidade').value || '').trim();
  const estado = (document.getElementById('lead-estado').value || '').trim().toUpperCase();
  const pais   = (document.getElementById('lead-pais').value || '').trim() || 'Brasil';

  const partes = [];
  if(rua) partes.push(rua + (numero ? ', ' + numero : ''));
  if(bairro) partes.push(bairro);
  if(cidade) partes.push(cidade + (estado ? '/' + estado : ''));
  const loc = partes.join(' · ') || (cidade + (estado ? '/' + estado : ''));

  // ⭐ Obrigatórios: Nome + Cidade + Bairro
  const missing = [];
  if(!nome) missing.push('Nome');
  if(!cidade) missing.push('Cidade');
  if(!bairro) missing.push('Bairro');

  // ⭐ v2.19/v2.22: além dos obrigatórios, o vendedor precisa sair com UM desfecho:
  //   (a) data da próxima interação OU (b) lead perdido com motivo cadastrado.
  // v2.44: sincroniza TODOS os campos de qualificação direto do DOM antes de validar/salvar.
  syncQualifFromDOM();
  const d = syncDesfechoFromDOM();

  // v2.48 — TD virou obrigatório (TDS ou TDN)
  if(!(window._leadQualif && window._leadQualif.td)) missing.push('Tomador de Decisão (TDS ou TDN)');

  let erro = '';
  if(missing.length){
    erro = 'Preencha: ' + missing.join(', ');
  } else if(!d.temProxima && !d.temMotivoPerdido){
    erro = 'Falta o desfecho: informe a DATA DA PRÓXIMA INTERAÇÃO ou marque o lead como PERDIDO com o motivo.';
  }

  if(erro){
    alert(erro);
    return;
  }

  // Qualificação (v2.4) + Fase calculada (v2.5)
  const q = window._leadQualif || {};
  const stage = computeStageFromForm();

  const id = 'L' + String(Date.now()).slice(-6);
  const lead = {
    id, nome, tel, email, fatura: fat, dist,
    loc,
    endereco: { rua, numero, complemento, bairro, cep, cidade, estado, pais },
    coords: window._lastGeoCoords || null,
    stage,
    createdAt: Date.now(),
    vendedor: getCurrentVendedor(),
    // v2.4: campos de qualificação
    td: q.td || '',
    schedule: q.schedule || [],
    temperatura: q.temperatura || '',
    lost: !!q.lost,
    lostReason: q.lostReason || '',
    // v2.6: perfil do cliente
    temCnpj: q.temCnpj || '',
    cnpj: q.cnpj || '',
    interesseCredito: q.interesseCredito || '',
    // v2.9: produtos apresentados (array)
    produtos: q.produtos || [],
    // v2.10: data da próxima interação (YYYY-MM-DD)
    proximaInteracao: q.proximaInteracao || '',
    // v2.14: observações livres do vendedor
    obs: q.obs || '',
    // v2.55: extras condicionais por motivo de perdido
    lostRestoFatura: q.lostRestoFatura || 0,
    lostConcorrenciaNome: q.lostConcorrenciaNome || '',
  };

  window.leads.push(lead);
  lastCreatedId = id;
  kanbanActiveStage = stage;
  window._lastGeoCoords = null;

  const res = await saveLead(lead);
  const stageInfo = FUNIL_STAGES.find(s => s.key === stage);
  const stageLabel = stageInfo ? stageInfo.label : stage;
  if (res.offline) {
    cadastroToast = `Lead "${nome}" salvo localmente em ${stageLabel} (modo offline)`;
  } else if (!res.ok) {
    cadastroToast = `⚠️ Lead "${nome}" salvo local — erro ao sincronizar: ${res.error}`;
  } else {

// ⭐ v2.8 — Atualizar lead existente
async function updateLead(){
  if (window._submittingLead) return;
  window._submittingLead = true;

  // v2.53 — helper idempotente pra restaurar o botão (chamado no finally)
  let _btn = null, _origText = '';
  const restoreUpd = () => {
    window._submittingLead = false;
    if (_btn) { _btn.disabled = false; _btn.innerHTML = _origText; }
  };

  try {
  const leadId = editingLeadId;
  if (!leadId) return;

  const lead = window.leads.find(l => l.id === leadId);
  if (!lead) {
    alert('Lead não encontrado');
    return;
  }

  // Permissão: só dono pode editar
  const me = getCurrentVendedor();
  if (lead.vendedor && canonicalVendedor(lead.vendedor) !== canonicalVendedor(me)) {
    alert(`Você não pode editar leads de outros vendedores. Este lead é de ${lead.vendedor}.`);
    return;
  }

  // Botão loading
  _btn = document.querySelector('button[onclick="updateLead()"]');
  _origText = _btn ? _btn.innerHTML : '';
  if (_btn) {
    _btn.disabled = true;
    _btn.innerHTML = '⏳ Atualizando...';
  }

  // Coleta valores atuais do form
  const nome = (document.getElementById('lead-nome').value || '').trim();
  const tel  = (document.getElementById('lead-tel').value || '').trim();
  const email = (document.getElementById('lead-email')?.value || '').trim();
  const fat  = parseInt(document.getElementById('lead-fatura').value || '0', 10);
  const dist = document.getElementById('lead-dist').value;

  const rua    = (document.getElementById('lead-rua').value || '').trim();
  const numero = (document.getElementById('lead-numero').value || '').trim();
  const complemento = (document.getElementById('lead-complemento').value || '').trim();
  const bairro = (document.getElementById('lead-bairro').value || '').trim();
  const cep    = (document.getElementById('lead-cep').value || '').trim();
  const cidade = (document.getElementById('lead-cidade').value || '').trim();
  const estado = (document.getElementById('lead-estado').value || '').trim().toUpperCase();
  const pais   = (document.getElementById('lead-pais').value || '').trim() || 'Brasil';

  // Valida obrigatórios + desfecho (v2.22: mesma regra do cadastro)
  const missing = [];
  if(!nome) missing.push('Nome');
  if(!cidade) missing.push('Cidade');
  if(!bairro) missing.push('Bairro');
  // v2.44: sincroniza TODOS os campos de qualificação direto do DOM antes de validar/salvar.
  syncQualifFromDOM();
  const d = syncDesfechoFromDOM();
  const qq = window._leadQualif || {};
  // v2.48 — TD virou obrigatório (TDS ou TDN)
  if(!qq.td) missing.push('Tomador de Decisão (TDS ou TDN)');
  let erro = '';
  if(missing.length){
    erro = 'Preencha: ' + missing.join(', ');
  } else if(!d.temProxima && !d.temMotivoPerdido){
    erro = 'Falta o desfecho: informe a DATA DA PRÓXIMA INTERAÇÃO ou marque o lead como PERDIDO com o motivo.';
  }
  if(erro){
    alert(erro);
    window._submittingLead = false;
    if (btn) { btn.disabled = false; btn.innerHTML = originalText; }
    return;
  }

  // Atualiza o lead no array local
  const q = window._leadQualif || {};
  const partes = [];
  if(rua) partes.push(rua + (numero ? ', ' + numero : ''));
  if(bairro) partes.push(bairro);
  if(cidade) partes.push(cidade + (estado ? '/' + estado : ''));
  const loc = partes.join(' · ') || (cidade + (estado ? '/' + estado : ''));

  // Calcula nova fase (mas só se a fase atual for uma das 4 automáticas)
  const autoStages = ['planejados','qualificados','propostas','perdido'];
  const newStage = autoStages.includes(lead.stage) ? computeStageFromForm() : lead.stage;

  Object.assign(lead, {
    nome, tel, email, fatura: fat, dist, loc,
    endereco: { rua, numero, complemento, bairro, cep, cidade, estado, pais },
    stage: newStage,
    td: q.td || '',
    schedule: q.schedule || [],
    temperatura: q.temperatura || '',
    lost: !!q.lost,
    lostReason: q.lostReason || '',
    temCnpj: q.temCnpj || '',
    cnpj: q.cnpj || '',
    interesseCredito: q.interesseCredito || '',
    produtos: q.produtos || [],
    proximaInteracao: q.proximaInteracao || '',
    obs: q.obs || '',
    // v2.55: extras condicionais por motivo de perdido
    lostRestoFatura: q.lostRestoFatura || 0,
    lostConcorrenciaNome: q.lostConcorrenciaNome || ''
  });

  // Sincroniza no Sheets (action 'create' que faz upsert)
  const res = await saveLead(lead);
  if (res.offline) {
    cadastroToast = `Lead "${nome}" atualizado localmente (modo offline)`;
  } else if (!res.ok) {
    cadastroToast = `⚠️ Atualização local — erro ao sincronizar: ${res.error}`;
  } else {
    cadastroToast = `✓ Lead "${nome}" atualizado com sucesso`;
  }

  editingLeadId = null;
  kanbanActiveStage = newStage;
  setFunilView('kanban');
  } catch (err) {
    // v2.53 — qualquer exceção inesperada (timeout do fetch, etc.) cai aqui.
    console.error('updateLead error:', err);
    alert('Erro inesperado ao atualizar: ' + (err && err.message ? err.message : 'desconhecido') + '. As mudanças podem estar locais — verifique no Kanban antes de tentar de novo.');
  } finally {
    restoreUpd();
  }
}

// ⭐ v2.8 — Excluir lead
async function deleteLead(leadId){
  const lead = window.leads.find(l => l.id === leadId);
  if (!lead) return;

  const me = getCurrentVendedor();
  if (lead.vendedor && canonicalVendedor(lead.vendedor) !== canonicalVendedor(me)) {
    alert(`Você não pode excluir leads de outros vendedores. Este lead é de ${lead.vendedor}.`);
    return;
  }

  const ok = confirm(`Tem certeza que quer EXCLUIR o lead "${lead.nome}"?\n\nEsta ação não pode ser desfeita.`);
  if (!ok) return;

  // Remove do array local
  const idx = window.leads.findIndex(l => l.id === leadId);
  if (idx >= 0) window.leads.splice(idx, 1);

  // Marca no Sheets como "excluído" mudando stage pra 'excluido'
  // (não removemos a linha pra manter histórico — só sinaliza)
  const res = await updateLeadStage(leadId, 'excluido');
  if (res.ok) {
    cadastroToast = `🗑️ Lead "${lead.nome}" excluído`;
  } else {
    cadastroToast = `⚠️ Lead removido localmente — falha ao sincronizar`;
  }

  editingLeadId = null;
  setFunilView('kanban');
}

  const nome   = (document.getElementById('lead-nome').value || '').trim();

  const pais   = (document.getElementById('lead-pais').value || '').trim() || 'Brasil';

  // ⭐ Validação clara: pra Gerar Proposta precisa de Nome + Tel + Fatura + Distribuidora + Cidade + Bairro
  const missing = [];
  if(!nome)   missing.push('Nome');
  if(!tel)    missing.push('Telefone');
  if(!fat || fat <= 0) missing.push('Fatura');
  if(!dist)   missing.push('Distribuidora');

  if(!bairro) missing.push('Bairro');
  if(missing.length){
    alert('Pra gerar a proposta, preencha: ' + missing.join(', '));
    restoreBtn();
    return;
  }

  // Cálculo da economia (continua salvo no lead, mesmo sem modal)
  const PCT_DESC = 0.15;
  const economiaMensal  = Math.round(fat * PCT_DESC);
  const novaFatura      = fat - economiaMensal;
  const economiaAnual   = economiaMensal * 12;
  const economia5anos   = economiaAnual * 5;

  const partes = [];
  if(rua) partes.push(rua + (numero ? ', ' + numero : ''));
  if(bairro) partes.push(bairro);
  if(cidade) partes.push(cidade + (estado ? '/' + estado : ''));
  const loc = partes.join(' · ') || (cidade + (estado ? '/' + estado : ''));

  const id = 'L' + String(Date.now()).slice(-6);
  const q = window._leadQualif || {};
  const lead = {
    id, nome, tel, fatura: fat, dist, loc,
    endereco: { rua, numero, complemento, bairro, cep, cidade, estado, pais },
    coords: window._lastGeoCoords || null,
    stage: 'propostas',
    createdAt: Date.now(),
    vendedor: getCurrentVendedor(),
    td: q.td || '',
    schedule: q.schedule || [],
    temperatura: q.temperatura || '',
    lost: false,
    lostReason: '',
    temCnpj: q.temCnpj || '',
    cnpj: q.cnpj || '',
    interesseCredito: q.interesseCredito || '',
    produtos: q.produtos || [],
    proximaInteracao: q.proximaInteracao || '',
    obs: q.obs || '',
    proposta: {
      pct: PCT_DESC,
      economiaMensal, novaFatura, economiaAnual, economia5anos,
      geradaEm: Date.now()
    }
  };

  // Salva otimista (UI imediata + Sheets em background)
  window.leads.push(lead);
  lastCreatedId = id;
  window._lastGeoCoords = null;
  saveLead(lead).then(res => {
    if (!res.ok && !res.offline) console.warn('Falha ao sincronizar lead com proposta:', res.error);
  });

  // ⭐ v2.7 — Monta a mensagem padrão do bot (5 itens diretos)
  const msg = buildWhatsappMessage(lead);

  cadastroToast = `✓ ${nome} salvo em Propostas — copie a mensagem e envie no WhatsApp`;

  // Libera flag
  window._generatingProposta = false;

  // ⭐ Abre modal de cópia em vez de WhatsApp direto
  showCopyPropostaModal(msg, nome);
}

// ⭐ v2.7 — Constrói a mensagem padrão do bot (5 itens numerados)
function buildWhatsappMessage(lead){
  const primeiroNome = (lead.nome || '').split(/\s+/)[0] || lead.nome || '';
  const tel = lead.tel || '';
  const fat = String(lead.fatura || '');
  // Item 4: Energia como crédito → "sim" SÓ se o cliente disse Sim; senão "não"
  const credito = (lead.interesseCredito === 'Sim') ? 'sim' : 'não';
  const dist = lead.dist || '';

  return [
    `1) ${primeiroNome}`,
    `2) ${tel}`,
    `3) ${fat}`,
    `4) ${credito}`,
    `5) ${dist}`,
  ].join('\n');
}

async function copyPropostaMessage(){

  const text = msgEl.innerText;
  const btn = document.getElementById('btn-copy-msg');
  const originalHtml = btn.innerHTML;

  try {
    // API moderna (HTTPS no Netlify funciona)
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
    } else {
      // Fallback: cria textarea temporário e usa execCommand
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.top = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    // Feedback visual: botão fica verde
    btn.innerHTML = '✅ Copiado! Cole no WhatsApp';
    btn.style.background = '#1D9E75';
    setTimeout(() => {
      btn.innerHTML = originalHtml;
      btn.style.background = '';
    }, 2200);
  } catch (err) {
    console.error('Falha ao copiar:', err);
    btn.innerHTML = '⚠️ Erro ao copiar — selecione manualmente';
    setTimeout(() => { btn.innerHTML = originalHtml; }, 2500);
  }
}

// ── GPS + Reverse Geocoding (Nominatim/OpenStreetMap, gratuito) ──
function usarMinhaLocalizacao(){
  const btn = document.getElementById('geo-btn');
  const status = document.getElementById('geo-status');

  if(!navigator.geolocation){
    status.className = 'geo-status err';
    status.textContent = '⚠️ Seu navegador não suporta GPS. Preencha o endereço manualmente abaixo.';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = `
    <svg viewBox="0 0 24 24" style="animation:spin 1s linear infinite"><circle cx="12" cy="12" r="10" stroke-opacity=".25"/><path d="M22 12a10 10 0 0 1-10 10"/></svg>
    Obtendo sua localização...
  `;
  status.className = 'geo-status info';
  status.textContent = 'Permita o acesso à localização no aviso do navegador...';

  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      window._lastGeoCoords = { lat, lon, accuracy: pos.coords.accuracy };

      status.className = 'geo-status info';
      status.textContent = `Localização obtida (precisão ~${Math.round(pos.coords.accuracy)}m). Buscando endereço...`;

      try {
        // Nominatim: reverse geocoding gratuito
        const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&addressdetails=1&accept-language=pt-BR`;
        const resp = await fetch(url, { headers: { 'Accept': 'application/json' } });
        if(!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        const a = data.address || {};

        const rua    = a.road || a.pedestrian || a.path || '';
        const numero = a.house_number || '';
        const cep    = a.postcode || '';
        // Bairro: Nominatim BR usa suburb / neighbourhood / quarter
        const bairro = a.suburb || a.neighbourhood || a.quarter || a.city_district || '';
        // Cidade: tira o suburb daqui (era bug: estava virando bairro)
        const cidade = a.city || a.town || a.village || a.municipality || '';
        const estado = (a.state_code || a['ISO3166-2-lvl4'] || a.state || '').replace('BR-','').slice(0,2).toUpperCase();
        const pais   = a.country || 'Brasil';

        // Preenche os campos
        if(rua) document.getElementById('lead-rua').value = rua;
        if(numero) document.getElementById('lead-numero').value = numero;
        if(bairro) document.getElementById('lead-bairro').value = bairro;
        if(cep) document.getElementById('lead-cep').value = cep;
        if(cidade) document.getElementById('lead-cidade').value = cidade;
        if(estado) document.getElementById('lead-estado').value = estado;
        if(pais) document.getElementById('lead-pais').value = pais;

        status.className = 'geo-status ok';
        const filled = [rua, numero, bairro, cep, cidade, estado].filter(Boolean).length;
        status.innerHTML = `✓ Endereço preenchido automaticamente (${filled}/6 campos). <b>Confira e edite se necessário.</b>`;
        updateSaveButtonState();  // v2.23: bairro/cidade vieram do GPS, atualiza o botão
      } catch (err) {
        status.className = 'geo-status err';
        status.innerHTML = '⚠️ GPS funcionou mas o serviço de endereço falhou. <b>Coordenadas salvas</b> — preencha o endereço manualmente.';
      } finally {
        btn.disabled = false;
        btn.innerHTML = `
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg>
          Tentar novamente
        `;
      }
    },
    (err) => {
      btn.disabled = false;
      btn.innerHTML = `
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg>
        Usar minha localização
      `;
      status.className = 'geo-status err';
      let msg = '';
      if(err.code === 1) msg = 'Permissão negada. Habilite o GPS nas configurações do navegador <b>ou preencha o endereço manualmente abaixo.</b>';
      else if(err.code === 2) msg = 'Localização indisponível (sem sinal de GPS). <b>Preencha manualmente.</b>';
      else if(err.code === 3) msg = 'Tempo esgotado. Tente novamente em local com melhor sinal <b>ou preencha manualmente.</b>';
      else msg = 'Erro ao obter localização. <b>Preencha manualmente.</b>';
      status.innerHTML = '⚠️ ' + msg;
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
  );
}

function renderFunilKanban(el){
  const me = getCurrentVendedor();

  // v2.27/v2.46: match canônico — normalize + aliases (renames). Antonio Carlos == Antonio Mariano.
  const meN = canonicalVendedor(me);

  // Aplica scope: meus leads ou (se líder) toda a praça ou (se gestor) time inteiro
  const allLeads = window.leads;
  const GESTOR = 'Felipe Oliveira';
  const praçaLider = liderPraca(me);
  const isLiderOuGestor = me === GESTOR || !!praçaLider;

  // Se líder/gestor escolheu um liderado específico, filtra só por ele
  const viewAs = (isLiderOuGestor && funilViewAs) ? funilViewAs : null;

  const myLeads = me ? allLeads.filter(l => {
    if(viewAs) return canonicalVendedor(l.vendedor) === canonicalVendedor(viewAs);
    if(me === GESTOR) return true;  // gestor vê tudo
    if(praçaLider){
      // líder: vê os próprios + todos os da praça
      const lPraca = (SELLER_PRACA[canonicalVendedor(l.vendedor)] || '').toLowerCase();
      return lPraca === praçaLider || canonicalVendedor(l.vendedor) === meN;
    }
    return canonicalVendedor(l.vendedor) === meN;
  }) : [];

  // ⭐ v2.11 — Calcula contagens dos filtros de visita (sempre baseado nos MEUS leads, etapas ativas)
  // Etapas ativas: planejados, qualificados, propostas, fechamentos (sem perdido e contratos)
  const ACTIVE_STAGES = ['planejados','qualificados','propostas','fechamentos'];
  const activeLeads = me ? myLeads.filter(l => ACTIVE_STAGES.includes(l.stage)) : [];

  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = today.toISOString().slice(0,10);
  const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);
  const tomorrowStr = tomorrow.toISOString().slice(0,10);

  // v2.30 — limites da semana corrente (Seg–Dom, padrão BR) e do mês corrente
  const dayOfWeek = today.getDay();                            // 0=Dom, 1=Seg, ..., 6=Sáb
  const daysSinceMonday = dayOfWeek === 0 ? 6 : dayOfWeek - 1; // dias desde a segunda
  const weekStart = new Date(today); weekStart.setDate(today.getDate() - daysSinceMonday);
  const weekStartStr = weekStart.toISOString().slice(0,10);
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate() + 6);
  const weekEndStr = weekEnd.toISOString().slice(0,10);
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  const monthStartStr = monthStart.toISOString().slice(0,10);
  const monthEnd = new Date(today.getFullYear(), today.getMonth() + 1, 0);
  const monthEndStr = monthEnd.toISOString().slice(0,10);

  const visitCounts = {
    today:    activeLeads.filter(l => l.proximaInteracao === todayStr).length,
    tomorrow: activeLeads.filter(l => l.proximaInteracao === tomorrowStr).length,
    week:     activeLeads.filter(l => l.proximaInteracao >= weekStartStr && l.proximaInteracao <= weekEndStr).length,
    month:    activeLeads.filter(l => l.proximaInteracao >= monthStartStr && l.proximaInteracao <= monthEndStr).length,
    overdue:  activeLeads.filter(l => l.proximaInteracao && l.proximaInteracao < todayStr).length,
    // v2.59 — leads gerados hoje (todos os stages, inclusive perdido/contratos)
    createdToday: myLeads.filter(l => l.createdAt && new Date(l.createdAt).toISOString().slice(0,10) === todayStr).length
  };

  // Aplica o filtro escolhido
  let filteredLeads;
  let filterBanner = '';
  if (visitFilter) {
    // Filtro de visita ativo: força "meus" + etapas ativas
    if (visitFilter === 'today') {
      filteredLeads = activeLeads.filter(l => l.proximaInteracao === todayStr);
      filterBanner = `<div class="visit-filter-banner">📅 Mostrando seus leads com interação <b>hoje</b> (${filteredLeads.length})</div>`;
    } else if (visitFilter === 'tomorrow') {
      filteredLeads = activeLeads.filter(l => l.proximaInteracao === tomorrowStr);
      filterBanner = `<div class="visit-filter-banner">⏰ Mostrando seus leads com interação <b>amanhã</b> (${filteredLeads.length})</div>`;
    } else if (visitFilter === 'week') {
      filteredLeads = activeLeads.filter(l => l.proximaInteracao >= weekStartStr && l.proximaInteracao <= weekEndStr);
      filterBanner = `<div class="visit-filter-banner">📆 Mostrando seus leads com interação <b>nesta semana</b> (${filteredLeads.length})</div>`;
    } else if (visitFilter === 'month') {
      filteredLeads = activeLeads.filter(l => l.proximaInteracao >= monthStartStr && l.proximaInteracao <= monthEndStr);
      filterBanner = `<div class="visit-filter-banner">🗓️ Mostrando seus leads com interação <b>neste mês</b> (${filteredLeads.length})</div>`;
    } else if (visitFilter === 'overdue') {
      filteredLeads = activeLeads.filter(l => l.proximaInteracao && l.proximaInteracao < todayStr);
      filterBanner = `<div class="visit-filter-banner overdue">⚠️ Mostrando seus leads <b>atrasados</b> (${filteredLeads.length}) — precisa retomar contato</div>`;
    } else if (visitFilter === 'created_today') {
      // v2.59 — cadastrados hoje, todos os stages (não filtra por ACTIVE_STAGES)
      filteredLeads = myLeads.filter(l => l.createdAt && new Date(l.createdAt).toISOString().slice(0,10) === todayStr);
      filterBanner = `<div class="visit-filter-banner created-today">✨ Mostrando seus leads <b>gerados hoje</b> (${filteredLeads.length})</div>`;
    }
  } else {
    // Sem filtro: aplica scope normal (meus / todos)
    filteredLeads = (kanbanScope === 'mine' && me) ? myLeads : allLeads;
  }

  // v2.33 — busca textual aplicada DEPOIS do filtro de scope/visit, em cima do recorte
  const qNorm = (searchQuery||'').replace(/\s+/g,' ').trim().toLowerCase();
  if (qNorm) {
    filteredLeads = filteredLeads.filter(l => {
      const e = l.endereco || {};
      const hay = [l.nome, l.tel, e.cidade, e.bairro, e.rua, e.numero].filter(Boolean).join(' ').toLowerCase();
      return hay.includes(qNorm);
    });
  }

  const counts = {};
  FUNIL_STAGES.forEach(s => counts[s.key] = filteredLeads.filter(l => l.stage === s.key).length);

  // Se não há identidade, força "all" e esconde toggle
  const showScope = !!me;
  const showVisitFilters = !!me;  // Só faz sentido se identificado

  // ⭐ Toast de sucesso (vem do cadastro) — aparece no topo do Kanban
  const toastHtml = cadastroToast
    ? `<div class="form-toast" id="kanban-toast">
         <span class="form-toast-icon">${cadastroToast.startsWith('⚠️') ? '⚠️' : '✓'}</span>
         <div class="form-toast-body">${cadastroToast.replace(/^[⚠✓]\s*️?\s*/, '')}</div>
       </div>`
    : '';
  cadastroToast = '';

  el.innerHTML = `
    <div class="funil-back" onclick="setFunilView('hub')">← Voltar</div>

    ${toastHtml}

    ${showVisitFilters ? `
      <div class="visit-filters">
        <button class="visit-filter-btn ${visitFilter==='today'?'active':''}" onclick="openVisitFilterModal('today')">
          📅 Hoje <span class="vf-count">${visitCounts.today}</span>
        </button>
        <button class="visit-filter-btn ${visitFilter==='tomorrow'?'active':''}" onclick="openVisitFilterModal('tomorrow')">
          ⏰ Amanhã <span class="vf-count">${visitCounts.tomorrow}</span>
        </button>
        <button class="visit-filter-btn ${visitFilter==='week'?'active':''}" onclick="openVisitFilterModal('week')">
          📆 S0 <span class="vf-count">${visitCounts.week}</span>
        </button>
        <button class="visit-filter-btn ${visitFilter==='month'?'active':''}" onclick="openVisitFilterModal('month')">
          🗓️ Mês <span class="vf-count">${visitCounts.month}</span>
        </button>
      </div>
      <div class="visit-filters-overdue">
        <button class="visit-filter-btn overdue ${visitFilter==='overdue'?'active':''}" onclick="openVisitFilterModal('overdue')">
          ⚠️ Atrasados <span class="vf-count">${visitCounts.overdue}</span>
        </button>
        ${visitFilter ? `<button class="visit-filter-clear" onclick="setVisitFilter(null)">✕ Limpar</button>` : ''}
      </div>
      <div class="visit-filters-overdue">
        <button class="visit-filter-btn created-today ${visitFilter==='created_today'?'active':''}" onclick="openVisitFilterModal('created_today')">
          ✨ Leads gerados hoje <span class="vf-count">${visitCounts.createdToday}</span>
        </button>
      </div>
    ` : ''}

    ${filterBanner}

    ${leadsLoadError ? `
      <div style="margin-bottom:10px;padding:10px 12px;background:#FEE2E2;border-radius:10px;border:1px solid #FCA5A5;font-size:12px;color:#B91C1C;line-height:1.4">
        <b>⚠️ Erro ao sincronizar com a planilha:</b> ${escapeHtml(leadsLoadError)}.<br/>
        Está vendo os leads do cache local. Clique em <b>Atualizar</b> abaixo pra tentar novamente.
      </div>
    ` : ''}

    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px">
      <div style="font-size:11px;color:#6B7280">
        ${me ? `${myLeads.length} ${myLeads.length===1?'lead':'leads'} no total` : `${allLeads.length} ${allLeads.length===1?'lead':'leads'} carregados`}
      </div>
      <button onclick="reloadLeads()" style="background:#EEF2FF;color:#3730A3;border:1px solid #C7D2FE;border-radius:8px;padding:6px 10px;font-size:11px;cursor:pointer;font-weight:600">
        🔄 Atualizar
      </button>
    </div>

    ${me ? (() => {
      if(!isLiderOuGestor){
        // Consultor: banner simples
        return `
          <div class="card-identity">
            ${avatarImg(me, 'ci-avatar')}
            <div class="ci-info">
              <div class="ci-hello">Você está como</div>
              <div class="ci-name">${escapeHtml(me)}</div>
              ${getVendedorPraca(me) ? `<div class="ci-praca">${escapeHtml(getVendedorPraca(me))}</div>` : ''}
            </div>
          </div>`;
      }
      // Líder / Gestor: seletor de vendedor
      const praça = praçaLider;
      let time;
      if(me === GESTOR){
        time = VENDEDORES.filter(v=>v.praca!=='Outros');
      } else {
        time = VENDEDORES.filter(v=>(SELLER_PRACA[v.nome]||'').toLowerCase() === praça);
      }
      const opts = time.map(v=>`<option value="${escapeHtml(v.nome)}" ${funilViewAs===v.nome?'selected':''}>${escapeHtml(v.nome)}</option>`).join('');
      const labelVendo = viewAs || 'Todo o time';
      return `
        <div class="seller-select-wrap" style="margin-bottom:12px">
          <label style="font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:6px">Visualizando leads de</label>
          <select class="seller-select" onchange="setFunilViewAs(this.value)">
            <option value="" ${!funilViewAs?'selected':''}>Todo o time</option>
            ${opts}
          </select>
        </div>`;
    })() : ''}




    <div class="kanban-search">
      <span class="kanban-search-icon">🔍</span>
      <input id="kanban-search-input" class="kanban-search-input" type="text"
             placeholder="Buscar cliente por nome, cidade, bairro..."
             value="${escapeHtml(searchQuery)}"
             oninput="setSearchQuery(this.value)"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
      ${searchQuery ? `<button class="kanban-search-clear" onclick="clearSearch()" aria-label="Limpar busca">✕</button>` : ''}
    </div>

    ${qNorm && filteredLeads.length === 0 ? `
      <div class="kanban-search-empty">
        Nenhum cliente encontrado pra "<b>${escapeHtml(searchQuery)}</b>".<br/>
        Tente parte do nome, da cidade ou do bairro.
      </div>
    ` : ''}

    <div class="kanban-tabs" id="kanban-tabs">
      ${FUNIL_STAGES.map(s => `
        <div class="kanban-tab ${s.key === kanbanActiveStage ? 'active' : ''}" onclick="goToKanbanStage('${s.key}')">
          ${s.short}<span class="count">${counts[s.key]}</span>
        </div>
      `).join('')}
    </div>

    <div class="kanban-scroll" id="kanban-scroll">
      ${FUNIL_STAGES.map((stage, idx) => {
        const items = filteredLeads.filter(l => l.stage === stage.key);
        const cards = items.length
          ? items.map(l => renderLeadCard(l, idx)).join('')
          : `<div class="kanban-col-empty">${kanbanScope==='mine' && me ? 'Nenhum lead seu nesta etapa' : 'Nenhum lead nesta etapa'}</div>`;
        return `
          <div class="kanban-col" data-stage="${stage.key}">
            <div class="kanban-col-head">
              <div class="kanban-col-title">
                <span class="kanban-col-dot" style="background:${stage.color}"></span>
                ${stage.label}
              </div>
              <div class="kanban-col-count">${items.length}</div>
            </div>
            ${cards}
          </div>
        `;
      }).join('')}
    </div>
  `;

  setTimeout(() => {
    // ⭐ Auto-fade do toast de sucesso após 4 segundos
    const toastEl = document.getElementById('kanban-toast');

      setTimeout(() => {
        toastEl.style.transition = 'opacity .4s ease, transform .4s ease';
        toastEl.style.opacity = '0';
        toastEl.style.transform = 'translateY(-8px)';
        setTimeout(() => { if (toastEl.parentNode) toastEl.remove(); }, 400);
      }, 4000);
    }

    const scrollEl = document.getElementById('kanban-scroll');
    const idx = FUNIL_STAGES.findIndex(s => s.key === kanbanActiveStage);
    if(scrollEl && idx >= 0 && scrollEl.children[idx]){
      const col = scrollEl.children[idx];
      scrollEl.scrollLeft = col.offsetLeft - 16;
    }
    if(scrollEl && !scrollEl._listenerSet){
      scrollEl._listenerSet = true;
      let scrollTimer;
      scrollEl.addEventListener('scroll', () => {
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(() => {
          const sl = scrollEl.scrollLeft;
          const cw = scrollEl.children[0].offsetWidth + 12;
          const newIdx = Math.round(sl / cw);
          const newStage = FUNIL_STAGES[Math.min(Math.max(0,newIdx), FUNIL_STAGES.length-1)];
          if(newStage && newStage.key !== kanbanActiveStage){
            kanbanActiveStage = newStage.key;
            document.querySelectorAll('.kanban-tab').forEach((t, i) => {
              t.classList.toggle('active', FUNIL_STAGES[i].key === kanbanActiveStage);
            });
          }
        }, 80);
      });
    }
  }, 0);
}

function setKanbanScope(scope){
  kanbanScope = scope;
  renderFunil();
}

// ⭐ v2.11 — Filtro por próxima interação
function setVisitFilter(filter){
  // Toggle: se clicar no filtro já ativo, desativa
  if (visitFilter === filter) {
    visitFilter = null;
  } else {
    visitFilter = filter;
  }
  // Quando ativa um filtro, vai pra primeira etapa com leads
  if (visitFilter) {
    const me = getCurrentVendedor();
    const norm = s => (s||'').replace(/\s+/g,' ').trim().toLowerCase();
    const meN = norm(me);
    const { leads: leadsInFilter } = getLeadsByVisitFilter(visitFilter);
    // Vai pra primeira etapa que tenha leads
    for (const s of FUNIL_STAGES) {
      if (leadsInFilter.some(l => l.stage === s.key)) {
        kanbanActiveStage = s.key;
        break;
      }
    }
  }
  renderFunil();
}

// v2.33 — Busca textual do Kanban. Mantém foco e cursor no input após cada keystroke.
function setSearchQuery(value){
  searchQuery = value;
  // Re-render: como o input vai ser redesenhado, vamos restaurar foco/cursor depois.
  renderFunil();
  setTimeout(() => {
    const inp = document.getElementById('kanban-search-input');
    if (inp) {
      inp.focus();
      const len = inp.value.length;
      try { inp.setSelectionRange(len, len); } catch(e){}
    }
  }, 0);
}

function clearSearch(){
  searchQuery = '';
  renderFunil();
  setTimeout(() => {
    const inp = document.getElementById('kanban-search-input');
    if (inp) inp.focus();
  }, 0);
}

// ════════════════════════════════════════════════════
// v2.32 — Modal de opções ao clicar num pill + Rota no Mapa
// ════════════════════════════════════════════════════

// Helper: dado um filterKey, devolve {leads, label} já normalizado

// v2.128 — Escopo do funil (mesma regra do kanban): gestor vê tudo, líder vê a praça,
// e respeita o seletor "Visualizando leads de" (funilViewAs). Antes o modal de recorte
// filtrava só por l.vendedor === me, então o gestor (sem leads próprios) via lista vazia.
function getFunilScopedLeads(){
  const me = getCurrentVendedor();
  if(!me) return [];
  const meN = canonicalVendedor(me);
  const GESTOR = 'Felipe Oliveira';
  const praçaLider = liderPraca(me);
  const isLiderOuGestor = me === GESTOR || !!praçaLider;
  const viewAs = (isLiderOuGestor && funilViewAs) ? funilViewAs : null;
  return window.leads.filter(l => {
    if(viewAs) return canonicalVendedor(l.vendedor) === canonicalVendedor(viewAs);
    if(me === GESTOR) return true;
    if(praçaLider){
      const lPraca = (SELLER_PRACA[canonicalVendedor(l.vendedor)] || '').toLowerCase();
      return lPraca === praçaLider || canonicalVendedor(l.vendedor) === meN;
    }
    return canonicalVendedor(l.vendedor) === meN;
  });
}

function getLeadsByVisitFilter(filterKey){
  const me = getCurrentVendedor();
  if(!me) return { leads: [], label: '' };
  const meN = canonicalVendedor(me);  // v2.46
  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = today.toISOString().slice(0,10);
  const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);
  const tomorrowStr = tomorrow.toISOString().slice(0,10);
  const dayOfWeek = today.getDay();
  const daysSinceMonday = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
  const weekStart = new Date(today); weekStart.setDate(today.getDate() - daysSinceMonday);
  const weekStartStr = weekStart.toISOString().slice(0,10);
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate() + 6);
  const weekEndStr = weekEnd.toISOString().slice(0,10);
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  const monthStartStr = monthStart.toISOString().slice(0,10);
  const monthEnd = new Date(today.getFullYear(), today.getMonth() + 1, 0);
  const monthEndStr = monthEnd.toISOString().slice(0,10);
  const ACTIVE_STAGES = ['planejados','qualificados','propostas','fechamentos'];
  const myLeads = getFunilScopedLeads().filter(l => ACTIVE_STAGES.includes(l.stage));
  if (filterKey === 'today')    return { leads: myLeads.filter(l => l.proximaInteracao === todayStr), label: 'pra hoje' };
  if (filterKey === 'tomorrow') return { leads: myLeads.filter(l => l.proximaInteracao === tomorrowStr), label: 'pra amanhã' };
  if (filterKey === 'week')     return { leads: myLeads.filter(l => l.proximaInteracao >= weekStartStr && l.proximaInteracao <= weekEndStr), label: 'desta semana (S0)' };
  if (filterKey === 'month')    return { leads: myLeads.filter(l => l.proximaInteracao >= monthStartStr && l.proximaInteracao <= monthEndStr), label: 'deste mês' };
  if (filterKey === 'overdue')  return { leads: myLeads.filter(l => l.proximaInteracao && l.proximaInteracao < todayStr), label: 'atrasados' };
  // v2.59 — leads gerados hoje (todos os stages, não filtra por ACTIVE_STAGES)
  if (filterKey === 'created_today') {
    const all = getFunilScopedLeads();
    return { leads: all.filter(l => l.createdAt && new Date(l.createdAt).toISOString().slice(0,10) === todayStr), label: 'gerados hoje' };
  }
  return { leads: [], label: '' };
}

function openVisitFilterModal(filterKey){
  const { leads, label } = getLeadsByVisitFilter(filterKey);
  const existing = document.getElementById('visit-filter-modal');
  if (existing) existing.remove();
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'visit-filter-modal';
  modal.onclick = (e) => { if(e.target === modal) closeVisitFilterModal(); };
  const icons = { today:'📅', tomorrow:'⏰', week:'📆', month:'🗓️', overdue:'⚠️', created_today:'✨' };
  const titles = { today:'Hoje', tomorrow:'Amanhã', week:'Semana atual (S0)', month:'Este mês', overdue:'Atrasados', created_today:'Gerados hoje' };
  const noLeads = leads.length === 0;
  const hasAddress = leads.some(l => {
    const e = l.endereco || {}; const c = l.coords;
    return (c && c.lat && c.lon) || (e.rua && e.cidade) || (e.cidade && e.estado);
  });
  const disableList = noLeads ? 'disabled style="opacity:.4;width:100%;padding:14px;font-size:14px;margin-top:14px"' : 'style="width:100%;padding:14px;font-size:14px;margin-top:14px"';
  const disableMap  = (noLeads || !hasAddress) ? 'disabled style="opacity:.4;width:100%;padding:14px;font-size:14px;margin-top:10px"' : 'style="width:100%;padding:14px;font-size:14px;margin-top:10px"';
  modal.innerHTML = `
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <button class="modal-close" onclick="closeVisitFilterModal()">✕</button>
      <div class="modal-title">${icons[filterKey]||''} ${titles[filterKey]||''}</div>
      <div class="modal-sub">${noLeads ? 'Nenhum cliente nesse recorte' : `${leads.length} cliente${leads.length===1?'':'s'} ${label}`}</div>
      <button class="form-btn-pri" onclick="closeVisitFilterModal();setVisitFilter('${filterKey}')" ${disableList}>
        📋 Ver lista de clientes
      </button>
      <button class="form-btn-sec" onclick="closeVisitFilterModal();openRouteInMaps('${filterKey}')" ${disableMap}>
        🗺️ Abrir rota no Google Maps
      </button>
      ${!noLeads && !hasAddress ? `<div class="prop-disclaimer" style="margin-top:12px">Nenhum cliente desse recorte tem endereço cadastrado — preciso de pelo menos endereço (rua + cidade) ou coordenadas GPS pra montar a rota.</div>` : ''}
    </div>
  `;
  document.body.appendChild(modal);
}

function closeVisitFilterModal(){
  const m = document.getElementById('visit-filter-modal');
  if (m) m.remove();
}

// Abre Google Maps Directions com a rota: sua localização → cliente 1 → ... → cliente N
// Limite do Google Maps: 10 paradas no total (1 destino + 9 waypoints). Trunca se passar.
function openRouteInMaps(filterKey){
  const { leads } = getLeadsByVisitFilter(filterKey);
  if (leads.length === 0) { alert('Nenhum cliente nesse recorte.'); return; }
  // Ordena por proximaInteracao ASC (atrasado primeiro), depois nome
  const ordered = [...leads].sort((a,b) =>
    (a.proximaInteracao||'').localeCompare(b.proximaInteracao||'')
    || (a.nome||'').localeCompare(b.nome||''));
  const stops = ordered.map(l => {
    if (l.coords && l.coords.lat && l.coords.lon) return `${l.coords.lat},${l.coords.lon}`;
    const e = l.endereco || {};
    const parts = [e.rua, e.numero, e.bairro, e.cidade, e.estado].filter(Boolean);
    return parts.length ? parts.join(', ') : '';
  }).filter(s => s && s.length > 0);
  if (stops.length === 0) { alert('Nenhum cliente nesse recorte tem endereço cadastrado.'); return; }
  const TRUNCATE = 10;
  const truncated = stops.length > TRUNCATE;
  if (truncated) stops.length = TRUNCATE;
  const destination = stops[stops.length - 1];
  const waypoints = stops.slice(0, -1).join('|');
  let url = `https://www.google.com/maps/dir/?api=1&origin=&destination=${encodeURIComponent(destination)}&travelmode=driving`;
  if (waypoints) url += `&waypoints=${encodeURIComponent(waypoints)}`;
  if (truncated) {
    alert(`Você tem ${leads.length} clientes nesse recorte, mas o Google Maps só aceita 10 paradas. Vou abrir com os ${TRUNCATE} mais antigos. Roda esses primeiro e depois volta pros restantes.`);
  }
  window.open(url, '_blank');
}


function renderLeadCard(lead, stageIdx){
  const prevStage = stageIdx > 0 ? FUNIL_STAGES[stageIdx-1] : null;
  const nextStage = stageIdx < FUNIL_STAGES.length-1 ? FUNIL_STAGES[stageIdx+1] : null;
  const isNew = lead.id === lastCreatedId;
  if(isNew) lastCreatedId = null;

  const days = Math.floor((Date.now() - lead.createdAt) / 86400000);
  const ago = days === 0 ? 'hoje' : days === 1 ? '1d' : `${days}d`;

  // Vendedor (badge no rodapé)
  const me = getCurrentVendedor();
  const isMine = lead.vendedor && canonicalVendedor(lead.vendedor) === canonicalVendedor(me);
  const vendedorBadge = lead.vendedor
    ? `<div class="lead-vendedor ${isMine ? 'mine' : ''}">
         ${avatarImg(lead.vendedor, "lv-avatar")}
         <span>${escapeHtml(lead.vendedor)}${isMine ? ' (você)' : ''}</span>
       </div>`
    : `<div class="lead-vendedor" style="color:#aaa;font-style:italic">sem vendedor identificado</div>`;

  return `
    <div class="lead-card ${isNew ? 'new' : ''}" onclick="openEditLead('${lead.id}', event)">
      <div class="lead-name">
        ${escapeHtml(lead.nome)}
        <span style="float:right;color:var(--muted);font-size:13px;font-weight:400;opacity:.6">✏️</span>
      </div>
      <div class="lead-meta">
        <span class="lead-meta-item">
          <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          ${escapeHtml(lead.loc)}
        </span>
        <span class="lead-meta-item lead-meta-tel" onclick="openPhoneActions('${escapeHtml(lead.tel).replace(/'/g, '&apos;')}', event)">
          <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          ${escapeHtml(lead.tel)}
        </span>
        <span class="lead-meta-item">⏱ ${ago}</span>
      </div>
      ${lead.proposta ? `
        <div style="margin-top:8px;padding:6px 10px;background:linear-gradient(90deg,#ECF7F1 0%,#fff 100%);border-left:3px solid #1D9E75;border-radius:6px;font-size:11px;color:#157A55;font-weight:700;display:flex;align-items:center;gap:6px">
          <span>✨</span>
          <span>Proposta gerada · economia R$ ${lead.proposta.economiaMensal.toLocaleString('pt-BR')}/mês</span>
        </div>
      ` : ''}
      ${(() => {
        if (!lead.proximaInteracao) return '';
        // v2.58 — quem já tá em Contratos não precisa mais de follow-up; some o badge
        if (lead.stage === 'contratos') return '';
        const today = new Date(); today.setHours(0,0,0,0);
        const target = new Date(lead.proximaInteracao + 'T00:00:00');
        const diff = Math.round((target - today) / 86400000);
        let label, bg, color, border, icon;
        if (diff < 0) { label = `Atrasado · ${Math.abs(diff)}d`; bg = '#FEF2F2'; color = '#991B1B'; border = '#DC2626'; icon = '⚠️'; }
        else if (diff === 0) { label = 'Visita hoje'; bg = '#EEF2FF'; color = '#3730A3'; border = '#0201F3'; icon = '📅'; }
        else if (diff === 1) { label = 'Visita amanhã'; bg = '#FEFCE8'; color = '#854D0E'; border = '#EAB308'; icon = '⏰'; }
        else { label = `Em ${diff}d`; bg = '#F4F5FA'; color = '#6B7280'; border = '#9CA3AF'; icon = '📅'; }
        return `<div style="margin-top:8px;padding:5px 10px;background:${bg};border-left:3px solid ${border};border-radius:6px;font-size:11px;color:${color};font-weight:700;display:flex;align-items:center;gap:6px">
          <span>${icon}</span><span>${label}</span>
        </div>`;
      })()}
      <div class="lead-foot">
        <div class="lead-bill">R$ ${lead.fatura.toLocaleString('pt-BR')}<span style="font-size:10px;color:var(--muted);font-weight:600">&nbsp;/ fatura</span></div>
        <div class="lead-dist">${escapeHtml(lead.dist)}</div>
      </div>
      ${vendedorBadge}
      <div class="lead-move" onclick="event.stopPropagation()">
        <button class="lead-move-btn regress" ${!prevStage?'disabled':''} onclick="event.stopPropagation();moveLead('${lead.id}', ${prevStage ? `'${prevStage.key}'` : 'null'})">
          ← ${prevStage ? prevStage.short : ''}
        </button>
        <button class="lead-move-btn advance" ${!nextStage?'disabled':''} onclick="event.stopPropagation();moveLead('${lead.id}', ${nextStage ? `'${nextStage.key}'` : 'null'})">
          ${nextStage ? nextStage.short : 'Final'} →
        </button>
      </div>
    </div>
  `;
}

// ⭐ v2.8 — Abre lead em modo edição (ou visualização se não for o dono)
function openEditLead(leadId, ev){
  // Stop propagation pra evitar dupla chamada
  if (ev) ev.stopPropagation();
  // Se clique veio em botão de mover (ou descendente), ignora
  if (ev && ev.target.closest('.lead-move-btn')) return;

  editingLeadId = leadId;
  setFunilView('cadastro'); // reusa a mesma view, mas em modo edição
}

function goToKanbanStage(key){
  kanbanActiveStage = key;
  const idx = FUNIL_STAGES.findIndex(s => s.key === key);
  const scrollEl = document.getElementById('kanban-scroll');
  if(scrollEl && scrollEl.children[idx]){
    scrollEl.scrollTo({ left: scrollEl.children[idx].offsetLeft - 16, behavior: 'smooth' });
  }
  document.querySelectorAll('.kanban-tab').forEach((t, i) => {
    t.classList.toggle('active', FUNIL_STAGES[i].key === key);
  });
}

function moveLead(id, newStage){
  if(!newStage) return;
  const lead = window.leads.find(l => l.id === id);
  if(!lead) return;
  lead.stage = newStage;
  kanbanActiveStage = newStage;
  renderFunil();
  // Sincroniza no Sheets em background
  updateLeadStage(id, newStage).then(res => {
    if (!res.ok && !res.offline) {
      console.warn('Falha ao sincronizar movimento:', res.error);
    }
  });
}

function escapeHtml(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
