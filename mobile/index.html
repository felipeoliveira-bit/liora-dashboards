// Abre Google Maps Directions com a rota: sua localização → cliente 1 → ... → cliente N
// Limite do Google Maps: 10 paradas no total (1 destino + 9 waypoints). Trunca se passar.
function openRouteInMaps(filterKey){
  const { leads } = getLeadsByVisitFilter(filterKey);
  if (leads.length === 0) { alert('Nenhum cliente nesse recorte.'); return; }
  // Ordena por proximaInteracao ASC (atrasado primeiro), depois nome
  const ordered = [...leads].sort((a,b) =>
    (a.proximaInteracao||'').localeCompare(b.proximaInteracao||'')
    || (a.nome||'').localeCompare(b.nome||''));
  const stops = ordered.map(l => {
    if (l.coords && l.coords.lat && l.coords.lon) return `${l.coords.lat},${l.coords.lon}`;
    const e = l.endereco || {};
    const parts = [e.rua, e.numero, e.bairro, e.cidade, e.estado].filter(Boolean);
    return parts.length ? parts.join(', ') : '';
  }).filter(s => s && s.length > 0);
  if (stops.length === 0) { alert('Nenhum cliente nesse recorte tem endereço cadastrado.'); return; }
  const TRUNCATE = 10;
  const truncated = stops.length > TRUNCATE;
  if (truncated) stops.length = TRUNCATE;
  const destination = stops[stops.length - 1];
  const waypoints = stops.slice(0, -1).join('|');
  let url = `https://www.google.com/maps/dir/?api=1&origin=&destination=${encodeURIComponent(destination)}&travelmode=driving`;
  if (waypoints) url += `&waypoints=${encodeURIComponent(waypoints)}`;
  if (truncated) {
    alert(`Você tem ${leads.length} clientes nesse recorte, mas o Google Maps só aceita 10 paradas. Vou abrir com os ${TRUNCATE} mais antigos. Roda esses primeiro e depois volta pros restantes.`);
  }
  window.open(url, '_blank');
}


function renderLeadCard(lead, stageIdx){
  const prevStage = stageIdx > 0 ? FUNIL_STAGES[stageIdx-1] : null;
  const nextStage = stageIdx < FUNIL_STAGES.length-1 ? FUNIL_STAGES[stageIdx+1] : null;
  const isNew = lead.id === lastCreatedId;
  if(isNew) lastCreatedId = null;

  const days = Math.floor((Date.now() - lead.createdAt) / 86400000);
  const ago = days === 0 ? 'hoje' : days === 1 ? '1d' : `${days}d`;

  // Vendedor (badge no rodapé)
  const me = getCurrentVendedor();
  const isMine = lead.vendedor && canonicalVendedor(lead.vendedor) === canonicalVendedor(me);
  const vendedorBadge = lead.vendedor
    ? `<div class="lead-vendedor ${isMine ? 'mine' : ''}">
         ${avatarImg(lead.vendedor, "lv-avatar")}
         <span>${escapeHtml(lead.vendedor)}${isMine ? ' (você)' : ''}</span>
       </div>`
    : `<div class="lead-vendedor" style="color:#aaa;font-style:italic">sem vendedor identificado</div>`;

  return `
    <div class="lead-card ${isNew ? 'new' : ''} ${(lead.temperatura||'')==='Quente'?'quente':''}" onclick="openEditLead('${lead.id}', event)">
      <div class="lead-name">
        ${escapeHtml(lead.nome)}
        <span style="float:right;color:var(--muted);font-size:13px;font-weight:400;opacity:.6">✏️</span>
      </div>
      ${isLeadPerdido(lead) ? `<div style="margin:0 0 6px;display:inline-block;background:#FEF2F2;color:#B91C1C;border:1px solid #FCA5A5;border-radius:6px;padding:2px 8px;font-size:10px;font-weight:800">🔴 PERDIDO${lead.proximaInteracao ? ' · retomar' : ''}</div>` : ''}
      <div class="lead-meta">
        <span class="lead-meta-item">
          <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          ${escapeHtml(lead.loc)}
        </span>
        <span class="lead-meta-item lead-meta-tel" onclick="openPhoneActions('${escapeHtml(lead.tel).replace(/'/g, '&apos;')}', event)">
          <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          ${escapeHtml(lead.tel)}
        </span>
        <span class="lead-meta-item">⏱ ${ago}</span>
      </div>
      ${lead.proposta ? `
        <div style="margin-top:8px;padding:6px 10px;background:linear-gradient(90deg,#ECF7F1 0%,#fff 100%);border-left:3px solid #1D9E75;border-radius:6px;font-size:11px;color:#157A55;font-weight:700;display:flex;align-items:center;gap:6px">
          <span>✨</span>
          <span>Proposta gerada · economia R$ ${lead.proposta.economiaMensal.toLocaleString('pt-BR')}/mês</span>
        </div>
      ` : ''}
      ${(() => {
        if (!lead.proximaInteracao) return '';
        // v2.58 — quem já tá em Contratos não precisa mais de follow-up; some o badge
        if (lead.stage === 'contratos') return '';
        const today = new Date(); today.setHours(0,0,0,0);
        const target = new Date(lead.proximaInteracao + 'T00:00:00');
        const diff = Math.round((target - today) / 86400000);
        let label, bg, color, border, icon;
        if (diff < 0) { label = `Atrasado · ${Math.abs(diff)}d`; bg = '#FEF2F2'; color = '#991B1B'; border = '#DC2626'; icon = '⚠️'; }
        else if (diff === 0) { label = 'Visita hoje'; bg = '#EEF2FF'; color = '#3730A3'; border = '#0201F3'; icon = '📅'; }
        else if (diff === 1) { label = 'Visita amanhã'; bg = '#FEFCE8'; color = '#854D0E'; border = '#EAB308'; icon = '⏰'; }
        else { label = `Em ${diff}d`; bg = '#F4F5FA'; color = '#6B7280'; border = '#9CA3AF'; icon = '📅'; }
        return `<div style="margin-top:8px;padding:5px 10px;background:${bg};border-left:3px solid ${border};border-radius:6px;font-size:11px;color:${color};font-weight:700;display:flex;align-items:center;gap:6px">
          <span>${icon}</span><span>${label}</span>
        </div>`;
      })()}
      <div class="lead-foot">
        <div class="lead-bill">R$ ${lead.fatura.toLocaleString('pt-BR')}<span style="font-size:10px;color:var(--muted);font-weight:600">&nbsp;/ fatura</span></div>
        <div class="lead-dist">${escapeHtml(lead.dist)}</div>
      </div>
      ${vendedorBadge}
      <div class="lead-move" onclick="event.stopPropagation()">
        <button class="lead-move-btn regress" ${!prevStage?'disabled':''} onclick="event.stopPropagation();moveLead('${lead.id}', ${prevStage ? `'${prevStage.key}'` : 'null'})">
          ← ${prevStage ? prevStage.short : ''}
        </button>
        <button class="lead-move-btn advance" ${!nextStage?'disabled':''} onclick="event.stopPropagation();moveLead('${lead.id}', ${nextStage ? `'${nextStage.key}'` : 'null'})">
          ${nextStage ? nextStage.short : 'Final'} →
        </button>
      </div>
    </div>
  `;
}

// ⭐ v2.8 — Abre lead em modo edição (ou visualização se não for o dono)
function openEditLead(leadId, ev){
  // Stop propagation pra evitar dupla chamada
  if (ev) ev.stopPropagation();
  // Se clique veio em botão de mover (ou descendente), ignora
  if (ev && ev.target.closest('.lead-move-btn')) return;

  editingLeadId = leadId;
  setFunilView('cadastro'); // reusa a mesma view, mas em modo edição
}

function goToKanbanStage(key){
  kanbanActiveStage = key;
  const idx = FUNIL_STAGES.findIndex(s => s.key === key);
  const scrollEl = document.getElementById('kanban-scroll');
  if(scrollEl && scrollEl.children[idx]){
    scrollEl.scrollTo({ left: scrollEl.children[idx].offsetLeft - 16, behavior: 'smooth' });
  }
  document.querySelectorAll('.kanban-tab').forEach((t, i) => {
    t.classList.toggle('active', FUNIL_STAGES[i].key === key);
  });
}

function moveLead(id, newStage){
  if(!newStage) return;
  const lead = window.leads.find(l => l.id === id);
  if(!lead) return;
  lead.stage = newStage;
  kanbanActiveStage = newStage;
  renderFunil();
  // Sincroniza no Sheets em background
  updateLeadStage(id, newStage).then(res => {
    if (!res.ok && !res.offline) {
      console.warn('Falha ao sincronizar movimento:', res.error);
    }
  });
}

const STAGE_DESC={'WAITING_DOCUMENTS':'Falta documento pra análise','BACKGROUND_CHECKING':'Em processo de análise do time de Ops','BACKGROUND CHECKING':'Em processo de análise do time de Ops','BGC_PARCEIRO':'Já aprovado na análise de risco; agora em análise do Antecipa (parte 2). Prazo de até 1,5 dia útil.','BGC_REVIEW':'Em processo de análise do time de Ops','REQUEST_TITULARIDADE':'Aprovado na análise, aguardando processo de troca de titularidade','TITULARIDADE_ONGOING':'Troca de titularidade solicitada, aguardando confirmação da distribuidora','TITULARIDADE ONGOING':'Troca de titularidade solicitada, aguardando confirmação da distribuidora','REGISTERING_DG':'Troca de titularidade aprovada, aguardando cadastro na DG para gerar a fatura','ACTIVE_MEMBER':'Troca aprovada e cliente cadastrado na DG para gerar faturas Liora','ACTIVE MEMBER':'Troca aprovada e cliente cadastrado na DG para gerar faturas Liora'};
const CREDIT_DESC={'PENDENTE':['Em análise de crédito','Ainda em análise de crédito. Alta taxa de aprovação, mas pode eventualmente ser negado.'],'ANÁLISE_DE_CRÉDITO_REJEITADA':['Crédito rejeitado','Reprovado na análise de crédito — entra uma análise de risco negada por cima.'],'COLETANDO_INFORMAÇÕES_DE_DEPÓSITO':['Preparando o pagamento','Puxando as informações para lançar o pagamento.'],'AGUARDANDO_APROVAÇÃO_DE_PAGAMENTO':['Aguardando o pagamento','Pagamento já cadastrado — aguardando aprovação e/ou execução do desembolso.'],'PAGAMENTO_REALIZADO':['Pagamento realizado','Desembolso feito — entra a aprovação final por cima.'],'AGUARDANDO_CONFIRMAÇÃO_DO_CLIENTE':['Aguardando o cliente','Aguardando confirmação do cliente.'],'AGUARDANDO_RESPOSTA_DO_CLIENTE':['Aguardando o cliente','Aguardando resposta do cliente.'],'VERIFICANDO_FORMA_DE_PAGAMENTO':['Definindo a forma de pagamento','Confirmando com o cliente como o Antecipa será pago.'],'PAGAMENTO_REJEITADO':['Pagamento rejeitado','O desembolso foi rejeitado — precisa refazer.'],'ENVIO_DE_COMUNICADOS_DE_RECUPERAÇÃO':['Em recuperação','Cliente em régua de recuperação.']};
function prettyProdTitle(s){return s.split(/\s+/).filter(function(w){return w;}).map(function(w){var L=w.replace(/[^A-Za-zÀ-ÿ]/g,'');if(L.length<=4&&w===w.toUpperCase())return w;var lw=w.toLowerCase();return lw.replace(/([a-zà-ÿ])/,function(m){return m.toUpperCase();});}).join(' ');}
function prettyProduto(raw){if(raw==null)return '';var s=String(raw).trim();if(!s)return '';var U=s.toUpperCase();if(U.indexOf('LIORA_ANTECIPA_PF')===0)return 'Antecipa PF';if(U.indexOf('LIORA_ANTECIPA_PJ')===0)return 'Antecipa PJ';if(U.indexOf('LIORA_B_')===0||U==='LIORA_B')return 'Liora Blindado';if(U.indexOf('LIORA_F_')===0||U==='LIORA_F')return 'Liora Flex';if(U.indexOf('BUNDLE')===0)return s;s=s.replace(/\s*-\s*.*$/,'');s=s.replace(/(_\d+(\.\d+)?)+$/,'');s=s.replace(/\s+\d+$/,'');if(s.indexOf('_')>-1){var parts=s.split('_').filter(function(x){return x.trim();});var forn=parts.shift();var dist=parts.join(' ').replace(/\s+/g,' ').trim();s=dist?(forn+' ('+dist+')'):forn;}return prettyProdTitle(s);}
// QUEM ASSINOU (Felipe 27/08): x.c e' o TITULAR PARSEADO DA FATURA. Quando a UC
// esta no nome de um parente/antigo dono, o card mostrava uma pessoa e o vendedor
// procurava por outra (Helenita x MAURICIO JOSE BONFIM, Olimpio, 25/08). O build so
// preenche x.sig quando o signatario e' outra PESSOA (typo/apelido/abreviacao NAO
// entram - ver mesma_pessoa no slice_base). Aqui e' so mostrar o que veio.
function sigLine(x){
  var v = (x && x.sig || '').trim();
  return v ? '<div class="client-signer">\u270D\uFE0F assinou: ' + escapeHtml(v) + '</div>' : '';
}
function escapeHtml(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
